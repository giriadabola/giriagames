<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>22bet Table Copier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 16px;
    }
    .icon {
      font-size: 24px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #00e699;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .status-card strong {
      color: #38bdf8;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
    }
    .btn-excel {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    }
    .btn-excel:hover {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    }
    .btn-json {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }
    .btn-json:hover {
      background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 16px;
      font-size: 10px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">⚽</div>
    <div>
      <div class="title">22bet Table Copier</div>
      <div class="subtitle">Extrator de Odds e Mercados</div>
    </div>
  </div>

  <div class="status-card" id="statusBox">
    Status: <strong id="statusText">Pronto para extrair...</strong>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnCopyText">
      <span>📋</span> Copiar em Texto Formatado
    </button>
    <button class="btn btn-excel" id="btnCopyExcel">
      <span>📊</span> Copiar para Excel / Sheets
    </button>
    <button class="btn btn-json" id="btnCopyJSON">
      <span>🛠️</span> Exportar em JSON
    </button>
  </div>

  <div class="footer">
    Desenvolvido para 22bet4me.com
  </div>

  <script src="popup.js"></script>
</body>
</html>
