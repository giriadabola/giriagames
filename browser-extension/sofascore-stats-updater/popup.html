<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Atualizar Estatísticas 25/26</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      line-height: 1.4;
      color: #94a3b8;
      margin: 0 0 14px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 11px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
      background: #475569;
      box-shadow: none;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 24px;
      white-space: pre-wrap;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .sub-btn {
      flex: 1;
      background: #334155;
      font-size: 11px;
      padding: 7px;
      box-shadow: none;
      font-weight: 600;
    }
    .sub-btn:hover {
      background: #475569;
    }
    .ok { color: #34d399; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>⚡ Atualizar Estatísticas (25/26)</h1>
  <p>Abra o modal de edição de um jogador em <code>admin/editar-jogadores.html</code> e clique no botão abaixo.</p>

  <button id="start-btn">Atualizar Estatísticas Sofascore</button>
  <div id="status"></div>

  <div class="btn-row">
    <button id="logs-btn" class="sub-btn">Atualizar Logs</button>
    <button id="copy-btn" class="sub-btn" style="background: #0284c7;">📋 Copiar Logs</button>
  </div>
  <pre id="log-output" style="max-height: 160px; overflow: auto; white-space: pre-wrap; font-size: 10px; color: #cbd5e1; margin-top: 8px; background: #020617; padding: 8px; border-radius: 6px; border: 1px solid #1e293b;"></pre>

  <script src="popup.js"></script>
</body>
</html>
