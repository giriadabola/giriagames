<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 310px; font-family: 'Segoe UI', Arial, sans-serif; background: #090c10; color: #f0f2f5; margin: 0; padding: 16px; box-sizing: border-box; }
    h2 { font-size: 16px; color: #2176ff; margin: 0 0 10px; text-align: center; font-weight: 700; }
    p { font-size: 12px; color: #8892b0; margin-bottom: 12px; text-align: center; line-height: 1.4; }
    .status-badge { display: block; padding: 8px; background: rgba(33, 118, 255, 0.15); border: 1px solid rgba(33, 118, 255, 0.3); border-radius: 6px; font-size: 12px; color: #3b82f6; text-align: center; font-weight: bold; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #8892b0; margin-bottom: 6px; font-weight: 600; }
    select { width: 100%; padding: 10px; border-radius: 6px; background: #161c28; color: #fff; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; outline: none; cursor: pointer; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 6px; }
    .btn-primary { background: linear-gradient(135deg, #2176ff, #1a62d6); color: white; }
    .btn-primary:hover { background: linear-gradient(135deg, #1a62d6, #144eb0); }
    .btn-danger { background: #e74c3c; color: white; margin-top: 8px; }
    .btn-danger:hover { background: #c0392b; }
    .progress-box { background: #161c28; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 12px; margin-top: 10px; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h2>Batch Importador de Épocas</h2>
  <div class="status-badge" id="status">● Extensão Ativa</div>

  <div id="editar-jogadores-panel" style="display: none;">
    <div class="form-group">
      <label for="season-select">Temporada a Criar / Importar:</label>
      <select id="season-select"></select>
    </div>
    <button id="btn-start-batch" class="btn-primary">Avançar &amp; Iniciar Batch</button>
  </div>

  <div id="batch-running-panel" style="display: none;">
    <div class="progress-box">
      <div id="batch-progress-text" style="font-weight: bold; color: #2ecc71; margin-bottom: 6px;">● A processar batch...</div>
      <div id="batch-player-text" style="color: #8892b0; font-size: 11px;">Carregando...</div>
    </div>
    <button id="btn-stop-batch" class="btn-danger">🛑 Parar Processo</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
