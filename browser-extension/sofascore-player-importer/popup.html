<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Importar jogador</title>
  <style>
    body { width: 290px; margin: 0; padding: 16px; font: 14px Arial, sans-serif; color: #172033; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    p { line-height: 1.4; color: #4f5d75; margin-bottom: 12px; }
    button { width: 100%; border: 0; border-radius: 7px; padding: 10px; background: #1769aa; color: white; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 34px; margin-top: 12px; font-size: 12px; white-space: pre-wrap; }
    .ok { color: #16734a; } .error { color: #b42318; }
    .warning { color: #b54708; }

    .server-status-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .online .dot { background-color: #12b76a; box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.25); }
    .online { color: #027a48; background-color: #ecfdf3; border-color: #abefc6; }

    .offline .dot { background-color: #f04438; box-shadow: 0 0 0 3px rgba(240, 68, 56, 0.25); }
    .offline { color: #b42318; background-color: #fef3f2; border-color: #fecdca; }

    .checking .dot { background-color: #f79009; }
    .checking { color: #b54708; background-color: #fffaeb; border-color: #fedf89; }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
    <img src="icon.png" width="32" height="32" style="border-radius: 8px;">
    <h1 style="margin: 0;">Importar jogador</h1>
  </div>

  <div id="server-badge" class="server-status-box checking">
    <span class="dot"></span>
    <span id="server-text">A verificar servidor...</span>
  </div>

  <p>Abra o perfil do jogador no Sofascore e mantenha o painel de administração aberto.</p>
  <button id="import">Importar jogador actual</button>
  <div id="status"></div>
  <button id="logs" style="margin-top:8px;background:#68758a">Ver log</button>
  <pre id="log-output" style="max-height:180px;overflow:auto;white-space:pre-wrap;font-size:10px"></pre>
  <script src="popup.js"></script>
</body>
</html>
