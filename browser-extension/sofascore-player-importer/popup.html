<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Importar jogador</title>
  <style>
    body { width: 290px; margin: 0; padding: 16px; font: 14px Arial, sans-serif; color: #172033; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    p { line-height: 1.4; color: #4f5d75; }
    button { width: 100%; border: 0; border-radius: 7px; padding: 10px; background: #1769aa; color: white; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 34px; margin-top: 12px; font-size: 12px; white-space: pre-wrap; }
    .ok { color: #16734a; } .error { color: #b42318; }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
    <img src="icon.png" width="32" height="32" style="border-radius: 8px;">
    <h1 style="margin: 0;">Importar jogador</h1>
  </div>
  <p>Abra o perfil do jogador no Sofascore e mantenha o painel de administração aberto.</p>
  <button id="import">Importar jogador actual</button>
  <div id="status"></div>
  <button id="logs" style="margin-top:8px;background:#68758a">Ver log</button>
  <pre id="log-output" style="max-height:180px;overflow:auto;white-space:pre-wrap;font-size:10px"></pre>
  <script src="popup.js"></script>
</body>
</html>
