<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Equipa - Ggames</title>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="myteam/myteam.css?v=1.0.5">
    <link rel="stylesheet" href="core/rival-squads-view.css?v=1.0.0">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div class="content">
        <div class="header-container">
            <div class="title-section">
                <h1 class="market-title">Minha Equipa</h1>
            </div>
        </div>

        <div class="myteam-tabs">
            <button class="tab-btn active" id="tab-my-team">
                <i class="fas fa-users"></i> EQUIPA
            </button>
            <button class="tab-btn" id="tab-sell-players">
                <i class="fas fa-coins"></i> VENDER
            </button>
            <button class="tab-btn" id="tab-rival-squads">
                <i class="fas fa-futbol"></i> RIVAIS
            </button>
        </div>

        <div id="sell-players-section" class="sell-players-section" style="display: none;">
            <div id="sell-players-list" class="players-grid">
                <p>A carregar jogadores para vender...</p>
            </div>
        </div>

        <div id="rival-squads-section" class="myteam-rival-section" style="display: none;">
            <div id="myteam-rivals-view" class="rival-squads-view">
                <div class="rival-squads-layout">
                    <div class="rival-pitch-side">
                        <div class="rival-formation-options">
                            <label for="myteam-rival-user-select">GPlayers:</label>
                            <select id="myteam-rival-user-select" data-rival-user-select>
                                <option value="">Selecione um GPlayer</option>
                            </select>
                            <i class="fas fa-spinner fa-spin rival-spinner" data-rival-spinner style="display: none;"></i>

                            <select class="rival-formation-select" data-rival-formation-select>
                                <option value="4-4-2">4-4-2</option>
                                <option value="4-3-3">4-3-3</option>
                                <option value="4-5-1">4-5-1</option>
                                <option value="3-4-3">3-4-3</option>
                                <option value="5-3-2">5-3-2</option>
                            </select>
                        </div>

                        <div class="rival-pitch-container">
                            <div class="rival-stage texture">
                                <div class="rival-world">
                                    <div class="rival-terrain">
                                        <div class="rival-field rival-field--alt"></div>
                                        <div class="rival-field">
                                            <div class="rival-field__texture rival-field__texture--gradient"></div>
                                            <div class="rival-field__texture rival-field__texture--gradient-b"></div>
                                            <div class="rival-field__texture rival-field__texture--grass"></div>
                                            <div class="rival-field__line rival-field__line--goal"></div>
                                            <div class="rival-field__line rival-field__line--goal rival-field__line--goal-far"></div>
                                            <div class="rival-field__line rival-field__line--outline"></div>
                                            <div class="rival-field__line rival-field__line--penalty"></div>
                                            <div class="rival-field__line rival-field__line--penalty-arc"></div>
                                            <div class="rival-field__line rival-field__line--penalty-arc rival-field__line--penalty-arc-far"></div>
                                            <div class="rival-field__line rival-field__line--mid"></div>
                                            <div class="rival-field__line rival-field__line--circle"></div>
                                            <div class="rival-field__line rival-field__line--penalty rival-field__line--penalty-far"></div>
                                            <div class="rival-pitch-area" data-rival-pitch-area></div>
                                        </div>
                                        <div class="rival-field__side rival-field__side--front"></div>
                                        <div class="rival-field__side rival-field__side--left"></div>
                                        <div class="rival-field__side rival-field__side--right"></div>
                                        <div class="rival-field__side rival-field__side--back"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rival-player-selection-side">
                        <div class="rival-starting-eleven-section">
                            <h2>11 Titulares</h2>
                            <div class="rival-starting-eleven-container" data-rival-starting-eleven></div>
                        </div>

                        <div class="rival-substitutes-section">
                            <h2>Suplentes</h2>
                            <div class="rival-substitutes-container" data-rival-substitutes></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="team-section">
            <div class="pitch-side">
                <div class="formation-options">
                    <div class="formation-controls">
                        <div class="formation-select-container">
                            <label for="formation-select">Formação:</label>
                            <select id="formation-select">
                                <option value="" disabled selected>Selecionar Formação</option>
                            </select>
                        </div>
                        <button id="saveFormationBtn">Guardar</button>
                        <button id="chooseBtn">Escolher</button>
                    </div>
                </div>

                <div class="pitch-container">
                    <div class="pitch-area">
                        <div class="center-circle"></div>
                    </div>
                </div>
            </div>

            <div class="player-selection-side">
                <div class="search-container">
                    <input type="text" id="player-search" placeholder="Pesquisar jogador...">
                    <div class="filter-dropdowns">
                        <select id="country-filter">
                            <option value="">País (Todos)</option>
                        </select>
                        <select id="club-filter">
                            <option value="">Clube (Todos)</option>
                        </select>
                        <select id="position-filter">
                            <option value="">Posição (Todas)</option>
                        </select>
                    </div>
                </div>
                <div class="player-results">
                    No data available in table
                </div>
            </div>
        </div>
    </div>

    <!-- Player List Modal -->
    <div id="playerListModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Escolha um Jogador</h3>
            <div id="playerCardList" class="player-results">
                <p>A carregar jogadores...</p>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="closePlayerListModal">Fechar</button>
            </div>
        </div>
    </div>

    <div id="player-stat-card-overlay" class="modal-overlay">
        <div id="player-stat-card" class="player-stat-card">
            <span class="card-close-btn">&times;</span>

            <div class="card-header">
                <div class="card-overall-pos">
                    <div id="card-player-overall" class="card-player-overall">--</div>
                    <div id="card-player-position" class="card-player-position">---</div>
                </div>
                <div class="card-logos">
                    <img id="card-country-flag" class="card-country-flag" src="" alt="País">
                    <img id="card-club-logo" class="card-club-logo" src="" alt="Clube">
                </div>
            </div>

            <div id="card-player-image" class="card-player-image">
                <img src="" alt="Jogador">
            </div>

            <div id="card-player-name" class="card-player-name">Carregando...</div>

            <div class="card-stats-grid"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="myteam/myteam.js?v=1.0.5"></script>
    <script src="core/menu-component.js"></script> 
    <script src="core/top-bar-component.js" type="module"></script>
</body>
</html>
