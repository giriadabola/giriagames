<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso negado — Gíria Games</title>
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 30%, rgba(231, 76, 60, 0.14), transparent 34%),
                #090c10;
            color: #f0f2f5;
            font-family: 'Poppins', Arial, sans-serif;
        }

        main {
            width: min(460px, 100%);
            padding: 38px 32px;
            text-align: center;
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
        }

        .icon {
            display: grid;
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            place-items: center;
            background: rgba(231, 76, 60, 0.16);
            border: 1px solid rgba(231, 76, 60, 0.4);
            border-radius: 50%;
            color: #ff6b5f;
            font-size: 30px;
            font-weight: 800;
        }

        h1 { margin: 0 0 10px; color: #ffffff; font-size: 26px; }
        p { margin: 0 0 26px; color: #9aa5bd; line-height: 1.6; }

        a {
            display: inline-flex;
            padding: 12px 22px;
            color: #ffffff;
            background: linear-gradient(135deg, #2176ff, #0056d6);
            border-radius: 9px;
            box-shadow: 0 6px 18px rgba(33, 118, 255, 0.28);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover { background: linear-gradient(135deg, #1a5cc4, #0d4cb3); }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">!</div>
        <h1>Acesso negado</h1>
        <p>A tua conta não tem permissão para aceder a esta área administrativa.</p>
        <a href="/">Voltar à página inicial</a>
    </main>
</body>
</html>
