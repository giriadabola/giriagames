<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação Rápida de 3ª Categoria</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 700px;
            max-width: 95%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        .form-group select,
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-group textarea {
            min-height: 250px;
            font-family: monospace;
        }
        button {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        #status {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #007bff;
            animation: spin 1s ease infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Criação Rápida de 3ª Categoria</h1>
        <form id="bulkCreateForm">
            <div class="form-group">
                <label for="categoriaPai">Categoria Pai</label>
                <select id="categoriaPai" required>
                    <option value="">Selecione uma Categoria...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="subcategoriaPai">Subcategoria Pai</label>
                <select id="subcategoriaPai" required disabled>
                    <option value="">Selecione uma Subcategoria...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="icon">Icon / Emoji</label>
                <input type="text" id="icon" required placeholder="Ex: ⏱️">
            </div>
            <div class="form-group">
                <label for="itemList">Lista de Itens</label>
                <textarea id="itemList" rows="15" required placeholder="Cole sua lista aqui. Formato: Indice Inglês (Nome em Português)"></textarea>
            </div>
            <button type="submit" id="submitButton">Criar Itens em Massa</button>
        </form>
        <div id="status">
            <div class="spinner"></div>
            <span id="statusText">Processando...</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="module">
        // Initialize Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyD8WcFD7jC55feYYqdY7aJSgxXyXkEjTX0", // KEEP YOUR ACTUAL API KEY
          authDomain: "g-games-8a8fc.firebaseapp.com",
          projectId: "g-games-8a8fc",
          storageBucket: "g-games-8a8fc.appspot.com",
          messagingSenderId: "689897349449",
          appId: "1:689897349449:web:536599794579901beb7a98",
          measurementId: "G-GTTPJ6G5MD"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        // --- DOM Elements ---
        const form = document.getElementById('bulkCreateForm');
        const categoriaPaiSelect = document.getElementById('categoriaPai');
        const subcategoriaPaiSelect = document.getElementById('subcategoriaPai');
        const iconInput = document.getElementById('icon');
        const itemListTextarea = document.getElementById('itemList');
        const submitButton = document.getElementById('submitButton');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');

        let todasCompeticoes = [];

        // --- Data Loading Functions ---
        async function popularDropdownCategorias() {
            try {
                const querySnapshot = await db.collection('oddcategorias')
                    .where('categoria_subcategoria_3cat', '==', 'categoria').orderBy('ordem', 'asc').get();
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    const option = new Option(data.nomecategoria, doc.id);
                    categoriaPaiSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar categorias:", error);
                alert("Não foi possível carregar as categorias.");
            }
        }

        async function popularDropdownSubcategorias(categoriaId) {
            subcategoriaPaiSelect.innerHTML = '<option value="">Carregando...</option>';
            subcategoriaPaiSelect.disabled = true;
            try {
                const querySnapshot = await db.collection('oddcategorias')
                    .where('categoria_subcategoria_3cat', '==', 'subcategoria')
                    .where('categoriapai', '==', categoriaId)
                    .orderBy('ordem', 'asc').get();

                subcategoriaPaiSelect.innerHTML = '<option value="">Selecione uma Subcategoria...</option>';
                if (querySnapshot.empty) {
                    subcategoriaPaiSelect.innerHTML = '<option value="">Nenhuma subcategoria encontrada</option>';
                    return;
                }
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    const option = new Option(data.nomesubcategoria, doc.id);
                    subcategoriaPaiSelect.appendChild(option);
                });
                subcategoriaPaiSelect.disabled = false;
            } catch (error) {
                console.error("Erro ao carregar subcategorias:", error);
                subcategoriaPaiSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                alert("Não foi possível carregar as subcategorias.");
            }
        }

        async function carregarTodasCompeticoes() {
            if (todasCompeticoes.length > 0) return todasCompeticoes;
            try {
                const snapshot = await db.collection('competicoes').get();
                todasCompeticoes = snapshot.docs.map(doc => doc.data().nome);
                return todasCompeticoes;
            } catch (error) {
                console.error("Erro ao carregar competições:", error);
                return [];
            }
        }

        // --- Event Listeners ---
        categoriaPaiSelect.addEventListener('change', () => {
            const selectedId = categoriaPaiSelect.value;
            if (selectedId) {
                popularDropdownSubcategorias(selectedId);
            } else {
                subcategoriaPaiSelect.innerHTML = '<option value="">Selecione uma Subcategoria...</option>';
                subcategoriaPaiSelect.disabled = true;
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const categoriaId = categoriaPaiSelect.value;
            const subcategoriaId = subcategoriaPaiSelect.value;
            const iconValue = iconInput.value.trim();
            const itemsText = itemListTextarea.value.trim();

            if (!categoriaId || !subcategoriaId || !iconValue || !itemsText) {
                alert("Por favor, preencha todos os campos e a lista de itens.");
                return;
            }

            submitButton.disabled = true;
            statusDiv.style.display = 'block';
            statusText.textContent = "A iniciar processo...";

            try {
                statusText.textContent = "A processar a lista de itens...";
                const lines = itemsText.split('\n').filter(line => line.trim() !== '');
                const itemsToCreate = [];

                for (const line of lines) {
                    // ===== AQUI ESTÁ A ALTERAÇÃO =====
                    // Antes (preguiçoso): /(.*?)\s*\((.*?)\)/
                    // Agora (ganancioso): /(.*)\s*\((.*?)\)/
                    const match = line.match(/(.*)\s*\((.*?)\)/);
                    // ================================

                    if (match && match[1] && match[2]) {
                        itemsToCreate.push({
                            indiceIngles: match[1].trim(),
                            nome3categoria: match[2].trim()
                        });
                    } else {
                        console.warn(`Linha ignorada por não corresponder ao formato: "${line}"`);
                    }
                }

                if (itemsToCreate.length === 0) {
                    throw new Error("Nenhum item válido foi encontrado na lista. Verifique o formato.");
                }

                statusText.textContent = "A carregar dados de suporte (competições, ordem)...";
                const competicoes = await carregarTodasCompeticoes();
                const ordemSnapshot = await db.collection('oddcategorias').where('subcategoriapai', '==', subcategoriaId).get();
                let ordemInicial = ordemSnapshot.size + 1;

                statusText.textContent = `A preparar ${itemsToCreate.length} itens para criação...`;
                const batch = db.batch();

                itemsToCreate.forEach((item, index) => {
                    const newDocRef = db.collection("oddcategorias").doc();
                    const docData = {
                        categoria_subcategoria_3cat: "3cat",
                        categoriapai: categoriaId,
                        subcategoriapai: subcategoriaId,
                        nome3categoria: item.nome3categoria,
                        indiceIngles: item.indiceIngles,
                        breveDescricao: "",
                        ordem: ordemInicial + index,
                        competicoes: competicoes,
                        icon: iconValue,
                        ativado: true
                    };
                    batch.set(newDocRef, docData);
                });
                
                statusText.textContent = "A enviar dados para a base de dados...";
                await batch.commit();

                alert(`${itemsToCreate.length} itens da 3ª Categoria foram criados com sucesso!`);
                itemListTextarea.value = '';
            
            } catch (error) {
                console.error("Erro na criação em massa:", error);
                alert("Ocorreu um erro: " + error.message);
            } finally {
                submitButton.disabled = false;
                statusDiv.style.display = 'none';
            }
        });

        // --- Initial Load ---
        popularDropdownCategorias();

    </script>
</body>
</html>
