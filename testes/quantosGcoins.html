<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de G-Coins da Temporada</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 25px;
        }
        .season-info {
            background-color: #e9f5ff;
            border-left: 5px solid #007bff;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            text-align: center;
        }
        .season-info p {
            margin: 5px 0;
            font-size: 1.1em;
        }
        .season-info strong {
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1.05em;
        }
        .form-group input {
            width: calc(100% - 24px);
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #218838;
        }
        button:active {
            transform: translateY(1px);
        }
        .results {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none; /* Começa escondido */
            animation: fadeIn 0.5s ease-in-out;
        }
        .results h2 {
            margin-top: 0;
        }
        .results p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        .results.success {
            background-color: #d4edda;
            border-left: 5px solid #28a745;
            color: #155724;
        }
        .results.warning {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            color: #856404;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de G-Coins da Temporada</h1>

        <div class="season-info">
            <p>Temporada Atual: <strong id="season-name">--</strong></p>
            <p>Termina em: <strong id="season-end-date">--</strong></p>
        </div>

        <div class="form-group">
            <label for="current-gcoins">Quantos G-Coins você tem agora?</label>
            <input type="number" id="current-gcoins" placeholder="Ex: 250">
        </div>

        <div class="form-group">
            <label for="daily-gcoins">Quantos G-Coins você ganha por dia (em média)?</label>
            <input type="number" id="daily-gcoins" placeholder="Ex: 50">
        </div>
        
        <div class="form-group">
            <label for="target-gcoins">Qual a sua meta de G-Coins?</label>
            <input type="number" id="target-gcoins" placeholder="Ex: 950 (Passe de Batalha)">
        </div>

        <button id="calculate-btn">Calcular</button>

        <div id="results-container" class="results">
            <h2 id="results-title"></h2>
            <p id="results-text"></p>
        </div>
    </div>

    <script>
        'use strict';

        // --- Seleção dos Elementos do DOM ---
        const seasonNameEl = document.getElementById('season-name');
        const seasonEndDateEl = document.getElementById('season-end-date');
        const currentGcoinsInput = document.getElementById('current-gcoins');
        const dailyGcoinsInput = document.getElementById('daily-gcoins');
        const targetGcoinsInput = document.getElementById('target-gcoins');
        const calculateBtn = document.getElementById('calculate-btn');
        const resultsContainer = document.getElementById('results-container');
        const resultsTitle = document.getElementById('results-title');
        const resultsText = document.getElementById('results-text');

        // --- Funções Principais ---

        /**
         * ESTA É A FUNÇÃO QUE ESTAVA DUPLICADA. AGORA EXISTE APENAS UMA VEZ.
         * Simula a busca de dados da temporada atual.
         * Em uma aplicação real, isto faria uma chamada a uma API.
         */
        function fetchCurrentSeason() {
            const today = new Date();
            const endOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0); // Último dia do mês atual
            
            const seasonData = {
                name: `Temporada ${today.toLocaleString('pt-br', { month: 'long' })}`,
                endDate: endOfMonth
            };
            return seasonData;
        }

        /**
         * Formata um objeto Date para uma string "dd/mm/yyyy".
         */
        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        /**
         * Mostra as informações da temporada na página.
         */
        function displaySeasonInfo(season) {
            seasonNameEl.textContent = season.name;
            seasonEndDateEl.textContent = formatDate(season.endDate);
        }

        /**
         * Realiza o cálculo principal e exibe os resultados.
         */
        function calculateGcoins() {
            // Obter e validar os valores dos inputs
            const currentGcoins = parseInt(currentGcoinsInput.value) || 0;
            const dailyGcoins = parseInt(dailyGcoinsInput.value) || 0;
            const targetGcoins = parseInt(targetGcoinsInput.value) || 0;

            if (dailyGcoins <= 0) {
                alert("Por favor, insira uma média de ganho diário de G-Coins maior que zero.");
                return;
            }

            // Obter dados da temporada e calcular dias restantes
            const season = fetchCurrentSeason();
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Normalizar para o início do dia
            
            const msPerDay = 1000 * 60 * 60 * 24;
            const daysRemaining = Math.ceil((season.endDate - today) / msPerDay);

            if (daysRemaining < 0) {
                resultsTitle.textContent = "Temporada Encerrada!";
                resultsText.textContent = "Esta temporada já terminou. Aguarde a próxima para fazer novos cálculos.";
                resultsContainer.className = 'results warning';
                resultsContainer.style.display = 'block';
                return;
            }
            
            // Calcular projeções
            const projectedEarnings = daysRemaining * dailyGcoins;
            const finalGcoins = currentGcoins + projectedEarnings;
            const neededForTarget = targetGcoins - finalGcoins;

            // Exibir resultados
            let title, text, resultClass;

            if (neededForTarget <= 0) {
                title = "🎉 Meta Atingida!";
                text = `Você terá aproximadamente <strong>${finalGcoins.toLocaleString('pt-br')}</strong> G-Coins no final da temporada. Isso é <strong>${Math.abs(neededForTarget).toLocaleString('pt-br')}</strong> a mais do que a sua meta de ${targetGcoins.toLocaleString('pt-br')}. Bom trabalho!`;
                resultClass = 'success';
            } else {
                title = "⚠️ Atenção!";
                text = `Com seu ritmo atual, você terá aproximadamente <strong>${finalGcoins.toLocaleString('pt-br')}</strong> G-Coins no final da temporada. Faltarão <strong>${neededForTarget.toLocaleString('pt-br')}</strong> para atingir sua meta de ${targetGcoins.toLocaleString('pt-br')}.`;
                resultClass = 'warning';
            }
            
            resultsTitle.textContent = title;
            resultsText.innerHTML = text;
            resultsContainer.className = `results ${resultClass}`;
            resultsContainer.style.display = 'block';
        }

        // --- Inicialização e Event Listeners ---

        // Evento que é disparado quando o HTML da página está completamente carregado
        document.addEventListener('DOMContentLoaded', () => {
            const season = fetchCurrentSeason();
            displaySeasonInfo(season);
        });

        // Evento de clique no botão de calcular
        calculateBtn.addEventListener('click', calculateGcoins);

    </script>
</body>
</html>
