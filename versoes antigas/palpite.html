<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpite - Ggames</title>
        <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="palpite/palpite.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <!-- Add Error Popup -->
    <div id="error-popup" class="popup">
        <div class="popup-content">
            <span class="close-popup">×</span>
            <div class="popup-message"></div>
        </div>
    </div>

    <!-- Add Confirm Popup -->
    <div id="confirm-popup" class="popup">
        <div class="popup-content">
            <span class="close-popup" onclick="closeConfirmPopup()">×</span>
            <h3>Confirmar Palpites?</h3>
            <div id="prediction-summary">
                <!-- Prediction summary will be displayed here -->
            </div>
            <div class="confirm-buttons">
                <button class="confirm-button" onclick="confirmPredictions()">Palpitar</button>
                <button class="decline-button" onclick="closeConfirmPopup()">Recuar</button>
            </div>
        </div>
    </div>

 <div class="content">
    <h1></h1>
    <div id="game-container">
        <!-- Game info will be loaded here -->
    </div>
    
    <!-- Este é o novo contêiner para a área de palpites -->
    <div id="prediction-area">
        <!-- O formulário ou os cards serão injetados aqui via JS -->
    </div>
</div>
    <script src="config.js"></script>
    <script type="module" src="palpite/palpite.js"></script>
    <script src="core/menu-component.js"></script>
</body>
</html>
