<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relvado - Ggames</title>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="team/team.css?v=1.0.1">
    <link rel="stylesheet" href="core/rival-squads-view.css?v=1.0.0">
</head>
<body oncontextmenu="return false;">

    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div class="content">
        <div class="header-container">
            <div class="title-section">
                <h1 class="market-title">Relvado</h1>
            </div>
        </div>

        <div id="team-rivals-view" class="rival-squads-view">
            <div class="rival-squads-layout">
                <div class="rival-pitch-side">
                    <div class="rival-formation-options">
                        <label for="team-rival-user-select">GPlayers:</label>
                        <select id="team-rival-user-select" data-rival-user-select>
                            <option value="">Selecione um GPlayer</option>
                        </select>
                        <i class="fas fa-spinner fa-spin rival-spinner" data-rival-spinner style="display: none;"></i>

                        <select class="rival-formation-select" data-rival-formation-select>
                            <option value="4-4-2">4-4-2</option>
                            <option value="4-3-3">4-3-3</option>
                            <option value="4-5-1">4-5-1</option>
                            <option value="3-4-3">3-4-3</option>
                            <option value="5-3-2">5-3-2</option>
                        </select>
                    </div>

                    <div class="rival-pitch-container">
                        <div class="rival-stage texture">
                            <div class="rival-world">
                                <div class="rival-terrain">
                                    <div class="rival-field rival-field--alt"></div>
                                    <div class="rival-field">
                                        <div class="rival-field__texture rival-field__texture--gradient"></div>
                                        <div class="rival-field__texture rival-field__texture--gradient-b"></div>
                                        <div class="rival-field__texture rival-field__texture--grass"></div>
                                        <div class="rival-field__line rival-field__line--goal"></div>
                                        <div class="rival-field__line rival-field__line--goal rival-field__line--goal-far"></div>
                                        <div class="rival-field__line rival-field__line--outline"></div>
                                        <div class="rival-field__line rival-field__line--penalty"></div>
                                        <div class="rival-field__line rival-field__line--penalty-arc"></div>
                                        <div class="rival-field__line rival-field__line--penalty-arc rival-field__line--penalty-arc-far"></div>
                                        <div class="rival-field__line rival-field__line--mid"></div>
                                        <div class="rival-field__line rival-field__line--circle"></div>
                                        <div class="rival-field__line rival-field__line--penalty rival-field__line--penalty-far"></div>
                                        <div class="rival-pitch-area" data-rival-pitch-area></div>
                                    </div>
                                    <div class="rival-field__side rival-field__side--front"></div>
                                    <div class="rival-field__side rival-field__side--left"></div>
                                    <div class="rival-field__side rival-field__side--right"></div>
                                    <div class="rival-field__side rival-field__side--back"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="rival-player-selection-side">
                    <div class="rival-starting-eleven-section">
                        <h2>11 Titulares</h2>
                        <div class="rival-starting-eleven-container" data-rival-starting-eleven></div>
                    </div>

                    <div class="rival-substitutes-section">
                        <h2>Suplentes</h2>
                        <div class="rival-substitutes-container" data-rival-substitutes></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="team/team.js?v=1.0.0"></script>
    <script src="core/menu-component.js"></script>
    <script src="core/top-bar-component.js" type="module"></script>
</body>
</html>
