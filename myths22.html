<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17231d">
    <title>Myths — O caminho de Matus</title>
    <link rel="stylesheet" href="myths22/myths22.css">
</head>
<body>
    <div class="hud" aria-live="polite">
        <div class="hud__intro">
            <span class="eyebrow">MYTHS / 391.º DIA</span>
            <h1>O caminho de Matus</h1>
            <p>Uma carta, uma herança escondida e um tempo que começou a contar.</p>
        </div>
        <div class="hud__controls">
            <button id="start-route" type="button">Seguir as instruções</button>
            <button id="reset-route" class="button--quiet" type="button">Repor boneco</button>
            <p id="route-status">Matus está na Floresta dos Descontentes</p>
        </div>
        <div class="hud__help">
            <span>Arrastar</span> rodar&nbsp;&nbsp;·&nbsp;&nbsp;<span>Roda</span> zoom&nbsp;&nbsp;·&nbsp;&nbsp;<span>Botão direito</span> mover
        </div>
    </div>

    <canvas id="webgl-canvas" aria-label="Mapa 3D do percurso de Matus"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="myths22/map-engine.js"></script>
</body>
</html>
