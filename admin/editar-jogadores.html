               <script type="module">
        import { db } from './js/auth-guard.js';
        import { collection, getDocs, query, where, doc, getDoc, updateDoc, deleteDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { fetchUniqueSeasons, getPlayerSeasonData, buildPlayerSeasonUpdatePayload, hasPlayerDataForSeason } from './js/player-season-helper.js';

        let allRawPlayers = [];
        let allPlayers = [];
        let seasons = [];
        let currentSeason = '2025/2026';
        let countriesMap = new Map();
        let selectedPlayerId = null;
        let originalClubName = null;
        let currentSortColumn = 'nome';
        let currentSortDirection = 'asc';
        let activeMiniGames = [];
        let currentPage = 1;
        const ITEMS_PER_PAGE = 50;

        const DEFAULT_SVG_PLACEHOLDER = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100%" height="100%" fill="%23161c28"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%238892b0" font-size="11">Sem Imagem</text></svg>';

        window.resolvePlayerImage = function(img, code) {
            if (!code || code === 'undefined' || code === 'null' || code.trim() === '') {
                img.onerror = null;
                img.src = DEFAULT_SVG_PLACEHOLDER;
                return;
            }
            if (!img.dataset.tryIndex) {
                img.dataset.tryIndex = "0";
            }
            const extensions = ['webp', 'png', 'jpg', 'jpeg', 'svg'];
            const currentIndex = parseInt(img.dataset.tryIndex);
            
            if (currentIndex < extensions.length) {
                img.dataset.tryIndex = (currentIndex + 1).toString();
                img.src = `../assets/faces/face_${code}.${extensions[currentIndex]}`;
            } else {
                img.onerror = null;
                img.src = DEFAULT_SVG_PLACEHOLDER;
            }
        };

        async function initPage() {
            try {
                // Fetch seasons, players, countries, clubs and mini-games in parallel
                const [uniqueSeasons, playersSnap, countriesSnap, clubsSnap, minigamesSnap] = await Promise.all([
                    fetchUniqueSeasons(db),
                    getDocs(collection(db, 'jogadores')),
                    getDocs(collection(db, 'paises')),
                    getDocs(collection(db, 'clubes')),
                    getDoc(doc(db, 'settings', 'mini-ggames'))
                ]);

                // Inject clubs data for Cromo-ggames extension
                let clubsDataEl = document.getElementById('ggames-clubs-data');
                if (!clubsDataEl) {
                    clubsDataEl = document.createElement('script');
                    clubsDataEl.id = 'ggames-clubs-data';

                }

                // Map countries
                countriesSnap.forEach(d => countriesMap.set(d.id, d.data().nome));

                // Store raw docs
                allRawPlayers = playersSnap.docs.map(d => ({
                    id: d.id,
                    rawData: d.data()
                }));

                // Ponte de Comunicação com a Extensão Cromo-ggames

                    const players = allRawPlayers || [];
                    const reqSeason = e.detail?.targetSeason;

                        const count = players.filter(p => !hasPlayerDataForSeason(p.rawData, s)).length;

                    });

                    let playersMissingSeason = [];
                    if (reqSeason) {
                        playersMissingSeason = players
                            .filter(p => !hasPlayerDataForSeason(p.rawData, reqSeason))
                            .map(p => {
                                const baseData = getPlayerSeasonData(p.rawData, seasons[0] || '2025/2026');
                                return {
                                    id: p.id,
                                    nome: baseData.nome || 'Sem Nome',
                                    clube: baseData.clube || '',
                                    posicao: baseData.posicao || '',
                                    pais: baseData.pais || countriesMap.get(baseData.paisId) || ''
                                };
                            });

                    window.dispatchEvent(new CustomEvent('CROMO_PAGE_INFO_RESPONSE', {
                        detail: { seasons: seasonsList, missingBySeason, currentSeason, playersMissingSeason }
                    }));
                });

                window.addEventListener('CROMO_OPEN_PLAYER_FOR_SEASON', (e) => {
                    const playerId = e.detail?.playerId || e.detail?.id;
                    const targetSeason = e.detail?.targetSeason || currentSeason;
                    console.log('[EDITAR-JOGADOR] Evento CROMO_OPEN_PLAYER_FOR_SEASON recebido:', e.detail, '-> playerId:', playerId);

                        selectPlayerForSeason(playerId, item.rawData, targetSeason);
                        document.getElementById('edit-player-popup').classList.add('active');

                        // Garantir que o campo estatísticas (Coeficientes) fica totalmente vazio para a nova época
                        const playerStatsInput = document.getElementById('playerStats');
                        if (playerStatsInput) playerStatsInput.value = '';

                        const coefSection = document.getElementById('coeficientes-section');
                        if (coefSection) coefSection.style.display = 'none';

                        const coefDisplay = document.getElementById('firebase-data-display');
                        if (coefDisplay) coefDisplay.innerHTML = '';
                    } else {
                        console.warn('[EDITAR-JOGADOR] CROMO_OPEN_PLAYER_FOR_SEASON: Jogador não encontrado com ID:', playerId);
                    }
                });

                window.addEventListener('CROMO_SAVE_PLAYER_FORM', (e) => {
                    console.log('[EDITAR-JOGADOR] Evento CROMO_SAVE_PLAYER_FORM recebido:', e.detail);
                    const form = document.getElementById('editPlayerForm');
                    if (form) {
                        const playerStatsInput = document.getElementById('playerStats');
                        if (playerStatsInput) playerStatsInput.value = '';
                        form.requestSubmit();
                    }

                window.addEventListener('CROMO_CLOSE_PLAYER_MODAL', () => {
                    closeEditModal();
                });

                // Render dynamic mini-games
                const minigamesContainer = document.getElementById('minigames-container');
                if (minigamesContainer) {
                    minigamesContainer.innerHTML = '';
                    if (minigamesSnap.exists()) {
                        const mgData = minigamesSnap.data();
                        const games = Object.entries(mgData).map(([key, value]) => ({ key, ...value }));
                        games.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

                        games.forEach(game => {
                            if (game.status === true) {
                                activeMiniGames.push(game);
                                const optDiv = document.createElement('div');
                                optDiv.className = 'mini-game-option';
                                optDiv.style.display = 'flex';
                                optDiv.style.alignItems = 'center';
                                optDiv.style.gap = '10px';
                                optDiv.style.marginBottom = '8px';

                                if (game.key === 'caderneta') {
                                    extraMarkup = `
                                        <select name="caderneta-casta" style="padding: 5px 8px; font-size: 13px; background-color: #161c28; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 4px; width: 110px; margin-left: 8px; outline: none; cursor: pointer; height: 30px; vertical-align: middle;">
                                            <option value="comum">Comum</option>
                                            <option value="raro">Raro</option>
                                            <option value="epico">Épico</option>
                                            <option value="lendario">Lendário</option>
                                        </select>
                                    `;
                                }
                                optDiv.innerHTML = `
                                    <label style="cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; margin: 0;"><input type="checkbox" name="mini-games" value="${game.key}" class="mini-game-checkbox"> ${game.nome}</label>
                                    <div class="mini-game-price" style="display: none; margin-left: 10px; vertical-align: middle;">
                                        <input type="text" name="${game.key}-preco" maxlength="5" placeholder="Preço" class="mini-game-price-input" style="padding: 5px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 4px; width: 70px; background-color: #161c28; color: #ffffff; height: 30px; vertical-align: middle; text-align: center; outline: none;">
                                        ${extraMarkup}

            } catch (error) {
                console.error("Erro ao carregar os dados:", error);
                alert("Erro ao carregar os dados dos jogadores.");
            }

        function processPlayersAndRender() {
            const season = currentSeason;
            const defaultBaseSeason = seasons[seasons.length - 1] || '2025/2026';

            // Filtra apenas os jogadores que possuem dados gravados para a época selecionada
            const filteredRaw = allRawPlayers.filter(item => hasPlayerDataForSeason(item.rawData, season, defaultBaseSeason));

            allPlayers = filteredRaw.map(item => {
                const sData = getPlayerSeasonData(item.rawData, season) || {};
                return {
                    ...sData,
                    id: item.id,
                    nome: sData.nome || 'Sem Nome',
                    paisId: sData.paisId || '',
                    paisNome: countriesMap.get(sData.paisId) || sData.pais || 'N/A',
                    clube: sData.clube || 'N/A',
                    posicao: sData.posicao || 'N/A',
                    overall: sData.overall || 0,
                    casta: sData.casta || '',
                    imagem: sData.imagem || '',
                    codigoUrl: sData.codigoUrl || '',
                    estatisticas: sData.estatisticas || '',
                    preco: sData.preco || null,
                    compradopor: sData.compradopor || '',
                    noMercado: sData.noMercado || false,
                    ativo: sData.ativo !== false,
                    dataNascimento: sData.dataNascimento || '',
                    altura: sData.altura || null,
                    miniGames: sData.miniGames || [],
                    rawData: item.rawData
                };
            });

            currentPage = 1;
            populateFilters();
            renderPlayersTable();
        }

        function populateFilters() {
            const paises = [...new Set(allPlayers.map(p => p.paisNome).filter(pn => pn && pn !== 'N/A'))].sort();
            const posicoes = [...new Set(allPlayers.map(p => p.posicao).filter(pos => pos && pos !== 'N/A'))].sort();

            const filterPais = document.getElementById('filter-pais');
            const filterPosicao = document.getElementById('filter-posicao');

            const selectedPais = filterPais.value;
            const selectedPosicao = filterPosicao.value;

            filterPais.innerHTML = '<option value="">Todos os Países</option>';
            filterPosicao.innerHTML = '<option value="">Todas as Posições</option>';

            paises.forEach(pais => {
                const opt = document.createElement('option');
                opt.value = pais;
                opt.textContent = pais;
                if (pais === selectedPais) opt.selected = true;
                filterPais.appendChild(opt);
            });

            posicoes.forEach(pos => {
                const opt = document.createElement('option');
                opt.value = pos;
                opt.textContent = pos;
                if (pos === selectedPosicao) opt.selected = true;
                filterPosicao.appendChild(opt);
            });
        }

        function renderPlayersTable() {
            const queryText = document.getElementById('tableSearch').value.toLowerCase();
            const filterPais = document.getElementById('filter-pais').value;
            const filterPosicao = document.getElementById('filter-posicao').value;
            const tableBody = document.getElementById('players-table-body');
            tableBody.innerHTML = '';

            const filtered = allPlayers.filter(p => {
                const matchesSearch = p.nome.toLowerCase().includes(queryText) || 
                                     p.clube.toLowerCase().includes(queryText) || 
                                     p.posicao.toLowerCase().includes(queryText) ||
                                     p.paisNome.toLowerCase().includes(queryText);
                const matchesPais = !filterPais || p.paisNome === filterPais;
                const matchesPosicao = !filterPosicao || p.posicao === filterPosicao;
                return matchesSearch && matchesPais && matchesPosicao;
            });

            filtered.sort((a, b) => {
                let valA = a[currentSortColumn] || '';
                let valB = b[currentSortColumn] || '';

                let comparison = 0;
                if (typeof valA === 'number' && typeof valB === 'number') {
                    comparison = valA - valB;
                } else {
                    comparison = valA.toString().localeCompare(valB.toString(), 'pt', { sensitivity: 'base' });
                }

                return currentSortDirection === 'asc' ? comparison : -comparison;
            });

            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = totalItems > 0 ? (currentPage - 1) * ITEMS_PER_PAGE : 0;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
            const pageItems = filtered.slice(startIndex, endIndex);

            if (totalItems === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #8892b0; padding: 20px;">Nenhum jogador encontrado para a temporada selecionada.</td></tr>`;
            } else {
                pageItems.forEach(p => {
                    const tr = document.createElement('tr');
                    
                    const posClassMap = {
                        'Guarda-Redes': 'guarda-redes',
                        'Defesa': 'defesa',
                        'Médio': 'medio',
                        'Avançado': 'avancado'
                    };
                    const badgeClass = posClassMap[p.posicao] || '';

                    const displayImg = p.imagem ? (p.imagem.startsWith('http') || p.imagem.startsWith('data:') ? p.imagem : '../' + p.imagem) : 'placeholder.jpg';
                    const isChecked = p.ativo !== false ? 'checked' : '';
                    
                    const codeMatch = p.imagem ? p.imagem.match(/face_(.+)\.(webp|png|jpe?g|svg)/i) : null;
                    const playerCode = codeMatch ? codeMatch[1] : p.codigoUrl;

                    tr.innerHTML = `
                        <td>
                            <img src="${displayImg}" class="player-row-img" onerror="resolvePlayerImage(this, '${playerCode}')">
                            <span class="player-row-name">${p.nome}</span>
                        </td>
                        <td>${p.paisNome}</td>
                        <td>${p.clube}</td>
                        <td><span class="pos-badge ${badgeClass}">${p.posicao}</span></td>
                        <td style="text-align: center; font-weight: bold; color: #2ecc71;">${p.overall || 0}</td>
                        <td style="text-align: center;">
                            <label class="table-switch">
                                <input type="checkbox" class="ativo-toggle" ${isChecked}>
                                <span class="table-slider"></span>
                            </label>
                        </td>
                    `;
                    
                    const toggleSwitch = tr.querySelector('.table-switch');
                    toggleSwitch.addEventListener('click', (e) => {
                        e.stopPropagation();
                    });
                    const toggleInput = tr.querySelector('.ativo-toggle');
                    toggleInput.addEventListener('change', async (e) => {
                        const activeState = e.target.checked;
                        try {
                            const playerRef = doc(db, 'jogadores', p.id);
                            const updatePayload = buildPlayerSeasonUpdatePayload(currentSeason, { ...p, ativo: activeState });
                            await setDoc(playerRef, updatePayload, { merge: true });
                            p.ativo = activeState; // Update local cache
                        } catch (err) {
                            console.error("Erro ao atualizar o estado ativo do jogador:", err);
                            e.target.checked = !activeState; // Revert
                        }
                    });
                    
                    tr.addEventListener('click', () => openEditModal(p));
                    tableBody.appendChild(tr);
                });
            }

            renderPagination(totalItems, totalPages);
        }

        function renderPagination(totalItems, totalPages) {
            const container = document.getElementById('pagination-controls');
            if (!container) return;

            if (totalItems === 0) {
                container.innerHTML = `<div class="pagination-info">Sem resultados</div>`;
                return;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE + 1;
            const endIndex = Math.min(currentPage * ITEMS_PER_PAGE, totalItems);

            let buttonsHtml = '';
            
            // Button Previous
            buttonsHtml += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.changeEditPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i> Anterior</button>`;

            // Page numbers
            let pagesToDisplay = [];
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    pagesToDisplay.push(i);
                }
            }

            let lastPage = 0;
            pagesToDisplay.forEach(p => {
                if (lastPage > 0 && p - lastPage > 1) {
                    buttonsHtml += `<span class="pagination-ellipsis">...</span>`;
                }
                buttonsHtml += `<button class="pagination-btn ${p === currentPage ? 'active' : ''}" onclick="window.changeEditPage(${p})">${p}</button>`;
                lastPage = p;
            });

            // Button Next
            buttonsHtml += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.changeEditPage(${currentPage + 1})">Próxima <i class="fas fa-chevron-right"></i></button>`;

            container.innerHTML = `
                <div class="pagination-info">Mostrando <strong>${startIndex}</strong> a <strong>${endIndex}</strong> de <strong>${totalItems}</strong> jogadores</div>
                <div class="pagination-controls">${buttonsHtml}</div>
            `;
        }

        window.changeEditPage = function(page) {
            currentPage = page;
            renderPlayersTable();
            const tableEl = document.querySelector('.table-container');
            if (tableEl) tableEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

            const headers = document.querySelectorAll('.excel-table th[data-sort]');

                if (icon) {
                    if (col === currentSortColumn) {
                        icon.className = currentSortDirection === 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down';
                        icon.style.color = '#2176ff';
                    } else {
                        icon.className = 'fas fa-sort';
                        icon.style.color = '#8892b0';
                    }
                }
            });
        }

        async function fetchOverallLimits() {
            const docRef = doc(db, 'paineis', 'paineis overall');

        function determineCastaFromOverall(overall, limits) {
            if (!limits) return "";
            const [platinaLimit] = limits.Platina || [null];
            const [ouroLower, ouroUpper] = limits.Ouro || [null, null];
            const [prataLower, prataUpper] = limits.Prata || [null, null];
            const [bronzeLimit] = limits.Bronze || [null];
            if (platinaLimit !== null && overall >= platinaLimit) return "Jogador Platina";
            if (ouroLower !== null && ouroUpper !== null && overall >= ouroLower && overall <= ouroUpper) return "Jogador Ouro";
            if (prataLower !== null && prataUpper !== null && overall >= prataLower && overall <= prataUpper) return "Jogador Prata";
            if (bronzeLimit !== null && overall <= bronzeLimit) return "Jogador Bronze";
            return "";
        }

        async function selectPlayerForSeason(playerId, rawData, season) {
            console.log('[EDITAR-JOGADOR] selectPlayerForSeason -> Atribuindo selectedPlayerId =', playerId, '(época:', season, ')');
            selectedPlayerId = playerId;
            if (!playerId) {
                console.warn('[EDITAR-JOGADOR] ATENÇÃO: playerId é nulo ou indefinido ao selecionar jogador!');
            }
            const player = getPlayerSeasonData(rawData, season);

            document.getElementById('playerName').value = player.nome || 'Sem Nome';
            document.getElementById('playerImageCode').value = player.codigoUrl || '';
            let ext = 'webp';
            if (player.imagem) {
                const match = player.imagem.match(/face_(.+)\.(webp|png|jpe?g|svg)/i);
                if (match) ext = match[2];
            }
            const DEFAULT_PLACEHOLDER = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100%" height="100%" fill="%23161c28"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%238892b0" font-size="11">Sem Imagem</text></svg>';
            imagePreview.removeAttribute('data-try-index');
            if (player.codigoUrl && player.codigoUrl.trim() !== '') {
                imagePreview.onerror = () => window.resolvePlayerImage(imagePreview, player.codigoUrl);
                imagePreview.src = player.imagem ? (player.imagem.startsWith('http') || player.imagem.startsWith('data:') ? player.imagem : '../' + player.imagem) : `../assets/faces/face_${player.codigoUrl}.${ext}`;
            } else {
                imagePreview.onerror = null;
                imagePreview.src = DEFAULT_PLACEHOLDER;
            }
            document.getElementById('playerPrice').value = player.preco || '';
            document.getElementById('playerBuyer').value = player.compradopor || '';
            originalClubName = player.clube;

            if (player.paisId) {
                const paisDoc = doc(collection(db, 'paises'), player.paisId);
                getDoc(paisDoc).then(docSnap => { document.getElementById('playerCountry').value = docSnap.exists() ? docSnap.data().nome : ''; });
            } else {
                document.getElementById('playerCountry').value = player.pais || '';
            }

            document.getElementById('playerClub').value = player.clube || '';
            document.getElementById('playerOverall').value = player.overall || 0;
            document.getElementById('playerTier').value = player.casta || 'Jogador Bronze';
            document.getElementById('playerMarket').value = player.noMercado ? 'Sim' : 'Não';
            document.getElementById('playerActive').value = player.ativo !== false ? 'Sim' : 'Não';
            document.getElementById('playerRetired').value = player.retirado ? 'Sim' : 'Não';
            document.getElementById('playerStats').value = player.estatisticas || '';
            document.getElementById('playerPosition').value = player.posicao || '';
            document.getElementById('playerBirthDate').value = player.dataNascimento || '';
            document.getElementById('playerHeight').value = player.altura || '';

            const coeficientesSection = document.getElementById('coeficientes-section');
            if (player.posicao) {
                coeficientesSection.style.display = 'block';
                displayFirebaseData(player.posicao, player.casta, player.estatisticas || '');
            } else {
                coeficientesSection.style.display = 'none';
            }

            document.querySelectorAll('.mini-game-checkbox').forEach(checkbox => {
                let isChecked = false;
                if (Array.isArray(player.miniGames)) {
                    isChecked = player.miniGames.includes(checkbox.value);
                } else if (player.miniGames && typeof player.miniGames === 'object') {
                    if (checkbox.value === 'caderneta') {
                        isChecked = player.miniGames.caderneta?.estado === true;
                    } else {
                        isChecked = player.miniGames[checkbox.value] === true;
                    }
                }
                checkbox.checked = isChecked;
                const priceDiv = checkbox.closest('.mini-game-option').querySelector('.mini-game-price');
                if (priceDiv) {
                    priceDiv.style.display = isChecked ? 'inline-block' : 'none';
                    priceDiv.querySelector('.mini-game-price-input').value = isChecked ? (player[`${checkbox.value}preco`] || '') : '';
                    if (checkbox.value === 'caderneta') {
                        let cadCasta = 'comum';
                        if (player.miniGames && typeof player.miniGames === 'object' && !Array.isArray(player.miniGames)) {
                            if (player.miniGames.caderneta && typeof player.miniGames.caderneta === 'object') {
                                cadCasta = player.miniGames.caderneta.casta || 'comum';
                            }
                        }
                        const castaSelect = priceDiv.querySelector('select[name="caderneta-casta"]');
                        if (castaSelect) castaSelect.value = cadCasta;
                    }
                }
            });

            const buyerSelect = document.getElementById('playerBuyer');
            buyerSelect.innerHTML = '<option value="">Ninguém</option>';
            const usersSnapshot = await getDocs(collection(db, 'users'));
            usersSnapshot.forEach(userDoc => {
                const userData = userDoc.data();
                const option = document.createElement('option');
                option.value = userDoc.id;
                option.textContent = userData.nomeDeUsuario || userData.nometabela || 'Utilizador sem nome';
                buyerSelect.appendChild(option);
            });
            
            if (player.compradopor) {
                buyerSelect.value = player.compradopor;
            }
        }

        async function displayFirebaseData(selectedPosition, selectedCasta, estatisticasText) {
            const firebaseDataDisplay = document.getElementById('firebase-data-display');
            firebaseDataDisplay.innerHTML = '';
            if (!selectedPosition) return;

            const [paineisCoeficienteData, overallLimitsData] = await Promise.all([fetchPaineisCoefficients(), fetchOverallLimits()]);

            if (paineisCoeficienteData) {
                const table = document.createElement('table');
                table.className = 'coeficientes-table';
                table.innerHTML = '<thead><tr><th>Nome da Subcategoria</th><th>Coeficientes</th><th>Estatística</th></tr></thead>';
                const tbody = document.createElement('tbody');
                const rows = [];
                let totalSum = 0;

                for (const categoria in paineisCoeficienteData) {
                    for (const subcategoriaNome in paineisCoeficienteData[categoria]) {
                        const subcategoria = paineisCoeficienteData[categoria][subcategoriaNome];
                        if (subcategoria.tipo) {
                            for (const tipoItem of subcategoria.tipo) {
                                if (tipoItem.name === selectedPosition) {
                                    let firebaseValue = tipoItem.text || '-';
                                    let estatisticaValue = '-';
                                    let statisticNumber = 0;
                                    if (estatisticasText) {
                                        const lines = estatisticasText.split('\n');
                                        for (let i = 0; i < lines.length; i++) {
                                            if (lines[i].trim().toLowerCase().startsWith(subcategoriaNome.toLowerCase())) {
                                                const valueLine = lines[i + 1]?.trim() || '';
                                                const numberMatch = valueLine.match(/^(\d+(\.\d+)?)/);
                                                if (numberMatch) {
                                                    estatisticaValue = numberMatch[1];
                                                    statisticNumber = parseFloat(estatisticaValue.replace(',', '.'));
                                                }
                                                break;
                                            }
                                        }
                                    }
                                    totalSum += (parseFloat(firebaseValue.replace(',', '.')) * statisticNumber);
                                    const row = document.createElement('tr');
                                    row.innerHTML = `<td>${subcategoriaNome}</td><td>${firebaseValue}</td><td>${estatisticaValue}</td>`;
                                    rows.push(row);
                                    break;
                                }
                            }
                        }
                    }
                }

                rows.sort((a, b) => a.cells[0].textContent.localeCompare(b.cells[0].textContent)).forEach(row => tbody.appendChild(row));
                
                let castaFinal = selectedCasta;
                if (overallLimitsData && overallLimitsData[selectedPosition]) {
                    const castaDeterminada = determineCastaFromOverall(totalSum, overallLimitsData[selectedPosition]);
                    if (castaDeterminada) {
                        document.getElementById('playerTier').value = castaDeterminada;
                        castaFinal = castaDeterminada;
                    }
                }
                
                let coeficienteCastaValue = '-';
                if (paineisCoeficienteData?.['Coeficiente']?.['Coeficiente']?.casta) {
                    for (const castaItem of paineisCoeficienteData['Coeficiente']['Coeficiente'].casta) {
                        if (castaItem.name === castaFinal) {
                            coeficienteCastaValue = castaItem.text || '-';
                            break;
                        }
                    }
                }
                
                let coeficienteStatisticValue = '-';
                const totalStatistic = parseFloat(totalSum.toFixed(2));
                const coefficientValueForCalculation = parseFloat(coeficienteCastaValue.replace(',', '.'));
                if (!isNaN(coefficientValueForCalculation) && !isNaN(totalStatistic)) {
                    coeficienteStatisticValue = Math.round(coefficientValueForCalculation * totalStatistic);
                    document.getElementById('playerOverall').value = coeficienteStatisticValue;
                }
                tbody.innerHTML += `<tr style="font-weight: bold;"><td>Total</td><td>-</td><td>${totalSum.toFixed(2)}</td></tr><tr style="font-weight: bold;"><td>Coeficiente</td><td>${coeficienteCastaValue}</td><td>${coeficienteStatisticValue}</td></tr>`;
                table.appendChild(tbody);
                firebaseDataDisplay.appendChild(table);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPage();

            const topSeasonSelect = document.getElementById('topSeasonSelect');
            if (topSeasonSelect) {
                topSeasonSelect.addEventListener('change', (e) => {
                    currentSeason = e.target.value;
                    const modalSeasonSelect = document.getElementById('modalSeasonSelect');
                    if (modalSeasonSelect) modalSeasonSelect.value = currentSeason;
                    processPlayersAndRender();
                });
            }

            const modalSeasonSelect = document.getElementById('modalSeasonSelect');
            if (modalSeasonSelect) {
                modalSeasonSelect.addEventListener('change', (e) => {
                    const targetSeason = e.target.value;
                    console.log('[EDITAR-JOGADOR] modalSeasonSelect alterado para:', targetSeason, 'selectedPlayerId:', selectedPlayerId);
                    if (selectedPlayerId) {
                        const item = allRawPlayers.find(p => p.id === selectedPlayerId);
                        if (item) {
                            selectPlayerForSeason(selectedPlayerId, item.rawData, targetSeason);
                        }
                    }
                });
            }

            const tableSearch = document.getElementById('tableSearch');
            const playerCountry = document.getElementById('playerCountry');
            const playerClub = document.getElementById('playerClub');

            tableSearch.addEventListener('input', () => {
                currentPage = 1;
                renderPlayersTable();
            });

            const filterPaisSelect = document.getElementById('filter-pais');
            filterPaisSelect.addEventListener('change', () => {
                currentPage = 1;
                renderPlayersTable();
            });

            const filterPosicaoSelect = document.getElementById('filter-posicao');
            filterPosicaoSelect.addEventListener('change', () => {
                currentPage = 1;
                renderPlayersTable();
            });

            document.querySelectorAll('.excel-table th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.getAttribute('data-sort');
                    if (currentSortColumn === col) {
                        currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSortColumn = col;
                        currentSortDirection = 'asc';
                    }
                    updateSortHeaders();
                    renderPlayersTable();
                });
            });
            updateSortHeaders();

            document.getElementById('closeModalBtn').addEventListener('click', closeEditModal);
            document.getElementById('cancelModalBtn').addEventListener('click', closeEditModal);

            document.getElementById('playerImageCode').addEventListener('input', (e) => { 
                const code = e.target.value.trim();
                const imagePreview = document.getElementById('imagePreview');
                imagePreview.removeAttribute('data-try-index');
                if (code) {
                    imagePreview.onerror = () => window.resolvePlayerImage(imagePreview, code);
                    imagePreview.src = `../assets/faces/face_${code}.webp`;
                } else {
                    imagePreview.onerror = null;
                    imagePreview.src = DEFAULT_SVG_PLACEHOLDER;
                }
            });

            document.getElementById('playerStats').addEventListener('input', async function() {
                let playerPosition = document.getElementById('playerPosition').value;
                if (playerPosition) displayFirebaseData(playerPosition, document.getElementById('playerTier').value, this.value);
            });

            const minigamesContainerEl = document.getElementById('minigames-container');
            if (minigamesContainerEl) {
                minigamesContainerEl.addEventListener('change', (e) => {
                    if (e.target.classList.contains('mini-game-checkbox')) {
                        const priceDiv = e.target.closest('.mini-game-option').querySelector('.mini-game-price');
                        if (priceDiv) {
                            priceDiv.style.display = e.target.checked ? 'inline-block' : 'none';
                        }
                    }
                });
            }

            playerCountry.addEventListener('input', async (e) => {
                const searchTerm = e.target.value.toLowerCase();
                if (searchTerm.length < 1) { document.getElementById('countryResults').style.display = 'none'; return; }
                const snapshot = await getDocs(collection(db, 'paises'));
                const countries = [];
                snapshot.forEach(doc => { if (doc.data().nome.toLowerCase().includes(searchTerm)) countries.push(doc.data()); });
                displayCountryResults(countries);
            });

            playerClub.addEventListener('input', async (e) => {
                const searchTerm = e.target.value.toLowerCase();
                if (searchTerm.length < 1) { document.getElementById('clubResults').style.display = 'none'; return; }
                const snapshot = await getDocs(collection(db, 'clubes'));
                const clubs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if ((data.nome || '').toLowerCase().includes(searchTerm) || (data.nome_en || '').toLowerCase().includes(searchTerm)) {
                        clubs.push(data);
                    }
                });
                displayClubResults(clubs);
            });

            const playerPositionSelect = document.getElementById('playerPosition');
            playerPositionSelect.addEventListener('change', async function() {
                if (selectedPlayerId) {
                    const novaPosicao = this.value;
                    const castaAtual = document.getElementById('playerTier').value;
                    const estatisticasAtuais = document.getElementById('playerStats').value;
                    displayFirebaseData(novaPosicao, castaAtual, estatisticasAtuais);
                }
            });

            document.querySelectorAll('button[form="editPlayerForm"], .btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    console.log('[EDITAR-JOGADOR] Botão "Editar Jogador" clicado:', e.target);
                    const isNativeSubmit = btn.type === 'submit' && btn.getAttribute('form') === 'editPlayerForm';
                    if (!isNativeSubmit) {
                        const form = document.getElementById('editPlayerForm');
                        if (form) {
                            console.log('[EDITAR-JOGADOR] Executando form.requestSubmit() via script');
                            form.requestSubmit();
                        } else {
                            console.warn('[EDITAR-JOGADOR] Formulário editPlayerForm não encontrado!');
                        }
                    } else {
                        console.log('[EDITAR-JOGADOR] O botão é de submit nativo; o envio ocorrerá via evento de formulário.');
                    }
                });
            });

            let isSubmitting = false;

            document.getElementById('editPlayerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('[EDITAR-JOGADOR] Evento submit disparado para o formulário.');
                
                if (isSubmitting) {
                    console.warn('[EDITAR-JOGADOR] Submissão já em andamento. Ignorando envio duplicado.');
                    return;
                }

                const playerIdToSave = selectedPlayerId;
                console.log('[EDITAR-JOGADOR] playerIdToSave:', playerIdToSave);
                if (!playerIdToSave) {
                    console.warn('[EDITAR-JOGADOR] Operação cancelada: selectedPlayerId é nulo ou indefinido.');
                    return;
                }

                const currentNameVal = (document.getElementById('playerName')?.value || '').trim();
                const currentNameLower = currentNameVal.toLowerCase();
                if (!currentNameVal || currentNameLower === 'sem nome' || currentNameLower === 'sem_nome' || currentNameLower === 'sem-nome') {
                    alert('⚠️ [BLOQUEIO DE SEGURANÇA] O nome do jogador está vazio ou como "Sem Nome"! O processo foi imediatamente BLOQUEADO e a gravação cancelada.');
                    console.error('[EDITAR-JOGADOR] Gravação bloqueada devido a nome inválido:', currentNameVal);
                    return;
                }

                const submitBtns = document.querySelectorAll('button[form="editPlayerForm"], .btn-edit');
                try {
                    isSubmitting = true;
                    submitBtns.forEach(btn => btn.disabled = true);

                    const targetModalSeason = document.getElementById('modalSeasonSelect')?.value || currentSeason;
                    const countryName = document.getElementById('playerCountry').value;
                    const newClubName = document.getElementById('playerClub').value;
                    const playerRef = doc(db, 'jogadores', playerIdToSave);
                    console.log('[EDITAR-JOGADOR] Dados iniciais do form:', {
                        targetModalSeason,
                        countryName,
                        newClubName,
                        playerIdToSave
                    });

                    let paisId = null;
                    const paisSnapshot = await getDocs(query(collection(db, 'paises'), where('nome', '==', countryName)));
                    if (!paisSnapshot.empty) paisId = paisSnapshot.docs[0].id;
                    console.log('[EDITAR-JOGADOR] País resolvido ID:', paisId);

                    let clubeId = null; 
                    if (newClubName) {
                        const clubeSnapshot = await getDocs(query(collection(db, 'clubes'), where('nome', '==', newClubName)));
                        if (!clubeSnapshot.empty) {
                            clubeId = clubeSnapshot.docs[0].id;
                        }
                    }
                    console.log('[EDITAR-JOGADOR] Clube resolvido ID:', clubeId);

                    const miniGamesPrices = {};
                    document.querySelectorAll('.mini-game-checkbox').forEach(cb => {
                        const game = cb.value;
                        if (cb.checked) {
                            const priceInput = document.querySelector(`input[name="${game}-preco"]`);
                            miniGamesPrices[`${game}preco`] = priceInput ? priceInput.value.trim() : "";
                        } else {
                            miniGamesPrices[`${game}preco`] = "";
                        }
                    });

                    const rawItem = allRawPlayers.find(p => p.id === playerIdToSave);
                    const oldSeasonData = getPlayerSeasonData(rawItem ? rawItem.rawData : null, targetModalSeason);
                    const oldMiniGames = oldSeasonData?.miniGames || {};
                    let newMiniGamesObj = {};

                    if (typeof oldMiniGames === 'object' && !Array.isArray(oldMiniGames)) {
                        newMiniGamesObj = { ...oldMiniGames };
                    } else if (Array.isArray(oldMiniGames)) {
                        oldMiniGames.forEach(game => {
                            if (game !== 'caderneta') newMiniGamesObj[game] = true;
                        });
                    }

                    document.querySelectorAll('.mini-game-checkbox').forEach(cb => {
                        const gameName = cb.value;
                        if (gameName === 'caderneta') {
                            newMiniGamesObj.caderneta = {
                                estado: cb.checked,
                                casta: document.querySelector('select[name="caderneta-casta"]')?.value || 'comum'
                            };
                        } else {
                            if (cb.checked) {
                                newMiniGamesObj[gameName] = true;
                            } else {
                                delete newMiniGamesObj[gameName];
                            }
                        }
                    });

                    const imageCode = document.getElementById('playerImageCode').value.trim();
                    const previewSrc = document.getElementById('imagePreview').src;
                    let ext = 'webp';
                    if (previewSrc && !previewSrc.includes('data:image') && !previewSrc.includes('placeholder.jpg')) {
                        const extMatch = previewSrc.match(/\.(webp|png|jpe?g|svg)/i);
                        if (extMatch) {
                            ext = extMatch[1].toLowerCase();
                        }
                    }
                    const isRetired = document.getElementById('playerRetired')?.value === 'Sim';

                    const playerData = {
                        nome: document.getElementById('playerName').value,
                        codigoUrl: imageCode,
                        imagem: imageCode ? `assets/faces/face_${imageCode}.${ext}` : '',
                        pais: countryName, 
                        paisId: paisId, 
                        clube: isRetired ? '' : newClubName,
                        clubeId: isRetired ? '' : clubeId, 
                        retirado: isRetired,
                        posicao: document.getElementById('playerPosition').value,
                        dataNascimento: document.getElementById('playerBirthDate').value,
                        altura: parseFloat(document.getElementById('playerHeight').value) || null,
                        overall: parseFloat(document.getElementById('playerOverall').value) || 0,
                        casta: document.getElementById('playerTier').value,
                        noMercado: document.getElementById('playerMarket').value === 'Sim',
                        ativo: document.getElementById('playerActive').value === 'Sim',
                        preco: parseInt(document.getElementById('playerPrice').value) || null,
                        compradopor: document.getElementById('playerBuyer').value || null,
                        estatisticas: document.getElementById('playerStats').value,
                        miniGames: newMiniGamesObj, 
                        ...miniGamesPrices,
                        ultimaAtualizacao: new Date().toISOString()
                    };

                    console.log('[EDITAR-JOGADOR] Objeto playerData montado:', playerData);

                    const updatePayload = buildPlayerSeasonUpdatePayload(targetModalSeason, playerData);
                    console.log('[EDITAR-JOGADOR] Payload final para setDoc (buildPlayerSeasonUpdatePayload):', updatePayload);

                    console.log('[EDITAR-JOGADOR] A guardar no Firestore no doc jogadores/', playerIdToSave, '...');
                    await setDoc(playerRef, updatePayload, { merge: true });
                    console.log('[EDITAR-JOGADOR] Guardado com sucesso no doc de jogadores!');

                    if (originalClubName !== newClubName) {
                        console.log('[EDITAR-JOGADOR] Clube foi alterado. De:', originalClubName, 'Para:', newClubName);
                        if (originalClubName) {
                            const oldClubSnapshot = await getDocs(query(collection(db, 'clubes'), where('nome', '==', originalClubName)));
                            if (!oldClubSnapshot.empty) {
                                console.log('[EDITAR-JOGADOR] A remover jogador do clube antigo:', oldClubSnapshot.docs[0].id);
                                await deleteDoc(doc(db, 'clubes', oldClubSnapshot.docs[0].id, 'jogadores', playerIdToSave));
                            }
                        }
                        if (newClubName && clubeId) {
                            console.log('[EDITAR-JOGADOR] A adicionar jogador ao novo clube:', clubeId);
                            await setDoc(doc(db, 'clubes', clubeId, 'jogadores', playerIdToSave), playerData);
                        }
                    } else if (newClubName && clubeId) {
                        console.log('[EDITAR-JOGADOR] A atualizar dados no clube existente:', clubeId);
                        await setDoc(doc(db, 'clubes', clubeId, 'jogadores', playerIdToSave), playerData, { merge: true });
                    }
                    
                    // Update cache local
                    if (rawItem) {
                        rawItem.rawData = {
                            ...rawItem.rawData,
                            ...updatePayload
                        };
                    }

                    console.log('[EDITAR-JOGADOR] Sucesso total! A fechar modal e re-renderizar tabela.');
                    closeEditModal();
                    processPlayersAndRender();
                    
                } catch (error) {
                    console.error('[EDITAR-JOGADOR] Erro ao atualizar jogador:', error);
                    const errorDetail = error && error.message ? error.message : String(error);
                    alert(`🛑 NÃO FOI POSSÍVEL GRAVAR O JOGADOR!\n\nMOTIVO DA FALHA:\n${errorDetail}\n\nPor favor, corrija este problema e tente novamente.`);
                } finally {
                    isSubmitting = false;
                    submitBtns.forEach(btn => btn.disabled = false);
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.dropdown')) {
                    document.getElementById('countryResults').style.display = 'none';
                    document.getElementById('clubResults').style.display = 'none';
                }
            });
        });
    </script>
    
    <!-- ALTERAÇÃO 3: Adicionado o script para carregar o menu de navegação. -->
    <script src="js/menuadmin-loader.js"></script>

</body>
