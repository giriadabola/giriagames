<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrar Banca para Temporadas</title>
    <link rel="stylesheet" href="css/menu-admin.css">
    <script type="module" src="js/auth-guard.js"></script>
    <style>
        body { font-family: 'Poppins', Arial, sans-serif; padding: 30px; background: #10151f; color: #eef2f7; }
        main { max-width: 760px; margin: 0 auto; background: #161b26; padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        h1 { font-size: 1.8rem; margin-bottom: 15px; color: #ffffff; }
        p { margin-bottom: 20px; color: #8892b0; line-height: 1.6; }
        code { color: #8bd5ff; background: rgba(139, 213, 255, 0.1); padding: 2px 6px; border-radius: 4px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #f0f2f5; }
        select { background: #090c10; color: white; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px 14px; font-size: 14px; width: 100%; outline: none; }
        button { padding: 12px 20px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: all 0.2s ease; }
        #run-migration { background: #2ecc71; color: #0b1710; }
        #run-migration:hover { background: #27ae60; transform: translateY(-2px); }
        #run-migration:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #status { margin-top: 24px; white-space: pre-wrap; background: #090c10; padding: 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); min-height: 140px; font-family: monospace; font-size: 13px; color: #34d399; }
    </style>
</head>
<body>
    <main>
        <h1>Migrar Banca para Estrutura de Temporadas</h1>
        <p>Esta ferramenta move <strong>TODOS os campos</strong> do documento <code>paineis/Banca</code> (ex: <code>valor</code>, <code>taxaWhoWins</code>, <code>taxaBanca</code>, etc.) para dentro da "casa" (propriedade mapa) da temporada selecionada e apaga os campos da raiz.</p>
        
        <div class="form-group">
            <label for="season-select">Selecionar Temporada de Destino:</label>
            <select id="season-select">
                <option value="">A carregar temporadas de settings/temporadas...</option>
            </select>
        </div>

        <button id="run-migration">Iniciar Migração da Banca</button>
        <div id="status">A aguardar instruções...</div>
    </main>

    <script type="module">
        import { db } from './js/auth-guard.js';
        import { getDoc, setDoc, deleteField, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const seasonSelect = document.getElementById('season-select');
        const button = document.getElementById('run-migration');
        const status = document.getElementById('status');

        function appendStatus(message) {
            status.textContent += `${message}\n`;
        }

        async function loadSeasons() {
            try {
                const settingsDoc = await getDoc(doc(db, 'settings', 'temporadas'));
                seasonSelect.innerHTML = '';
                if (settingsDoc.exists() && Array.isArray(settingsDoc.data()?.temporadas) && settingsDoc.data().temporadas.length > 0) {
                    const seasons = settingsDoc.data().temporadas;
                    seasons.forEach((season, index) => {
                        const opt = document.createElement('option');
                        opt.value = season;
                        opt.textContent = season + (index === seasons.length - 1 ? ' (Mais Recente)' : '');
                        seasonSelect.appendChild(opt);
                    });
                    seasonSelect.value = seasons[seasons.length - 1];
                } else {
                    const opt = document.createElement('option');
                    opt.value = '2025/2026';
                    opt.textContent = '2025/2026 (Padrão)';
                    seasonSelect.appendChild(opt);
                }
            } catch (err) {
                console.error("Erro ao carregar temporadas:", err);
                seasonSelect.innerHTML = '<option value="2025/2026">2025/2026 (Fallback)</option>';
            }
        }

        loadSeasons();

        button.addEventListener('click', async () => {
            const targetSeason = seasonSelect.value;
            if (!targetSeason) {
                alert('Selecione uma temporada válida!');
                return;
            }

            button.disabled = true;
            status.textContent = `[${new Date().toLocaleTimeString()}] A iniciar migração da Banca para a temporada "${targetSeason}"...\n`;

            try {
                const bancaRef = doc(db, 'paineis', 'Banca');
                const bancaSnap = await getDoc(bancaRef);

                if (!bancaSnap.exists()) {
                    appendStatus('ERRO: O documento paineis/Banca não existe.');
                    return;
                }

                const bancaData = bancaSnap.data();
                appendStatus('Dados atuais de paineis/Banca lidos com sucesso.');

                const targetSeasonObj = { ...((typeof bancaData[targetSeason] === 'object' && bancaData[targetSeason] !== null) ? bancaData[targetSeason] : {}) };
                const deletions = {};
                let movedFieldsCount = 0;

                Object.entries(bancaData).forEach(([field, value]) => {
                    // Ignorar propriedades que já sejam casas de temporadas (formato AAAA/AAAA ou AAAAAAAA)
                    if (/^\d{4}\/\d{4}$/.test(field) || /^\d{8}$/.test(field)) {
                        return;
                    }

                    // Mover o campo da raiz para a casa da temporada alvo
                    targetSeasonObj[field] = value;
                    deletions[field] = deleteField();
                    movedFieldsCount++;
                    appendStatus(`-> Mover campo "${field}" para "${targetSeason}.${field}"`);
                });

                if (movedFieldsCount === 0) {
                    appendStatus('\nAVISO: Não foram encontrados campos na raiz para mover. Todos os campos já estão estruturados por temporadas.');
                    return;
                }

                appendStatus(`\nA gravar alteração no Firestore (Objeto "${targetSeason}" com ${movedFieldsCount} campos e remoção dos campos originais da raiz)...`);

                await setDoc(bancaRef, {
                    [targetSeason]: targetSeasonObj,
                    ...deletions
                }, { merge: true });

                appendStatus(`\nSUCESSO! Todos os ${movedFieldsCount} campos da raiz foram movidos para a "casa" "${targetSeason}" e removidos da raiz do documento.`);
            } catch (error) {
                console.error("Erro na migração da Banca:", error);
                appendStatus(`\nERRO: ${error.message}`);
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
