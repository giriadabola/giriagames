        h1 { color: #ffffff; margin-bottom: 30px; text-align: center; font-weight: 700; font-size: 28px; letter-spacing: 0.5px; }
        .players-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 32px; max-width: 800px; margin-left: auto; margin-right: auto; }
        
        .player-card { 
            position: relative; 
            background: #111622; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); 
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .player-card:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55); border-color: rgba(33, 118, 255, 0.2); }
        .player-image { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.08); }
        .player-info-container { flex-grow: 1; }
        .player-name { font-size: 18px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
        .player-info { color: #8892b0; font-size: 14px; line-height: 1.4; margin-bottom: 4px; }
        
        .gold { color: #FFD700; } .silver { color: #C0C0C0; } .bronze { color: #CD7F32; } .platinum { color: #E5E4E2; }
        
        .toggle-switch { position: relative; display: inline-block; width: 60px; height: 34px; margin-left: auto; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff4444; transition: .4s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.05); }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(26px); }
        
        .save-button { background-color: #2176ff; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-bottom: 20px; margin-left: auto; display: block; box-shadow: 0 4px 15px rgba(33, 118, 255, 0.25); font-weight: bold; }
        .save-button:hover { background-color: #1a5cc4; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(33, 118, 255, 0.4); }
        
        .market-time-button { background-color: #2176ff; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-bottom: 20px; margin-right: 10px; box-shadow: 0 4px 15px rgba(33, 118, 255, 0.25); font-weight: bold; }
        .market-time-button:hover { background-color: #1a5cc4; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(33, 118, 255, 0.4); }
        
        .market-time-menu, .multi-change-menu { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111622; padding: 24px; border-radius: 16px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); z-index: 1001; width: 90%; max-width: 500px; border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; max-height: 90vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) #111622; }

        .market-time-menu::-webkit-scrollbar-thumb, .multi-change-menu::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 8px; }
        .market-time-menu::-webkit-scrollbar-thumb:hover, .multi-change-menu::-webkit-scrollbar-thumb:hover { background: #8e44ad; }
        .market-time-menu.active, .multi-change-menu.active { display: block; }
        .market-time-menu h2, .multi-change-menu h2 { margin-bottom: 20px; color: #ffffff; font-weight: bold; }
        .market-time-field { margin-bottom: 16px; }
        .market-time-field label { display: block; margin-bottom: 8px; color: #8892b0; font-weight: 500; }
        .market-time-field input[type="datetime-local"], .market-time-field select { width: 100%; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; font-size: 14px; background-color: #161c28; color: #ffffff; outline: none; }

        .market-time-field input[type="checkbox"] { margin-right: 8px; }
        
        .position-toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .position-toggle:last-of-type { border-bottom: none; }
        .position-toggle span { font-size: 16px; color: #ffffff; }
        
        .toggle-action-button { border: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; margin-left: 8px; color: white; transition: background-color 0.2s, transform 0.1s; font-weight: bold; }
        .toggle-action-button:hover { transform: translateY(-1px); }
        .toggle-action-button[data-action="activate"] { background-color: #2ecc71; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2); }
        .toggle-action-button[data-action="activate"]:hover { background-color: #27ae60; }
        .toggle-action-button[data-action="deactivate"] { background-color: #e74c3c; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.2); }
        .toggle-action-button[data-action="deactivate"]:hover { background-color: #c0392b; }
        
        .player-search { margin-top: 20px; }
        .player-search input { width: 100%; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; font-size: 14px; margin-bottom: 12px; background-color: #161c28; color: #ffffff; outline: none; }
        .player-search input:focus { border-color: rgba(33, 118, 255, 0.5); }
        
        .selected-players { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .selected-player { background: #161c28; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; }
        .selected-player button { background: none; border: none; color: #8892b0; cursor: pointer; padding: 0; font-size: 16px; }

        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1000; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        
        .player-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
        .price-input-container { position: relative; }
        .price-input { width: 100px; padding: 8px 8px 8px 24px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font-size: 14px; font-weight: bold; text-align: right; transition: border-color 0.2s; background-color: #161c28; color: #ffffff; }

        /* Pagination Styles */
        .pagination-wrapper { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; background-color: #111622; padding: 16px 24px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.06); max-width: 800px; margin-left: auto; margin-right: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }

        .pagination-info strong { color: #ffffff; }
        .pagination-controls { display: flex; gap: 6px; align-items: center; }
        .pagination-btn { background-color: #161c28; border: 1px solid rgba(255, 255, 255, 0.08); color: #8892b0; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .pagination-btn:hover:not(:disabled) { background-color: #1d2639; color: #2176ff; border-color: rgba(33, 118, 255, 0.3); }
        .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .pagination-btn.active { background-color: #2176ff; color: #ffffff; border-color: #2176ff; }
        .pagination-ellipsis { color: #8892b0; padding: 0 4px; }

            margin-top: 10px;
        }
        .calendar-day-header {
            text-align: center;
            font-weight: 700;
            font-size: 11px;
            color: #8892b0;
            padding: 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: #161c28;
            border-radius: 6px;
        }
        .calendar-day-cell {
            background-color: #161c28;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            min-height: 85px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .calendar-day-cell:hover {
            border-color: rgba(142, 68, 173, 0.6);
            background-color: #1a2234;
        }
        .calendar-day-cell.other-month {
            opacity: 0.3;
            cursor: default;
        }
        .calendar-day-cell.today {
            border-color: #8e44ad;
            box-shadow: inset 0 0 0 1px #8e44ad;
        }
        .calendar-day-number {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .calendar-events-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 55px;
            scrollbar-width: none;
        }
        .calendar-events-container::-webkit-scrollbar {
            display: none;
        }
        .calendar-event-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 6px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            background-color: rgba(142, 68, 173, 0.25);
            color: #dcd6f7;
            border: 1px solid rgba(142, 68, 173, 0.4);
            max-width: 100%;
            box-sizing: border-box;
        }
        .calendar-event-tag:hover {
            transform: scale(1.02);
            background-color: rgba(142, 68, 173, 0.4);
            border-color: rgba(142, 68, 173, 0.7);
        }
    </style>

                <div class="player-info">Abertura: ${player.marketTimes?.abertura ? new Date(player.marketTimes.abertura.seconds * 1000).toLocaleString('pt-PT') : 'Não definido'}</div>
                <div class="player-info">Fechamento: ${player.marketTimes?.fechamento ? new Date(player.marketTimes.fechamento.seconds * 1000).toLocaleString('pt-PT') : 'Não definido'}</div>

                </div>

                    <input type="checkbox" ${player.noMercado ? 'checked' : ''} data-player-id="${docId}">
                    <span class="slider"></span>
                </label>
            </div>
        `;

        const updateChanges = (playerId, field, value) => {
            const currentChanges = changedPlayers.get(playerId) || {};
            currentChanges[field] = value;
            changedPlayers.set(playerId, currentChanges);
        };

        card.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
            updateChanges(docId, 'noMercado', e.target.checked);

        card.querySelector('.price-input').addEventListener('input', (e) => {
            const priceValue = parseFloat(e.target.value) || 0;
            updateChanges(docId, 'preco', priceValue);
        });
        
        return card;
    }

    function renderPaginationControls(totalItems, totalPages) {
        const container = document.getElementById('pagination-controls');
        if (!container) return;

        if (totalItems === 0) {
            container.innerHTML = `<div class="pagination-info">Sem resultados</div>`;
            return;
        }

        const startIndex = (currentPage - 1) * ITEMS_PER_PAGE + 1;
        const endIndex = Math.min(currentPage * ITEMS_PER_PAGE, totalItems);

        let buttonsHtml = '';
        
        buttonsHtml += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.changePlayerPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i> Anterior</button>`;

        let pagesToDisplay = [];
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                pagesToDisplay.push(i);
            }
        }

        let lastPage = 0;
        pagesToDisplay.forEach(p => {
            if (lastPage > 0 && p - lastPage > 1) {
                buttonsHtml += `<span class="pagination-ellipsis">...</span>`;
            }
            buttonsHtml += `<button class="pagination-btn ${p === currentPage ? 'active' : ''}" onclick="window.changePlayerPage(${p})">${p}</button>`;
            lastPage = p;
        });

        buttonsHtml += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.changePlayerPage(${currentPage + 1})">Próxima <i class="fas fa-chevron-right"></i></button>`;

        container.innerHTML = `
            <div class="pagination-info">Mostrando <strong>${startIndex}</strong> a <strong>${endIndex}</strong> de <strong>${totalItems}</strong> jogadores</div>
            <div class="pagination-controls">${buttonsHtml}</div>
        `;
    }

    window.changePlayerPage = function(page) {
        currentPage = page;
        updateFiltersAndDisplay(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function displayPlayers(playersToDisplay) {
        const playersGrid = document.getElementById('players-grid');
        playersGrid.innerHTML = ''; 

        const totalItems = playersToDisplay.length;
        const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        if (totalItems === 0) {
            playersGrid.innerHTML = '<p style="text-align: center; color: #666; margin-top: 20px;">Nenhum jogador encontrado com os filtros selecionados.</p>';
            renderPaginationControls(0, 0);
            return;
        }

        const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
        const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
        const pagePlayers = playersToDisplay.slice(startIndex, endIndex);

        const positionOrder = ['Guarda-Redes', 'Defesa', 'Médio', 'Avançado'];
        const playersByPosition = {};
        positionOrder.forEach(pos => { playersByPosition[pos] = []; });

        pagePlayers.forEach(player => {
            if (playersByPosition[player.posicao] !== undefined) {
                playersByPosition[player.posicao].push(player);
            } else {
                if (!playersByPosition['Outros']) playersByPosition['Outros'] = [];
                playersByPosition['Outros'].push(player);
            }
        });

        const activePositions = Object.keys(playersByPosition);
        activePositions.forEach(position => {
            if (playersByPosition[position] && playersByPosition[position].length > 0) {
                const header = document.createElement('h2');
                header.textContent = position;
                header.style.color = '#ffffff';
                header.style.marginTop = '30px';
                header.style.marginBottom = '16px';
                header.style.fontSize = '20px';
                header.style.borderBottom = '1px solid rgba(255, 255, 255, 0.08)';
                header.style.paddingBottom = '8px';
                playersGrid.appendChild(header);

                playersByPosition[position].sort((a, b) => a.nome.localeCompare(b.nome)).forEach(player => {
                    const playerCard = createPlayerCard(player, player.id);
                    playersGrid.appendChild(playerCard);
                });
            }
        });

        renderPaginationControls(totalItems, totalPages);
    }

    function updateFiltersAndDisplay(resetPage = true) {
        if (resetPage) {
            currentPage = 1;
        }
        const selectedValues = {
            posicao: document.getElementById('filterPosicao').value,
            casta: document.getElementById('filterCasta').value,
            competicao: document.getElementById('filterCompeticao').value,
            pais: document.getElementById('filterPais').value
        };

        const selects = {
            posicao: document.getElementById('filterPosicao'),
            casta: document.getElementById('filterCasta'),
            competicao: document.getElementById('filterCompeticao'),
            pais: document.getElementById('filterPais')
        };
        
       const fieldNames = {
        posicao: 'posicao',
        casta: 'casta',
        competicao: 'competicaoNome', 
        pais: 'pais'
        };

        Object.keys(selects).forEach(filterKey => {
            const counts = {};
            const relevantPlayers = allPlayers.filter(player => {
                return Object.keys(selectedValues).every(key => {
                    if (key === filterKey) return true;
                    return !selectedValues[key] || player[fieldNames[key]] === selectedValues[key];
                });
            });

            relevantPlayers.forEach(player => {
                const value = player[fieldNames[filterKey]];
                if (value) {
                    counts[value] = (counts[value] || 0) + 1;
                }
            });

            const selectElement = selects[filterKey];
            const firstOptionText = selectElement.querySelector('option:first-child').textContent;
            selectElement.innerHTML = `<option value="">${firstOptionText}</option>`;

            const sortedValues = Object.keys(counts).sort((a, b) => a.localeCompare(b));
            sortedValues.forEach(value => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = `${value} (${counts[value]})`;
                selectElement.appendChild(option);
            });
            selectElement.value = selectedValues[filterKey];
        });

        const playersToDisplay = allPlayers.filter(player => {
            return (!selectedValues.posicao || player.posicao === selectedValues.posicao) &&
                   (!selectedValues.casta || player.casta === selectedValues.casta) &&
                   (!selectedValues.competicao || player.competicaoNome === selectedValues.competicao) &&
                   (!selectedValues.pais || player.pais === selectedValues.pais);
        });

        displayPlayers(playersToDisplay);
    }

    async function saveChanges() {
        try {
            if (changedPlayers.size === 0) {
                alert('Nenhuma alteração para salvar.');
                return;
            }
            const batch = [];
            const now = new Date().toISOString();
            
            for (const [playerId, updates] of changedPlayers) {
                const playerRef = doc(db, 'jogadores', playerId);
                const rawItem = rawPlayersDocs.find(r => r.id === playerId);
                const isMigrated = isPlayerMigrated(rawItem?.rawData);

                if (isMigrated || currentSeason !== '2025/2026') {
                    const fieldsAndValues = [];
                    for (const [key, value] of Object.entries(updates)) {
                        fieldsAndValues.push(new FieldPath(currentSeason, key), value);
                    }
                    fieldsAndValues.push(new FieldPath(currentSeason, 'ultimaAtualizacao'), now);
                    batch.push(updateDoc(playerRef, ...fieldsAndValues));
                } else {
                    const payload = {};
                    for (const [key, value] of Object.entries(updates)) {
                        payload[key] = value;
                    }
                    payload.ultimaAtualizacao = now;
                    batch.push(updateDoc(playerRef, payload));
                }
            }

            await Promise.all(batch);
            alert('Alterações salvas com sucesso!');

            for (const [playerId, updates] of changedPlayers) {
                const rawItem = rawPlayersDocs.find(r => r.id === playerId);
                if (rawItem && rawItem.rawData) {
                    const isMigrated = isPlayerMigrated(rawItem.rawData);
                    if (isMigrated || currentSeason !== '2025/2026') {
                        if (!rawItem.rawData[currentSeason]) rawItem.rawData[currentSeason] = {};
                        Object.assign(rawItem.rawData[currentSeason], updates);
                    } else {
                        Object.assign(rawItem.rawData, updates);
                    }
                }
            }
            
            changedPlayers.clear(); 
            allPlayers = processPlayersForCurrentSeason();
            updateFiltersAndDisplay();

        } catch (error) {
            console.error('Error saving changes:', error);
            alert('Erro ao salvar alterações. Por favor, tente novamente.');
        }
    }

    function getShortTargetLabel(data) {
        if (data.tipoAplicacao === 'position') return data.valorAplicacao || 'Posição';
        if (data.tipoAplicacao === 'caste') return (data.valorAplicacao || '').replace('Jogador ', '') || 'Casta';
        if (data.tipoAplicacao === 'all') return 'Todos';
        if (data.tipoAplicacao === 'specific') {
            if (Array.isArray(data.valorAplicacao)) return `${data.valorAplicacao.length} Jogadores`;
            return 'Específicos';
        }
        return data.observacoes || 'Mercado';
    }

    async function loadMarketSchedules() {
        try {
            const logCollectionRef = collection(db, 'paineis', 'Banca', 'horarioMercado');
            const q = query(logCollectionRef, orderBy("dataCriacao", "desc"));
            const querySnapshot = await getDocs(q);
            marketSchedules = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch (error) {
            console.error("Erro ao carregar horários para agenda:", error);
            marketSchedules = [];
        }
    }

    function fillMarketTimeForm(schedule, year, month, day) {
        const monthFormatted = String(month + 1).padStart(2, '0');
        const dayFormatted = String(day).padStart(2, '0');

        if (schedule) {
            editingScheduleId = schedule.id;

            const dtAb = schedule.abertura?.toDate ? schedule.abertura.toDate() : null;
            const dtFe = schedule.fechamento?.toDate ? schedule.fechamento.toDate() : null;

            if (dtAb) {
                const isoAb = new Date(dtAb.getTime() - (dtAb.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                document.getElementById('marketOpenTime').value = isoAb;
            } else {
                document.getElementById('marketOpenTime').value = `${year}-${monthFormatted}-${dayFormatted}T10:00`;
            }

            if (dtFe) {
                const isoFe = new Date(dtFe.getTime() - (dtFe.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                document.getElementById('marketCloseTime').value = isoFe;
            } else {
                document.getElementById('marketCloseTime').value = `${year}-${monthFormatted}-${dayFormatted}T22:00`;
            }

            if (schedule.tipoAplicacao) {
                applyMode.value = schedule.tipoAplicacao;
                updateApplyModeUI();

                if (schedule.tipoAplicacao === 'position' && applyPositionSelect) {
                    applyPositionSelect.value = schedule.valorAplicacao || '';
                } else if (schedule.tipoAplicacao === 'caste' && applyCasteSelect) {
                    applyCasteSelect.value = schedule.valorAplicacao || '';
                } else if (schedule.tipoAplicacao === 'specific' && Array.isArray(schedule.valorAplicacao)) {
                    selectedPlayersList.clear();
                    selectedPlayers.innerHTML = '';
                    schedule.valorAplicacao.forEach(playerId => {
                        const playerObj = allPlayers.find(p => p.id === playerId);
                        const playerName = playerObj ? playerObj.nome : playerId;
                        selectedPlayersList.add(playerId);

                        const playerTag = document.createElement('div');
                        playerTag.className = 'selected-player';
                        playerTag.innerHTML = `${playerName} <button data-id="${playerId}">×</button>`;
                        selectedPlayers.appendChild(playerTag);
                        playerTag.querySelector('button').addEventListener('click', () => {
                            selectedPlayersList.delete(playerId);
                            playerTag.remove();
                        });
                    });
                }
            } else {
                applyMode.value = 'specific';
                updateApplyModeUI();
            }
        } else {
            editingScheduleId = null;
            document.getElementById('marketOpenTime').value = `${year}-${monthFormatted}-${dayFormatted}T10:00`;
            document.getElementById('marketCloseTime').value = `${year}-${monthFormatted}-${dayFormatted}T22:00`;
            applyMode.value = 'specific';
            updateApplyModeUI();
            selectedPlayersList.clear();
            selectedPlayers.innerHTML = '';
        }
    }

    function renderAgendaCalendar() {
        if (!calendarGrid) return;
        calendarGrid.innerHTML = '';

        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();

        calendarMonthYear.textContent = `${MONTH_NAMES_PT[month]} ${year}`;

        WEEKDAYS_SHORT_PT.forEach(dayName => {
            const headerCell = document.createElement('div');
            headerCell.className = 'calendar-day-header';
            headerCell.textContent = dayName;
            calendarGrid.appendChild(headerCell);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const today = new Date();
        const isCurrentMonthYear = today.getFullYear() === year && today.getMonth() === month;

        // Dias do mês anterior
        for (let i = firstDayIndex - 1; i >= 0; i--) {
            const dayNum = daysInPrevMonth - i;
            const cell = document.createElement('div');
            cell.className = 'calendar-day-cell other-month';
            cell.innerHTML = `<span class="calendar-day-number">${dayNum}</span>`;
            calendarGrid.appendChild(cell);
        }

        // Dias do mês atual
        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-day-cell';
            if (isCurrentMonthYear && today.getDate() === day) {
                cell.classList.add('today');
            }

            const dayNumSpan = document.createElement('span');
            dayNumSpan.className = 'calendar-day-number';
            dayNumSpan.textContent = day;
            cell.appendChild(dayNumSpan);

            const eventsContainer = document.createElement('div');
            eventsContainer.className = 'calendar-events-container';

            const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            const daySchedules = marketSchedules.filter(schedule => {
                const dtAb = schedule.abertura?.toDate ? schedule.abertura.toDate() : null;
                const dtFe = schedule.fechamento?.toDate ? schedule.fechamento.toDate() : null;
                const dtAbStr = dtAb ? `${dtAb.getFullYear()}-${String(dtAb.getMonth() + 1).padStart(2, '0')}-${String(dtAb.getDate()).padStart(2, '0')}` : '';
                const dtFeStr = dtFe ? `${dtFe.getFullYear()}-${String(dtFe.getMonth() + 1).padStart(2, '0')}-${String(dtFe.getDate()).padStart(2, '0')}` : '';
                return dtAbStr === cellDateStr || dtFeStr === cellDateStr;
            });

            daySchedules.forEach(schedule => {
                const label = getShortTargetLabel(schedule);
                const dtAb = schedule.abertura?.toDate ? schedule.abertura.toDate() : null;
                const dtFe = schedule.fechamento?.toDate ? schedule.fechamento.toDate() : null;
                const timeAbText = dtAb ? dtAb.toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'}) : 'N/A';
                const timeFeText = dtFe ? dtFe.toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'}) : 'N/A';

                const tag = document.createElement('div');
                tag.className = 'calendar-event-tag';
                tag.title = `Mercado ${label} (${timeAbText} - ${timeFeText}): ${schedule.observacoes}`;
                tag.innerHTML = `<i class="fas fa-shopping-bag" style="color: #bb86fc;"></i> Mercado ${label}`;
                
                tag.addEventListener('click', (e) => {
                    e.stopPropagation();
                    fillMarketTimeForm(schedule, year, month, day);
                    openedFromAgenda = true;
                    openPopup(marketTimeMenu);
                });
                
                eventsContainer.appendChild(tag);
            });

            cell.appendChild(eventsContainer);

            // Ao clicar no dia do calendário, carrega o agendamento existente ou define o padrão (10:00 - 22:00)
            cell.addEventListener('click', () => {
                fillMarketTimeForm(daySchedules.length > 0 ? daySchedules[0] : null, year, month, day);
                openedFromAgenda = true;
                openPopup(marketTimeMenu);
            });

            calendarGrid.appendChild(cell);
        }

        // Preenchimento do restante da grelha
        const totalCellsSoFar = firstDayIndex + daysInMonth;
        const nextDaysPadding = (totalCellsSoFar <= 35 ? 35 : 42) - totalCellsSoFar;
        for (let day = 1; day <= nextDaysPadding; day++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-day-cell other-month';
            cell.innerHTML = `<span class="calendar-day-number">${day}</span>`;
            calendarGrid.appendChild(cell);
        }
    }

                    case 'caste':
                        if (!valorAplicacao) return alert('Por favor, selecione uma casta.');
                        targetPlayers = allPlayers.filter(p => p.casta === valorAplicacao);
                        break;
                    case 'specific':
                        if (!Array.isArray(valorAplicacao) || valorAplicacao.length === 0) return alert('Por favor, selecione pelo menos um jogador.');
                        targetPlayers = allPlayers.filter(p => valorAplicacao.includes(p.id));
                        break;
                }

                if (targetPlayers.length === 0) return alert('Nenhum jogador encontrado para eliminar horários.');

                const revertedTimes = { abertura: null, fechamento: null };
                const updates = targetPlayers.map(p => {
                    const playerRef = doc(db, 'jogadores', p.id);
                    const rawItem = rawPlayersDocs.find(r => r.id === p.id);
                    const isMigrated = isPlayerMigrated(rawItem?.rawData);
                    if (isMigrated || currentSeason !== '2025/2026') {
                        return updateDoc(playerRef, new FieldPath(currentSeason, 'marketTimes'), revertedTimes);
                    } else {
                        return updateDoc(playerRef, { marketTimes: revertedTimes });
                    }
                });

                await Promise.all(updates);

                if (editingScheduleId) {
                    await deleteDoc(doc(db, 'paineis', 'Banca', 'horarioMercado', editingScheduleId));
                }

                alert('Horários do mercado eliminados/revertidos com sucesso!');
                editingScheduleId = null;
                document.getElementById('marketOpenTime').value = '';
                document.getElementById('marketCloseTime').value = '';
                await loadMarketSchedules();
                renderAgendaCalendar();
                if (openedFromAgenda) {
                    openedFromAgenda = false;
                    openPopup(agendaMercadoPopup);
                } else {
                    closeAllMenus();
                }
                initializeApp();

            } catch (error) {
                console.error("Erro ao eliminar agendamento:", error);
                alert("Ocorreu um erro ao eliminar os horários.");
            }
        });
    }

    if (overlay) overlay.addEventListener('click', closeAllMenus);
    if (closeMultiChange) closeMultiChange.addEventListener('click', closeAllMenus);

    function populateMarketTimeSelectors(players) {
        // ... (função sem alterações)
        const posicoes = new Set();
        const castas = new Set();
        players.forEach(player => {
            if (player.posicao) posicoes.add(player.posicao);
            if (player.casta) castas.add(player.casta);
        });
        const addOptions = (selectElement, values) => {
            selectElement.innerHTML = '<option value="" disabled selected>-- Selecione uma opção --</option>';
            [...values].sort().forEach(value => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = value;
                selectElement.appendChild(option);
            });
        };
        addOptions(applyPositionSelect, posicoes);
        addOptions(applyCasteSelect, castas);
    }
    
    function updateApplyModeUI() {
        // ... (função sem alterações)
        const selectedMode = applyMode.value;
        playerSearchContainer.style.display = 'none';
        positionSelectGroup.style.display = 'none';
        casteSelectGroup.style.display = 'none';

        if (selectedMode === 'specific') playerSearchContainer.style.display = 'block';
        else if (selectedMode === 'position') positionSelectGroup.style.display = 'block';
        else if (selectedMode === 'caste') casteSelectGroup.style.display = 'block';
    }

    applyMode.addEventListener('change', updateApplyModeUI);

    saveMarketTime.addEventListener('click', async () => {
        const openTime = document.getElementById('marketOpenTime').value;
        const closeTime = document.getElementById('marketCloseTime').value;
        if (!openTime || !closeTime) {
            return alert('Por favor, preencha os horários de abertura e fechamento.');
        }
        const marketTimes = { 
            abertura: Timestamp.fromDate(new Date(openTime)), 
            fechamento: Timestamp.fromDate(new Date(closeTime)) 
        };
        const selectedMode = applyMode.value;
        let batch = [];
        let targetDescription = "";

        const updatePlayerMarketTime = (id) => {
            if (!id) return null;
            const playerRef = doc(db, 'jogadores', id);
            const rawItem = rawPlayersDocs.find(r => r.id === id);
            const isMigrated = isPlayerMigrated(rawItem?.rawData);
            if (isMigrated || currentSeason !== '2025/2026') {
                return updateDoc(playerRef, new FieldPath(currentSeason, 'marketTimes'), marketTimes);
            } else {
                return updateDoc(playerRef, { marketTimes });
            }
        };

        try {
            switch (selectedMode) {
                case 'all':
                    targetDescription = "todos os jogadores";
                    batch = allPlayers.map(p => updatePlayerMarketTime(p.id || p.rawData?.id)).filter(Boolean);
                    break;
                case 'position':
                    const selectedPosition = applyPositionSelect.value;
                    if (!selectedPosition) return alert('Por favor, selecione uma posição.');
                    targetDescription = `jogadores da posição "${selectedPosition}"`;
                    batch = allPlayers.filter(p => p.posicao === selectedPosition)
                        .map(p => updatePlayerMarketTime(p.id || p.rawData?.id))
                        .filter(Boolean);
                    break;
                case 'caste':
                    const selectedCaste = applyCasteSelect.value;
                    if (!selectedCaste) return alert('Por favor, selecione uma casta.');
                    targetDescription = `jogadores da casta "${selectedCaste}"`;
                    batch = allPlayers.filter(p => p.casta === selectedCaste)
                        .map(p => updatePlayerMarketTime(p.id || p.rawData?.id))
                        .filter(Boolean);
                    break;
                case 'specific':
                    if (selectedPlayersList.size === 0) return alert('Por favor, selecione pelo menos um jogador.');
                    targetDescription = `${selectedPlayersList.size} jogador(es) selecionado(s)`;
                    batch = Array.from(selectedPlayersList)
                        .map(id => updatePlayerMarketTime(id))
                        .filter(Boolean);
                    break;
            }
            if (batch.length === 0) return alert(`Nenhum jogador encontrado para ${targetDescription}.`);
            
            await Promise.all(batch);

            // Salva o log inteligente
            const logCollectionRef = collection(db, 'paineis', 'Banca', 'horarioMercado');
            await addDoc(logCollectionRef, {
                abertura: marketTimes.abertura,
                fechamento: marketTimes.fechamento,
                observacoes: targetDescription,
                dataCriacao: Timestamp.now(),
                tipoAplicacao: selectedMode,
                valorAplicacao: 
                    selectedMode === 'position' ? applyPositionSelect.value :
                    selectedMode === 'caste' ? applyCasteSelect.value :
                    selectedMode === 'specific' ? Array.from(selectedPlayersList) :
                    'all'
            });

            alert(`Horários do mercado atualizados com sucesso para ${targetDescription}!`);
            await loadMarketSchedules();
            renderAgendaCalendar();
            if (openedFromAgenda) {
                openedFromAgenda = false;
                openPopup(agendaMercadoPopup);
            } else {
                closeAllMenus();
            }
            initializeApp();

        } catch (error) {
            console.error('Error saving market times:', error);
            alert('Erro ao salvar horários do mercado.');
        }
    });

    document.querySelectorAll('.position-toggle .toggle-action-button').forEach(button => {
        button.addEventListener('click', async (e) => {
            const position = e.target.dataset.position;
            if (!position) return;
            const activate = e.target.dataset.action === 'activate';
            const actionText = activate ? 'ativar' : 'desativar';
            if (!confirm(`Tem certeza que deseja ${actionText} todos os jogadores da posição "${position}" na temporada ${currentSeason}?`)) return;
            try {
                const posMatching = allPlayers.filter(p => p.posicao === position);
                if (posMatching.length === 0) return alert(`Nenhum jogador encontrado na posição ${position} na temporada ${currentSeason}.`);
                
                const batch = posMatching.map(p => {
                    const playerRef = doc(db, 'jogadores', p.id);
                    const rawItem = rawPlayersDocs.find(r => r.id === p.id);
                    const isMigrated = isPlayerMigrated(rawItem?.rawData);
                    if (isMigrated || currentSeason !== '2025/2026') {
                        return updateDoc(playerRef, new FieldPath(currentSeason, 'noMercado'), activate);
                    } else {
                        return updateDoc(playerRef, { noMercado: activate });
                    }
                });

                await Promise.all(batch);
                alert(`Jogadores da posição ${position} foram atualizados! A lista será recarrega.`);
                closeAllMenus();
                initializeApp();
            } catch (error) {
                console.error(`Erro ao atualizar jogadores da posição ${position}:`, error);
            }
        });
    });

    playerSearch.addEventListener('input', async (e) => {
        // ... (função sem alterações)
        const searchTerm = e.target.value.toLowerCase();
        searchResults.innerHTML = '';
        if (searchTerm.length < 2) return;
        try {
            const playerResults = allPlayers.filter(p => p.nome.toLowerCase().includes(searchTerm));
            searchResults.innerHTML = playerResults
                .map(player => `<div class="search-result-item" data-id="${player.id}" data-name="${player.nome}">${player.nome}</div>`)
                .join('');
            searchResults.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', () => {
                    const playerId = item.dataset.id;
                    const playerName = item.dataset.name;
                    if (!selectedPlayersList.has(playerId)) {
                        selectedPlayersList.add(playerId);
                        const playerTag = document.createElement('div');
                        playerTag.className = 'selected-player';
                        playerTag.innerHTML = `${playerName} <button data-id="${playerId}">×</button>`;
                        selectedPlayers.appendChild(playerTag);
                        playerTag.querySelector('button').addEventListener('click', () => {
                            selectedPlayersList.delete(playerId);
                            playerTag.remove();
                        });
                    }
                    playerSearch.value = '';
                    searchResults.innerHTML = '';
                });
            });
        } catch (error) {
            console.error('Error searching players:', error);
        }
    });

    // --- LÓGICA DO HISTÓRICO DE HORÁRIOS ---

    const viewSchedulesButton = document.getElementById('viewSchedulesButton');
    const schedulesList = document.getElementById('schedulesList');

    if (viewSchedulesButton) {
        viewSchedulesButton.addEventListener('click', async () => {
            if (!schedulesList) return;
            schedulesList.innerHTML = '<p>A carregar horários...</p>';
            if (overlay) overlay.classList.add('active');
            if (viewSchedulesPopup) viewSchedulesPopup.classList.add('active');

            try {
                const logCollectionRef = collection(db, 'paineis', 'Banca', 'horarioMercado');
                const q = query(logCollectionRef, orderBy("dataCriacao", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    schedulesList.innerHTML = '<p>Nenhum horário agendado encontrado.</p>';
                    return;
                }

                schedulesList.innerHTML = '';
                
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const abertura = data.abertura ? data.abertura.toDate().toLocaleString('pt-PT') : 'N/A';
                    const fechamento = data.fechamento ? data.fechamento.toDate().toLocaleString('pt-PT') : 'N/A';
                    
                    const scheduleEntry = document.createElement('div');
                    scheduleEntry.style.border = '1px solid #eee';
                    scheduleEntry.style.borderRadius = '4px';
                    scheduleEntry.style.padding = '12px';
                    scheduleEntry.style.marginBottom = '10px';
                    scheduleEntry.dataset.docId = docSnap.id;
                    scheduleEntry.dataset.docData = JSON.stringify({ ...data, id: docSnap.id });

                    scheduleEntry.innerHTML = `
                        <p><strong>Abertura:</strong> ${abertura}</p>
                        <p><strong>Fechamento:</strong> ${fechamento}</p>
                        <p><strong>Observações:</strong> ${data.observacoes}</p>
                        <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end;">
                            <button class="toggle-action-button delete-schedule" style="background-color: #e74c3c;">Excluir</button>
                        </div>
                    `;
                    schedulesList.appendChild(scheduleEntry);
                });
            } catch (error) {
                console.error("Erro ao buscar horários:", error);
                schedulesList.innerHTML = '<p style="color: red;">Erro ao carregar os horários.</p>';
            }
        });
    }

    if (closeSchedulesPopup) {
        closeSchedulesPopup.addEventListener('click', () => {
            if (overlay) overlay.classList.remove('active');
            if (viewSchedulesPopup) viewSchedulesPopup.classList.remove('active');
        });
    }

    if (schedulesList) {
        schedulesList.addEventListener('click', async (e) => {
            if (!e.target.closest('[data-doc-id]')) return;

            const docId = e.target.closest('[data-doc-id]').dataset.docId;
            const logData = JSON.parse(e.target.closest('[data-doc-id]').dataset.docData);

            if (e.target.classList.contains('delete-schedule')) {
                if (!confirm(`Tem a certeza que quer excluir este agendamento e REVERTER o horário para os jogadores afetados?\n\nObservação: ${logData.observacoes}`)) return;

                try {
                    const { tipoAplicacao, valorAplicacao } = logData;
                    let targetPlayers = [];

                    switch (tipoAplicacao) {
                        case 'all':
                            targetPlayers = allPlayers;
                            break;
                        case 'position':
                            targetPlayers = allPlayers.filter(p => p.posicao === valorAplicacao);
                            break;
                        case 'caste':
                            targetPlayers = allPlayers.filter(p => p.casta === valorAplicacao);
                            break;
                        case 'specific':
                            if (Array.isArray(valorAplicacao)) {
                                targetPlayers = allPlayers.filter(p => valorAplicacao.includes(p.id));
                            }
                            break;
                    }

                    const revertedTimes = { abertura: null, fechamento: null };
                    const updates = targetPlayers.map(p => {
                        const playerRef = doc(db, 'jogadores', p.id);
                        const rawItem = rawPlayersDocs.find(r => r.id === p.id);
                        const isMigrated = isPlayerMigrated(rawItem?.rawData);
                        if (isMigrated || currentSeason !== '2025/2026') {
                            return updateDoc(playerRef, new FieldPath(currentSeason, 'marketTimes'), revertedTimes);
                        } else {
                            return updateDoc(playerRef, { marketTimes: revertedTimes });
                        }
                    });
                    
                    await Promise.all(updates);
                    await deleteDoc(doc(db, 'paineis', 'Banca', 'horarioMercado', docId));

                    alert('Agendamento excluído e horários dos jogadores revertidos com sucesso!');
                    await loadMarketSchedules();
                    renderAgendaCalendar();
                    initializeApp();

                } catch (error) {
                    console.error("Erro ao excluir agendamento:", error);
                    alert("Ocorreu um erro ao excluir o agendamento.");
                }
            }
        });
    }

    // --- INICIALIZAÇÃO DA APLICAÇÃO ---

    function processPlayersForCurrentSeason() {
        return rawPlayersDocs.map(raw => {
            const player = getPlayerSeasonData(raw.rawData, currentSeason);
            player.id = raw.id;
            player.rawData = raw.rawData;

            const clubeData = clubesByNameMap.get(player.clube); 
            if (clubeData) {
                player.clubeData = clubeData;
                const competicaoData = competicoesMap.get(clubeData.competicaoId);
                if (competicaoData) player.competicaoNome = competicaoData.nome;
            }

            if (player.paisId) {
                const paisData = paisesMap.get(player.paisId);
                if (paisData && paisData.imagem) player.paisImagem = paisData.imagem;
            }

            if (player.compradopor) {
                const userData = usersMap.get(player.compradopor);
                if (userData && userData.nometabela) {
                    player.compradorNome = userData.nometabela;
                }
            }

            return player;
        });
    }

    async function initializeApp() {
        try {
            document.getElementById('players-grid').innerHTML = '<p>A carregar jogadores...</p>';
            
            const [seasons, jogadoresSnapshot, clubesSnapshot, competicoesSnapshot, paisesSnapshot, usersSnapshot] = await Promise.all([
                fetchUniqueSeasons(db),
                getDocs(collection(db, 'jogadores')),
                getDocs(collection(db, 'clubes')),
                getDocs(collection(db, 'competicoes')),
                getDocs(collection(db, 'paises')),
                getDocs(collection(db, 'users'))
            ]);

            seasonsList = seasons;
            const filterTemporadaSelect = document.getElementById('filterTemporada');
            filterTemporadaSelect.innerHTML = '';
            seasonsList.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                filterTemporadaSelect.appendChild(opt);
            });

            if (seasonsList.length > 0) {
                currentSeason = seasonsList[0];
                filterTemporadaSelect.value = currentSeason;
            }

            clubesByNameMap.clear();
            clubesSnapshot.forEach(doc => {
                const clubeData = doc.data();
                if (clubeData.nome) clubesByNameMap.set(clubeData.nome, clubeData);
            });

            competicoesMap.clear();
            competicoesSnapshot.forEach(doc => competicoesMap.set(doc.id, doc.data()));

            paisesMap.clear();
            paisesSnapshot.forEach(doc => paisesMap.set(doc.id, doc.data()));

            usersMap.clear();
            usersSnapshot.forEach(doc => usersMap.set(doc.id, doc.data()));

            rawPlayersDocs = jogadoresSnapshot.docs.map(docSnap => ({
                id: docSnap.id,
                rawData: docSnap.data()
            }));

            allPlayers = processPlayersForCurrentSeason();
            
            populateMarketTimeSelectors(allPlayers);
            updateFiltersAndDisplay();

        } catch (error) {
            console.error('Error initializing app:', error);
            document.getElementById('players-grid').innerHTML = '<p style="color: red; text-align: center;">Ocorreu um erro ao carregar os dados.</p>';
        }
    }

    document.getElementById('filterTemporada').addEventListener('change', (e) => {
        currentSeason = e.target.value;
        changedPlayers.clear();
        allPlayers = processPlayersForCurrentSeason();
        populateMarketTimeSelectors(allPlayers);
        updateFiltersAndDisplay();
    });

    document.getElementById('filterPosicao').addEventListener('change', updateFiltersAndDisplay);
    document.getElementById('filterCasta').addEventListener('change', updateFiltersAndDisplay);
    document.getElementById('filterCompeticao').addEventListener('change', updateFiltersAndDisplay);
    document.getElementById('filterPais').addEventListener('change', updateFiltersAndDisplay);

    initializeApp();
    document.getElementById('saveChanges').addEventListener('click', saveChanges);

</script>
