<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Calendários das Competições - G EMPIRE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Estilos do menu e globais -->
    <link rel="stylesheet" href="css/menu-admin.css">
    <link rel="stylesheet" href="css/admin-global.css">
    <link rel="stylesheet" href="css/gerenciar-calendarios-comp.css">
    
    <!-- Guardião de segurança -->
    <script type="module" src="js/auth-guard.js"></script>
</head>
<body style="display: none;">

    <nav id="menu-placeholder" class="top-menu"></nav>

    <main class="content">
        <h1>Gerenciar Calendários das Competições</h1>
        <p class="page-intro">Defina e atualize rapidamente os meses de início e fim de cada competição. Use os filtros de ordenação para visualizar quais competições começam ou terminam primeiro ou último.</p>

        <section class="controls-row" aria-label="Filtros e pesquisas do calendário">
            <div class="search-wrapper">
                <input type="search" class="search-input" placeholder="Pesquisar competição ou país..." id="tableSearch" autocomplete="off">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>

            <select id="filter-pais" class="filter-select" aria-label="Filtrar por país">
                <option value="">Todos os Países</option>
            </select>

            <select id="filter-escalao" class="filter-select" aria-label="Filtrar por escalão">
                <option value="">Todos os Escalões</option>
                <option value="1 Divisão">1 Divisão</option>
                <option value="2 Divisão">2 Divisão</option>
                <option value="3 Divisão">3 Divisão</option>
                <option value="4 Divisão">4 Divisão</option>
                <option value="Taça">Taça</option>
                <option value="Torneio">Torneio</option>
                <option value="Amigável">Amigável</option>
            </select>

            <select id="filter-ordenacao" class="filter-select highlight-select" aria-label="Ordenar resultados">
                <option value="nome-asc">Nome (A-Z)</option>
                <option value="nome-desc">Nome (Z-A)</option>
                <option value="inicio-asc">Início: Mais Cedo (Jan ➔ Dez)</option>
                <option value="inicio-desc">Início: Mais Tarde (Dez ➔ Jan)</option>
                <option value="fim-asc">Fim: Mais Cedo (Jan ➔ Dez)</option>
                <option value="fim-desc">Fim: Mais Tarde (Dez ➔ Jan)</option>
            </select>

            <span id="calendar-status" class="toolbar-status" aria-live="polite"></span>
        </section>

        <section class="table-container" aria-label="Tabela de calendários por competição">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th data-sort="nome" style="cursor: pointer;">Competição <i class="fas fa-sort" aria-hidden="true"></i></th>
                        <th data-sort="pais" style="cursor: pointer;">País <i class="fas fa-sort" aria-hidden="true"></i></th>
                        <th data-sort="escalao" style="cursor: pointer;">Escalão <i class="fas fa-sort" aria-hidden="true"></i></th>
                        <th data-sort="inicioComp" style="cursor: pointer; text-align: center;">Inicio Compt. <i class="fas fa-sort" aria-hidden="true"></i></th>
                        <th data-sort="fimComp" style="cursor: pointer; text-align: center;">Fim Compt. <i class="fas fa-sort" aria-hidden="true"></i></th>
                        <th style="text-align: center; width: 130px;">Estado</th>
                    </tr>
                </thead>
                <tbody id="competitions-table-body">
                    <!-- Carregado via JS -->
                </tbody>
            </table>
        </section>

        <div style="text-align: center; margin-bottom: 30px;">
            <button id="btn-load-more" class="submit-btn success" type="button" style="display: none; margin: 0 auto; width: auto; padding: 10px 30px; font-weight: bold;">Carregar mais</button>
        </div>
    </main>

    <script type="module" src="js/gerenciar-calendarios-comp.js"></script>
    <script src="js/menuadmin-loader.js"></script>
</body>
</html>
