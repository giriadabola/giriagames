<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Estádios do Manager - GGames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="css/menu-admin.css?v=20260722_cb">
    <script type="module" src="js/auth-guard.js?v=20260722_cb"></script>
    <link rel="stylesheet" href="css/admin-global.css?v=20260722_cb">

    <style>
        .content {
            padding-top: 85px !important;
            max-width: 100% !important;
            width: 100% !important;
            padding-left: 24px !important;
            padding-right: 24px !important;
            margin: 0 !important;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-link-btn {
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8b949e;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-link-btn:hover {
            color: #58a6ff;
            background-color: rgba(56, 139, 253, 0.15);
            border-color: rgba(56, 139, 253, 0.4);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 26px;
            font-weight: 700;
            color: #f0f6fc;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Search Container */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 100% !important;
            margin: 0 auto 30px auto;
        }
        .search-input {
            width: 100%;
            background-color: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f0f6fc;
            border-radius: 10px;
            padding: 12px 42px 12px 16px;
            font-size: 15px;
        }
        .search-input:focus {
            outline: none;
            border-color: #388bfd;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.2);
        }
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
            pointer-events: none;
        }

        /* Square Cards Grid for Estádios */
        .estadios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .estadio-card {
            background-color: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            position: relative;
        }
        .estadio-card:hover {
            transform: translateY(-4px);
            border-color: #388bfd;
            background-color: #1c2128;
            box-shadow: 0 8px 25px rgba(56, 139, 253, 0.3);
        }

        .badge-anexados {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.3);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-top-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 16px;
            width: 100%;
        }

        .estadio-card img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .estadio-card .icon-placeholder {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background-color: rgba(56, 139, 253, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #388bfd;
            margin-bottom: 8px;
        }

        .estadio-card h3 {
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .card-nota-box {
            background-color: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 10px;
            width: 100%;
            color: #8b949e;
            font-size: 12px;
            line-height: 1.35;
            text-align: left;
            word-break: break-word;
            max-height: 55px;
            overflow-y: auto;
        }
        .card-nota-box strong {
            color: #c9d1d9;
        }

        /* Modal Popup for Attached Items */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background-color: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            width: 100%;
            max-width: 1150px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            background-color: #0d1117;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h2 {
            margin: 0;
            color: #f0f6fc;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #8b949e;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-close-btn:hover {
            color: #f0f6fc;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .modal-back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #8b949e;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 8px;
        }
        .modal-back-btn:hover {
            color: #58a6ff;
            background-color: rgba(56, 139, 253, 0.15);
            border-color: rgba(56, 139, 253, 0.4);
        }

        .modal-breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 16px;
            padding: 8px 14px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
            white-space: nowrap;
        }
        .modal-breadcrumbs .crumb-item {
            color: #58a6ff;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .modal-breadcrumbs .crumb-item:hover {
            text-decoration: underline;
            color: #79c0ff;
        }
        .modal-breadcrumbs .crumb-current {
            color: #f0f6fc;
            font-weight: 600;
        }
        .modal-breadcrumbs .crumb-sep {
            font-size: 10px;
            color: #484f58;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        .stadium-detail-banner {
            background-color: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stadium-detail-banner img {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border-radius: 10px;
        }
        .stadium-detail-banner .banner-icon {
            font-size: 32px;
            color: #388bfd;
        }
        .stadium-detail-banner div h3 {
            color: #f0f6fc;
            margin: 0 0 4px 0;
            font-size: 18px;
        }
        .stadium-detail-banner div p {
            color: #8b949e;
            margin: 0;
            font-size: 13px;
        }

        .attached-items-container {
            display: flex;
            flex-direction: column;
            gap: 28px;
            width: 100%;
        }

        .category-group-section {
            width: 100%;
        }

        .category-group-title {
            color: #58a6ff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .attached-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .attached-item-card {
            background-color: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s ease;
        }
        .attached-item-card:hover {
            border-color: rgba(56, 139, 253, 0.4);
            transform: translateY(-2px);
        }
        .attached-item-card h4 {
            color: #f0f6fc;
            font-size: 15px;
            margin: 0 0 6px 0;
        }
        .attached-item-card p {
            color: #8b949e;
            font-size: 12px;
            margin: 0 0 4px 0;
        }
        .attached-item-card .item-tag {
            display: inline-block;
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .btn-sub-anexos {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.35);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            width: fit-content;
        }
        .btn-sub-anexos:hover {
            background: #388bfd;
            color: #ffffff;
            border-color: #388bfd;
            box-shadow: 0 0 10px rgba(56, 139, 253, 0.4);
            transform: translateY(-1px);
        }

        .badge-sub-anexos-indicator {
            background: rgba(56, 139, 253, 0.12);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.25);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8b949e;
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 36px;
            color: #388bfd;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
<body style="display: none;">

    <nav id="menu-placeholder" class="top-menu"></nav>

    <main class="content">
        <div class="header-top-row">
            <a href="gerenciar-manager.html" class="nav-link-btn"><i class="fas fa-users"></i> Gerir Mercado Manager</a>
            <a href="editar-manager.html" class="nav-link-btn"><i class="fas fa-edit"></i> Editar Itens</a>
        </div>

        <h1><i class="fas fa-landmark" style="color: #388bfd;"></i> Estádios do Manager</h1>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Pesquisar estádio por nome..." class="search-input">
            <i class="fas fa-search search-icon"></i>
        </div>

        <div id="estadios-grid" class="estadios-grid">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Carregando estádios...</p></div>
        </div>
    </main>

    <!-- Modal para Exibir os Itens Anexados ao Estádio ou Item Selecionado -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div style="display: flex; align-items: center;">
                    <button id="modal-back-btn" class="modal-back-btn" style="display: none;" title="Voltar"><i class="fas fa-arrow-left"></i></button>
                    <h2 id="modal-stadium-title"><i class="fas fa-landmark"></i> Detalhes do Estádio</h2>
                </div>
                <button id="modal-close-btn" class="modal-close-btn">×</button>
            </div>
            <div class="modal-body">
                <div id="modal-breadcrumbs" class="modal-breadcrumbs" style="display: none;"></div>
                <div id="stadium-banner" class="stadium-detail-banner"></div>
                <h3 id="attached-section-title" style="color: #f0f6fc; font-size: 16px; margin-bottom: 16px;">Itens Anexados</h3>
                <div id="attached-items-container" class="attached-items-container"></div>
            </div>
        </div>
    </div>

    <!-- Modal Secundário para Exibir Todos os Detalhes do Item -->
    <div id="item-detail-modal-overlay" class="modal-overlay" style="z-index: 3000;">
        <div class="modal-container" style="max-width: 650px;">
            <div class="modal-header">
                <h2 id="detail-modal-title"><i class="fas fa-info-circle"></i> Detalhes do Item</h2>
                <button id="detail-modal-close-btn" class="modal-close-btn">×</button>
            </div>
            <div id="detail-modal-body" class="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { db } from './js/auth-guard.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let allItems = [];
        let estadiosItems = [];
        let modalHistory = []; // Stack de navegação no modal [item1, item2, ...]
        let currentModalItem = null;

        const estadiosGrid = document.getElementById('estadios-grid');
        const searchInput = document.getElementById('search-input');

        const modalOverlay = document.getElementById('modal-overlay');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalBackBtn = document.getElementById('modal-back-btn');
        const modalBreadcrumbs = document.getElementById('modal-breadcrumbs');
        const modalStadiumTitle = document.getElementById('modal-stadium-title');
        const stadiumBanner = document.getElementById('stadium-banner');
        const attachedItemsContainer = document.getElementById('attached-items-container');
        const attachedSectionTitle = document.getElementById('attached-section-title');

        const itemDetailModalOverlay = document.getElementById('item-detail-modal-overlay');
        const detailModalCloseBtn = document.getElementById('detail-modal-close-btn');
        const detailModalBody = document.getElementById('detail-modal-body');

        // Helper para obter itens anexados a qualquer item ou estádio
        function getAttachedItems(parent) {
            if (!parent || !parent.id) return [];
            const pId = String(parent.id);
            const pNome = (parent.nome || '').trim().toLowerCase();

            return allItems.filter(item => {
                if (item.id === parent.id) return false;

                if (item.anexadoItemId && String(item.anexadoItemId) === pId) return true;
                if (Array.isArray(item.anexadoItemIds) && item.anexadoItemIds.map(String).includes(pId)) return true;
                
                if (item.anexadoItem) {
                    const val = String(item.anexadoItem).trim();
                    if (val === pId || (pNome && val.toLowerCase() === pNome)) return true;
                }

                return false;
            });
        }

        async function loadData() {
            try {
                const querySnapshot = await getDocs(collection(db, 'managerItens'));
                allItems = [];
                querySnapshot.forEach((doc) => {
                    allItems.push({ id: doc.id, ...doc.data() });
                });
                
                // Filtrar apenas itens de tipo === 'Estádio' (ou variações case-insensitive)
                estadiosItems = allItems.filter(item => {
                    const tipo = (item.tipo || '').toLowerCase();
                    return tipo.includes('estádio') || tipo.includes('estadio');
                });

                estadiosItems.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
                renderEstadios();
            } catch (error) {
                console.error("Erro ao carregar estádios:", error);
                estadiosGrid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Erro ao carregar estádios.</p></div>`;
            }
        }

        function renderEstadios() {
            if (!estadiosGrid) return;
            const searchVal = searchInput ? searchInput.value.toLowerCase().trim() : '';

            const filteredEstadios = estadiosItems.filter(estadio => 
                (estadio.nome || '').toLowerCase().includes(searchVal)
            );

            if (filteredEstadios.length === 0) {
                estadiosGrid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Nenhum estádio encontrado.</p></div>`;
                return;
            }

            estadiosGrid.innerHTML = '';
            filteredEstadios.forEach(estadio => {
                // Encontrar os itens anexados a este estádio
                const attached = getAttachedItems(estadio);

                const card = document.createElement('div');
                card.className = 'estadio-card';
                card.onclick = () => openRootModal(estadio);

                const imageHtml = estadio.imagem 
                    ? `<img src="${estadio.imagem}" alt="${estadio.nome}">`
                    : `<div class="icon-placeholder"><i class="fas fa-landmark"></i></div>`;

                const notaText = estadio.nota ? estadio.nota : 'Sem nota';
                const notaHtml = `<div class="card-nota-box"><strong>Nota:</strong> ${notaText}</div>`;

                card.innerHTML = `
                    <span class="badge-anexados"><i class="fas fa-paperclip"></i> ${attached.length} ${attached.length === 1 ? 'Anexado' : 'Anexados'}</span>
                    <div class="card-top-info">
                        ${imageHtml}
                        <h3>${estadio.nome || 'Estádio sem nome'}</h3>
                    </div>
                    ${notaHtml}
                `;
                estadiosGrid.appendChild(card);
            });
        }

        function openRootModal(item) {
            modalHistory = [];
            renderModalView(item);
            modalOverlay.classList.add('active');
        }

        function navigateToSubItem(childItem) {
            if (currentModalItem) {
                modalHistory.push(currentModalItem);
            }
            renderModalView(childItem);
        }

        function navigateBack() {
            if (modalHistory.length > 0) {
                const prevItem = modalHistory.pop();
                renderModalView(prevItem);
            }
        }

        function navigateToHistoryIndex(index) {
            if (index >= 0 && index < modalHistory.length) {
                const targetItem = modalHistory[index];
                modalHistory = modalHistory.slice(0, index);
                renderModalView(targetItem);
            }
        }

        function renderModalView(parentItem) {
            currentModalItem = parentItem;
            const attachedItems = getAttachedItems(parentItem);
            const isEstadio = (parentItem.tipo || '').toLowerCase().includes('estádio') || (parentItem.tipo || '').toLowerCase().includes('estadio');

            // Configurar Botão Voltar
            if (modalHistory.length > 0) {
                modalBackBtn.style.display = 'flex';
            } else {
                modalBackBtn.style.display = 'none';
            }

            // Configurar Breadcrumbs
            if (modalHistory.length > 0) {
                modalBreadcrumbs.style.display = 'flex';
                let crumbsHtml = '';
                modalHistory.forEach((histItem, idx) => {
                    const isHistEstadio = (histItem.tipo || '').toLowerCase().includes('estádio') || (histItem.tipo || '').toLowerCase().includes('estadio');
                    const icon = isHistEstadio ? '<i class="fas fa-landmark"></i>' : '<i class="fas fa-box"></i>';
                    crumbsHtml += `<span class="crumb-item" data-idx="${idx}">${icon} ${histItem.nome || 'Item'}</span><i class="fas fa-chevron-right crumb-sep"></i>`;
                });
                crumbsHtml += `<span class="crumb-current">${parentItem.nome || 'Item'}</span>`;
                modalBreadcrumbs.innerHTML = crumbsHtml;

                // Event listener para os cliques nas migalhas
                modalBreadcrumbs.querySelectorAll('.crumb-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = parseInt(el.getAttribute('data-idx'), 10);
                        navigateToHistoryIndex(idx);
                    });
                });
            } else {
                modalBreadcrumbs.style.display = 'none';
                modalBreadcrumbs.innerHTML = '';
            }

            // Título do cabeçalho
            const titleIcon = isEstadio ? 'fa-landmark' : 'fa-box-open';
            modalStadiumTitle.innerHTML = `<i class="fas ${titleIcon}" style="color: #388bfd;"></i> ${parentItem.nome || (isEstadio ? 'Estádio' : 'Item')}`;

            // Banner
            const bannerImage = parentItem.imagem
                ? `<img src="${parentItem.imagem}" alt="${parentItem.nome}">`
                : `<i class="fas ${isEstadio ? 'fa-landmark' : 'fa-box'} banner-icon"></i>`;

            const valorHtml = (parentItem.valor !== undefined && parentItem.valor !== null)
                ? `<span style="display:inline-block; margin-left:8px; font-size:12px; color:#58a6ff; font-weight:600; background:rgba(56,139,253,0.15); padding:2px 8px; border-radius:10px;">${parentItem.valor} GCoins</span>`
                : '';

            stadiumBanner.innerHTML = `
                ${bannerImage}
                <div style="flex-grow: 1;">
                    <div style="display: flex; align-items: center; margin-bottom: 4px;">
                        <span class="item-tag" style="margin: 0;">${parentItem.tipo || (isEstadio ? 'Estádio' : 'Item')}</span>
                        ${valorHtml}
                    </div>
                    <h3 style="margin: 4px 0 6px 0;">${parentItem.nome || 'Sem nome'}</h3>
                    <p><strong>Nota:</strong> ${parentItem.nota || 'Sem nota cadastrada.'}</p>
                </div>
            `;

            attachedSectionTitle.innerHTML = `<i class="fas fa-paperclip" style="color: #58a6ff;"></i> Itens Anexados (${attachedItems.length})`;

            if (attachedItems.length === 0) {
                attachedItemsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>Nenhum item anexado a este ${isEstadio ? 'estádio' : 'item'} ainda.</p>
                    </div>
                `;
            } else {
                // Agrupar itens por categoria / tipo
                const grouped = {};
                attachedItems.forEach(item => {
                    const tipo = item.tipo || 'Outros';
                    if (!grouped[tipo]) grouped[tipo] = [];
                    grouped[tipo].push(item);
                });

                // Ordenar itens dentro de cada grupo por ordem, depois nome
                Object.keys(grouped).forEach(tipo => {
                    grouped[tipo].sort((a, b) => {
                        const oA = a.ordem !== undefined && a.ordem !== null && a.ordem !== '' ? Number(a.ordem) : 99999;
                        const oB = b.ordem !== undefined && b.ordem !== null && b.ordem !== '' ? Number(b.ordem) : 99999;
                        if (oA !== oB) return oA - oB;
                        return (a.nome || '').localeCompare(b.nome || '');
                    });
                });

                attachedItemsContainer.innerHTML = '';
                
                // Ordenar nomes de categorias
                const categoryNames = Object.keys(grouped).sort();

                categoryNames.forEach(category => {
                    const groupSection = document.createElement('div');
                    groupSection.className = 'category-group-section';

                    const groupTitle = document.createElement('h4');
                    groupTitle.className = 'category-group-title';
                    groupTitle.innerHTML = `<i class="fas fa-layer-group"></i> ${category} (${grouped[category].length})`;

                    const categoryGrid = document.createElement('div');
                    categoryGrid.className = 'attached-items-grid';

                    grouped[category].forEach(item => {
                        const subAttached = getAttachedItems(item);
                        const card = document.createElement('div');
                        card.className = 'attached-item-card';
                        card.style.cursor = 'pointer';
                        card.onclick = () => openItemDetailModal(item, parentItem);
                        
                        const valorText = item.valor !== undefined && item.valor !== null ? `${item.valor} GCoins` : 'Sem valor';
                        const notaText = item.nota ? item.nota : 'Sem nota';
                        const ordemText = item.ordem !== undefined && item.ordem !== null && item.ordem !== '' ? item.ordem : null;

                        const subAttachedBtnHtml = subAttached.length > 0
                            ? `<button class="btn-sub-anexos" title="Ver os ${subAttached.length} item(ns) anexados a este item">
                                    <i class="fas fa-paperclip"></i> ${subAttached.length} ${subAttached.length === 1 ? 'Anexo' : 'Anexos'}
                                    <i class="fas fa-chevron-right" style="font-size: 9px; margin-left: 2px;"></i>
                               </button>`
                            : '';

                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                                <span class="item-tag" style="margin-bottom: 0;">${item.tipo || 'Item'}</span>
                                ${subAttached.length > 0 ? `<span class="badge-sub-anexos-indicator"><i class="fas fa-paperclip"></i> ${subAttached.length}</span>` : ''}
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
                                ${item.imagem ? `<img src="${item.imagem}" alt="${item.nome}" style="width:34px; height:34px; object-fit:cover; border-radius:6px; border:1px solid rgba(255,255,255,0.1);">` : ''}
                                <h4 style="margin: 0; word-break: break-word;">${item.nome || 'Item'}</h4>
                            </div>
                            <p><strong>Valor:</strong> ${valorText}</p>
                            ${ordemText !== null ? `<p><strong>Ordem:</strong> ${ordemText}</p>` : ''}
                            <p><strong>Nota:</strong> ${notaText}</p>
                            ${subAttachedBtnHtml}
                        `;

                        // Anexar handler no botão de sub-anexos (com stopPropagation para não abrir o detail modal)
                        const subBtn = card.querySelector('.btn-sub-anexos');
                        if (subBtn) {
                            subBtn.onclick = (e) => {
                                e.stopPropagation();
                                navigateToSubItem(item);
                            };
                        }

                        categoryGrid.appendChild(card);
                    });

                    groupSection.appendChild(groupTitle);
                    groupSection.appendChild(categoryGrid);
                    attachedItemsContainer.appendChild(groupSection);
                });
            }
        }

        function openItemDetailModal(item, parentItem) {
            if (!itemDetailModalOverlay || !detailModalBody) return;

            const imageHtml = item.imagem
                ? `<img src="${item.imagem}" alt="${item.nome}" style="width:64px; height:64px; object-fit:cover; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">`
                : `<div style="width:64px; height:64px; border-radius:12px; background:rgba(56,139,253,0.1); display:flex; align-items:center; justify-content:center; font-size:28px; color:#388bfd;"><i class="fas fa-box"></i></div>`;

            const valorDisplay = item.valor !== undefined && item.valor !== null ? `${item.valor} GCoins` : 'N/A';
            const nivelDisplay = item.nivel || 'N/A';
            const ordemDisplay = item.ordem !== undefined && item.ordem !== null ? item.ordem : 'N/A';
            const noMercadoDisplay = item.noMercado === true ? 'Sim' : (item.noMercado === false ? 'Não' : 'N/A');
            const parentNome = parentItem ? parentItem.nome : (item.anexadoItem || 'Nenhum');

            const subAttached = getAttachedItems(item);
            const subAttachedActionHtml = subAttached.length > 0
                ? `<div style="margin-top: 16px; padding: 12px; background: rgba(56,139,253,0.1); border: 1px solid rgba(56,139,253,0.3); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <strong style="color: #58a6ff; font-size: 13px;"><i class="fas fa-paperclip"></i> Este item possui ${subAttached.length} item(ns) anexado(s)</strong>
                            <p style="margin: 2px 0 0 0; font-size: 11px; color: #8b949e;">Clique para abrir a lista de anexos deste item.</p>
                        </div>
                        <button id="detail-open-sub-btn" class="btn-sub-anexos" style="margin: 0; padding: 6px 12px;">
                            Ver Anexos <i class="fas fa-arrow-right" style="font-size: 10px;"></i>
                        </button>
                   </div>`
                : '';

            detailModalBody.innerHTML = `
                <div style="background:#0d1117; border-radius:14px; padding:20px; border:1px solid rgba(255,255,255,0.08);">
                    <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:16px;">
                        ${imageHtml}
                        <div style="flex-grow:1;">
                            <span class="item-tag">${item.tipo || 'Item'}</span>
                            <h3 style="color:#f0f6fc; font-size:20px; margin:6px 0 2px 0;">${item.nome || 'Sem Nome'}</h3>
                            <p style="color:#8b949e; font-size:12px; margin:0;">ID: ${item.id}</p>
                        </div>
                    </div>
                    
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:18px;">
                        <div>
                            <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:2px;">Tipo:</span>
                            <strong style="color:#f0f6fc; font-size:14px;">${item.tipo || 'N/A'}</strong>
                        </div>
                        <div>
                            <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:2px;">Valor:</span>
                            <strong style="color:#f0f6fc; font-size:14px;">${valorDisplay}</strong>
                        </div>
                        <div>
                            <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:2px;">Nível:</span>
                            <strong style="color:#f0f6fc; font-size:14px;">${nivelDisplay}</strong>
                        </div>
                        <div>
                            <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:2px;">No Mercado:</span>
                            <strong style="color:${item.noMercado === true ? '#3fb950' : '#f85149'}; font-size:14px;">${noMercadoDisplay}</strong>
                        </div>
                        <div>
                            <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:2px;">Ordem:</span>
                            <strong style="color:#f0f6fc; font-size:14px;">${ordemDisplay}</strong>
                        </div>
                        <div>
                            <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:2px;">Item / Estádio Pai:</span>
                            <strong style="color:#58a6ff; font-size:14px;"><i class="fas fa-layer-group"></i> ${parentNome}</strong>
                        </div>
                    </div>

                    <div>
                        <span style="color:#8b949e; font-size:12px; display:block; margin-bottom:4px;">Nota / Descrição Completa:</span>
                        <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:12px; border-radius:8px; color:#c9d1d9; font-size:13px; line-height:1.45; word-break:break-word;">
                            ${item.nota || 'Sem nota cadastrada.'}
                        </div>
                    </div>

                    ${subAttachedActionHtml}
                </div>
            `;

            if (subAttached.length > 0) {
                const detailOpenSubBtn = detailModalBody.querySelector('#detail-open-sub-btn');
                if (detailOpenSubBtn) {
                    detailOpenSubBtn.onclick = () => {
                        closeDetailModal();
                        navigateToSubItem(item);
                    };
                }
            }

            itemDetailModalOverlay.classList.add('active');
        }

        function closeDetailModal() {
            if (itemDetailModalOverlay) itemDetailModalOverlay.classList.remove('active');
        }

        if (detailModalCloseBtn) {
            detailModalCloseBtn.addEventListener('click', closeDetailModal);
        }

        if (itemDetailModalOverlay) {
            itemDetailModalOverlay.addEventListener('click', (e) => {
                if (e.target === itemDetailModalOverlay) closeDetailModal();
            });
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            modalHistory = [];
            currentModalItem = null;
        }

        if (searchInput) {
            searchInput.addEventListener('input', renderEstadios);
        }

        if (modalCloseBtn) {
            modalCloseBtn.addEventListener('click', closeModal);
        }

        if (modalBackBtn) {
            modalBackBtn.addEventListener('click', navigateBack);
        }

        if (modalOverlay) {
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>

    <!-- Script de carregamento do menu dinâmico de administração -->
    <script src="js/menuadmin-loader.js?v=20260722_cb"></script>
</body>
