<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrar utilizadores para 2025/2026</title>
    <link rel="stylesheet" href="css/menu-admin.css">
    <script type="module" src="js/auth-guard.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #10151f; color: #eef2f7; }
        main { max-width: 760px; margin: 0 auto; }
        button { padding: 12px 18px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 700; }
        #run-migration { background: #2ecc71; color: #0b1710; }
        #status { margin-top: 18px; white-space: pre-wrap; background: #18202d; padding: 16px; border-radius: 8px; min-height: 120px; }
        code { color: #8bd5ff; }
    </style>
</head>
<body>
    <main>
        <h1>Migrar utilizadores para 2025/2026</h1>
        <p>Move para <code>users/{uid}/2025/2026</code> todos os campos não permanentes. Por exemplo, <code>20252026GCoins</code> passa a <code>2025/2026.GCoins</code>. Os campos antigos são removidos depois de preparados os novos dados.</p>
        <button id="run-migration">Iniciar migração</button>
        <div id="status">A aguardar...</div>
    </main>

    <script type="module">
        import { db } from './js/auth-guard.js';
        import { collection, getDocs, setDoc, deleteField, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { PERMANENT_USER_FIELDS } from '../core/user-season.js';

        const button = document.getElementById('run-migration');
        const status = document.getElementById('status');
        const TARGET_SEASON = '2025/2026';

        function appendStatus(message) {
            status.textContent += `${message}\n`;
        }

        function getMigratedFieldName(field) {
            const match = field.match(/^\d{8}(GCoins|Pontos|PontosPossiveis)$/);
            return match ? match[1] : field;
        }

        button.addEventListener('click', async () => {
            button.disabled = true;
            status.textContent = '';
            try {
                const usersSnapshot = await getDocs(collection(db, 'users'));
                let migrated = 0;

                for (const userSnapshot of usersSnapshot.docs) {
                    const userData = userSnapshot.data();
                    const seasonUpdates = {};
                    const deletions = {};

                    Object.entries(userData).forEach(([field, value]) => {
                        if (PERMANENT_USER_FIELDS.has(field)) return;
                        if (field === TARGET_SEASON) {
                            seasonUpdates[TARGET_SEASON] = { ...(seasonUpdates[TARGET_SEASON] || {}), ...(value || {}) };
                            return;
                        }
                        if (/^\d{4}\/\d{4}$/.test(field)) {
                            // Mantém épocas já migradas, mas não mistura os seus dados.
                            seasonUpdates[field] = { ...(seasonUpdates[field] || {}), ...(value || {}) };
                            return;
                        }

                        seasonUpdates[TARGET_SEASON] = {
                            ...(seasonUpdates[TARGET_SEASON] || {}),
                            [getMigratedFieldName(field)]: value
                        };
                        deletions[field] = deleteField();
                    });

                    if (Object.keys(seasonUpdates).length === 0) continue;
                    await setDoc(doc(db, 'users', userSnapshot.id), { ...seasonUpdates, ...deletions }, { merge: true });
                    migrated++;
                }

                appendStatus(`Migração concluída. Utilizadores processados: ${migrated}.`);
                appendStatus(`Época migrada: ${TARGET_SEASON}.`);
            } catch (error) {
                console.error(error);
                appendStatus(`Erro: ${error.message}`);
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
