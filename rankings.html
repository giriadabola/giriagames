<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Classificativa - Ggames</title>
        <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="rankings/rankings.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div class="content">
        <div class="header-container">
            <div class="title-section">
                <h1 class="market-title">Tabela Classificativa</h1>
            </div>
        </div>
        <div id="highlights-container" class="highlights-container"></div>
        <p id="status-indicator" style="margin-top: 5px; margin-bottom: 10px; font-size: 0.8em; text-align: right; color: #555;"></p>
        <table class="rankings-table">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Jogador</th>
                    <th>Pontos</th>
                    <th>Info</th>
                </tr>
            </thead>
            <tbody id="rankings-body">
                <!-- Rankings will be populated dynamically -->
            </tbody>
        </table>

        <!-- Popup Container (Original) -->
        <div id="predictions-popup" class="predictions-popup">
            <div class="popup-content">
                <span class="close-button" id="close-popup">×</span>
                <div class="filter-container" style="margin-bottom: 10px; max-width: 200px;">
                    <select id="round-filter" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ddd; font-size: 14px;">
                        <option value="">Todas as Rondas</option>
                    </select>
                </div>
                <div id="popup-predictions-body">
                    <!-- Predictions content will be loaded here por JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- --- NOVO POPUP DE ANIMAÇÃO DE RANKINGS --- -->
    <div id="ranking-animation-popup" class="predictions-popup" style="display: none;">
        <div class="popup-content">
            <span class="close-button" id="close-animation-popup">×</span>
            <h2 id="animation-popup-title" style="text-align: center; margin-bottom: 20px;">Movimentações da Ronda</h2>
            <ul id="ranking-changes-list" style="list-style: none; padding: 0;">
                <!-- O conteúdo será gerado dinamicamente -->
            </ul>
        </div>
    </div>
    <!-- --- FIM DO NOVO POPUP --- -->


    <div id="alfredo-pack-popup" class="predictions-popup" style="display: none;">
        <div class="popup-content" style="max-width: 460px; text-align: center;">
            <span class="close-button" id="close-alfredo-pack-popup">Ã—</span>
            <h2 style="margin-bottom: 14px;">Oferta do Sr Alfredo</h2>
            <p id="alfredo-pack-message" style="margin-bottom: 10px; font-size: 1.05rem;"></p>
            <p style="margin-bottom: 22px; color: #8892b0;">Clica para abrir as saquetas na caderneta.</p>
            <button id="open-alfredo-pack-btn" style="padding: 12px 18px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #d35400, #f39c12); color: white; font-weight: 700; cursor: pointer;">Abrir saqueta(s)</button>
        </div>
    </div>

    <div id="toast-notification" class="toast-notification"></div>

    <script src="config.js"></script>
    <script type="module" src="rankings/rankings.js"></script>
    <script src="core/menu-component.js"></script>
    <script src="core/top-bar-component.js" type="module"></script>
</body>
</html>
