<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mods - G EMPIRE</title>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="mods/mods.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <div class="content">
        <h1>Mods</h1>
        <div id="mods-container" class="mods-container"></div>
    </div>

    <!-- Mod Popup Overlay -->
    <div id="mod-popup-overlay" class="mod-popup-overlay">
        <div class="mod-popup-content">
            <button class="mod-popup-close">
                <i class="fas fa-times"></i>
            </button>
            <div class="mod-popup-header">
                <div class="mod-popup-image-container">
                    <div class="casta-explanation-popup" id="casta-explanation-popup">
                        <div class="casta-explanation-content" id="casta-explanation-content"></div>
                    </div>
                    <div class="mod-popup-animated-icon" id="popup-mod-icon" data-casta="">
                        <video id="popup-mod-video-icon" autoplay loop muted playsinline>
                            <source src="" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <div class="video-overlay" id="video-overlay"></div>
                    </div>
                    <img src="" alt="" class="mod-popup-image" id="popup-mod-image">
                    <div class="mod-popup-overall">
                        <span class="overall-label">Overall:</span>
                        <span class="overall-value" id="popup-mod-overall"></span>
                    </div>
                    <div class="mod-popup-points">
                        <span class="mod-popup-points-gain" id="popup-mod-points-gain"></span>
                        <span class="mod-popup-points-loss" id="popup-mod-points-loss"></span>
                    </div>
                </div>
                <h2 class="mod-popup-title" id="popup-mod-title"></h2>
            </div>
            <div class="mod-popup-description" id="popup-mod-description"></div>
        </div>
    </div>

    <!-- Fullscreen Image Popup Overlay -->
    <div id="fullscreen-image-overlay" class="fullscreen-image-overlay">
        <button class="fullscreen-close">
            <i class="fas fa-times"></i>
        </button>
        <div class="fullscreen-image-container">
            <img src="" alt="" class="fullscreen-image" id="fullscreen-image">
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="mods/mods.js"></script>
    <script src="core/menu-component.js"></script> 
</body>
</html>
