<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Dinâmica e Inteligente</title>
    <!-- Google Fonts & Icones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f17 100%);
            --panel-bg: rgba(25, 24, 38, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            --glass-glow: 0 8px 32px 0 rgba(139, 92, 246, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar & Control Panel */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.75rem;
            box-shadow: var(--glass-glow);
            position: sticky;
            top: 2rem;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        /* Configured Years Section */
        .years-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        /* Scrollbar styling */
        .years-list::-webkit-scrollbar, .main-content::-webkit-scrollbar {
            width: 6px;
        }
        .years-list::-webkit-scrollbar-thumb, .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .year-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.25rem 1rem;
            transition: var(--transition);
        }

        .year-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .year-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .year-select-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .year-select {
            background: #1e1b29;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.35rem 0.5rem;
            border-radius: 8px;
            outline: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-remove-year {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.6;
            padding: 0.25rem;
        }

        .btn-remove-year:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Custom Dropdown Month Selector */
        .month-dropdown-container {
            position: relative;
            width: 100%;
        }

        .month-dropdown-btn {
            width: 100%;
            padding: 0.65rem 0.75rem;
            background: #181622;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .month-dropdown-btn:hover {
            border-color: rgba(139, 92, 246, 0.4);
            background: #1d1b2a;
        }

        .month-dropdown-content {
            display: none;
            position: absolute;
            top: 105%;
            left: 0;
            width: 100%;
            background: #151322;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 10;
            max-height: 250px;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .month-dropdown-content.show {
            display: block;
        }

        .month-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: var(--transition);
            user-select: none;
        }

        .month-option:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .month-option.active {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            font-weight: 600;
        }

        .month-option input[type="checkbox"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* View Mode toggle */
        .view-mode-selector {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.3rem;
            display: flex;
            margin-top: 1.5rem;
        }

        .view-mode-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .view-mode-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Main Content Panel */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .empty-state {
            background: var(--panel-bg);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 5rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        /* Month Agenda Block */
        .month-block {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.75rem;
            box-shadow: var(--glass-glow);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .month-block-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .month-block-title span.year-badge {
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: var(--text-muted);
        }

        /* Grid View Layout */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .weekday-header {
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.5rem 0;
        }

        .grid-day {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
        }

        .grid-day:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        .grid-day.empty {
            background: transparent;
            border: none;
            cursor: default;
            pointer-events: none;
        }

        .day-number {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .day-indicator {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            bottom: 0.5rem;
            right: 0.5rem;
            display: none;
        }

        .grid-day.has-notes .day-indicator {
            display: block;
        }

        /* List View Layout */
        .calendar-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .list-day-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 1rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }

        .list-day-row:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .list-day-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .list-day-label {
            font-weight: 700;
            font-size: 1rem;
        }

        .list-day-weekday {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        .list-day-note-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .list-day-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 2rem 0.6rem 0.75rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .list-day-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
            background: rgba(0, 0, 0, 0.3);
        }

        .save-indicator {
            position: absolute;
            right: 0.75rem;
            font-size: 0.8rem;
            color: #10b981;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .save-indicator.active {
            opacity: 1;
        }

        /* Detail Modal for Grid Click */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.25s ease;
        }

        .modal {
            background: #151324;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: white;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .modal-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem;
            color: var(--text-main);
            outline: none;
            resize: none;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .modal-textarea:focus {
            border-color: var(--primary);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Sidebar controls -->
        <div class="sidebar">
            <h1 class="header-title">
                <i class="fa-solid fa-calendar-days" style="color: var(--primary);"></i>
                Agenda Pro
            </h1>
            <p class="header-subtitle">Selecione anos e meses para planejar e visualizar de forma interativa.</p>

            <button class="btn-primary" id="btn-add-year">
                <i class="fa-solid fa-plus"></i> Adicionar Ano
            </button>

            <!-- Mode selector -->
            <div class="view-mode-selector">
                <button class="view-mode-btn active" data-mode="grid">
                    <i class="fa-solid fa-table-cells-large"></i> Grelha
                </button>
                <button class="view-mode-btn" data-mode="list">
                    <i class="fa-solid fa-list-ul"></i> Lista
                </button>
            </div>

            <!-- List of dynamic years selection -->
            <div class="years-list" id="years-list-container">
                <!-- Dynamically populated year cards -->
            </div>
        </div>

        <!-- Main Display Panel -->
        <div class="main-content" id="main-content-panel">
            <!-- Empty state default -->
            <div class="empty-state" id="empty-state">
                <i class="fa-solid fa-calendar-week"></i>
                <h3>Nenhum período selecionado</h3>
                <p>Adicione um ano e ative os meses desejados no painel lateral para começar.</p>
            </div>
            
            <!-- Dynamic Month Blocks Container -->
            <div id="agenda-blocks-container" style="display: contents;"></div>
        </div>

    </div>

    <!-- Modal for Note Editing in Grid Mode -->
    <div class="modal-overlay" id="note-modal">
        <div class="modal">
            <span class="modal-close" id="modal-close">&times;</span>
            <div class="modal-title" id="modal-date-title">Data</div>
            <div class="modal-subtitle" id="modal-weekday-subtitle">Dia da semana</div>
            <textarea class="modal-textarea" id="modal-note-input" placeholder="Escreva os seus compromissos, lembretes ou notas para este dia..."></textarea>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-cancel-btn">Cancelar</button>
                <button class="btn-primary" id="modal-save-btn" style="width: auto; padding: 0.6rem 1.5rem;">Guardar Nota</button>
            </div>
        </div>
    </div>

    <script>
        // State variables
        let agendaState = {
            years: [], // format: { id: Date.now(), year: 2026, activeMonths: [0, 1, 2...] }
            viewMode: 'grid' // 'grid' or 'list'
        };

        const MONTH_NAMES = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        const WEEKDAYS_SHORT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        const WEEKDAYS_LONG = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

        // DOM elements
        const btnAddYear = document.getElementById('btn-add-year');
        const yearsListContainer = document.getElementById('years-list-container');
        const agendaBlocksContainer = document.getElementById('agenda-blocks-container');
        const emptyState = document.getElementById('empty-state');
        const viewModeBtns = document.querySelectorAll('.view-mode-btn');

        // Modal elements
        const noteModal = document.getElementById('note-modal');
        const modalClose = document.getElementById('modal-close');
        const modalDateTitle = document.getElementById('modal-date-title');
        const modalWeekdaySubtitle = document.getElementById('modal-weekday-subtitle');
        const modalNoteInput = document.getElementById('modal-note-input');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');
        const modalSaveBtn = document.getElementById('modal-save-btn');
        
        let currentEditingDay = null; // format: { year, month, day }

        // Local Storage Utilities
        function getStorageKey(year, month, day) {
            return `agenda_note_${year}_${month}_${day}`;
        }

        function getNote(year, month, day) {
            return localStorage.getItem(getStorageKey(year, month, day)) || '';
        }

        function saveNote(year, month, day, text) {
            if (text.trim() === '') {
                localStorage.removeItem(getStorageKey(year, month, day));
            } else {
                localStorage.setItem(getStorageKey(year, month, day), text);
            }
        }

        // Initialize state from LocalStorage if possible
        function loadState() {
            const saved = localStorage.getItem('agenda_app_state');
            if (saved) {
                try {
                    agendaState = JSON.parse(saved);
                } catch (e) {
                    console.error("Erro ao carregar o estado", e);
                }
            }
            if (agendaState.years.length === 0) {
                // Add current year by default
                addYear(new Date().getFullYear());
            } else {
                renderAll();
            }
        }

        function persistState() {
            localStorage.setItem('agenda_app_state', JSON.stringify(agendaState));
        }

        // Add a new year segment
        function addYear(yearValue) {
            const yearNum = parseInt(yearValue) || new Date().getFullYear();
            
            // Check if year already exists in config to prevent duplicate selections, 
            // though we allow multiple if they want, but let's make it distinct by default
            const newYearConfig = {
                id: Date.now() + Math.random().toString(36).substr(2, 5),
                year: yearNum,
                activeMonths: [new Date().getMonth()] // default active is current month
            };

            agendaState.years.push(newYearConfig);
            persistState();
            renderAll();
        }

        // Remove a year segment
        function removeYear(id) {
            agendaState.years = agendaState.years.filter(y => y.id !== id);
            persistState();
            renderAll();
        }

        // Render configuration panel & active calendars
        function renderAll() {
            renderConfigPanel();
            renderAgendaView();
        }

        // Render controls in the sidebar
        function renderConfigPanel() {
            yearsListContainer.innerHTML = '';
            
            agendaState.years.forEach(yearItem => {
                const card = document.createElement('div');
                card.className = 'year-card';
                
                // Get month label text for the button
                let btnLabel = "Selecionar Meses";
                if (yearItem.activeMonths.length > 0) {
                    btnLabel = yearItem.activeMonths.map(idx => MONTH_NAMES[idx].substring(0, 3)).join(', ');
                }
                
                card.innerHTML = `
                    <div class="year-card-header">
                        <div class="year-select-wrapper">
                            <select class="year-select" data-id="${yearItem.id}">
                                ${getYearOptions(yearItem.year)}
                            </select>
                        </div>
                        <button class="btn-remove-year" data-id="${yearItem.id}" title="Remover Ano">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                    <div class="month-dropdown-container">
                        <button class="month-dropdown-btn" data-id="${yearItem.id}">
                            <span>${btnLabel}</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="month-dropdown-content" id="dropdown-${yearItem.id}">
                            ${MONTH_NAMES.map((name, index) => {
                                const isActive = yearItem.activeMonths.includes(index);
                                return `
                                    <div class="month-option ${isActive ? 'active' : ''}" 
                                         data-year-id="${yearItem.id}" 
                                         data-month-index="${index}">
                                        <input type="checkbox" ${isActive ? 'checked' : ''} onclick="event.stopPropagation();">
                                        <span>${name}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;

                // Add event listeners inside the card
                const yearSelect = card.querySelector('.year-select');
                yearSelect.addEventListener('change', (e) => {
                    yearItem.year = parseInt(e.target.value);
                    persistState();
                    renderAgendaView();
                });

                const removeBtn = card.querySelector('.btn-remove-year');
                removeBtn.addEventListener('click', () => removeYear(yearItem.id));

                // Toggle dropdown menu
                const dropdownBtn = card.querySelector('.month-dropdown-btn');
                const dropdownContent = card.querySelector('.month-dropdown-content');
                dropdownBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Close other dropdowns first
                    document.querySelectorAll('.month-dropdown-content').forEach(el => {
                        if (el !== dropdownContent) el.classList.remove('show');
                    });
                    dropdownContent.classList.toggle('show');
                });

                // Month options click inside dropdown
                const monthOptions = card.querySelectorAll('.month-option');
                monthOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const checkbox = option.querySelector('input[type="checkbox"]');
                        const monthIdx = parseInt(option.getAttribute('data-month-index'));
                        
                        let active = yearItem.activeMonths.includes(monthIdx);
                        if (active) {
                            yearItem.activeMonths = yearItem.activeMonths.filter(m => m !== monthIdx);
                            option.classList.remove('active');
                            checkbox.checked = false;
                        } else {
                            yearItem.activeMonths.push(monthIdx);
                            yearItem.activeMonths.sort((a, b) => a - b);
                            option.classList.add('active');
                            checkbox.checked = true;
                        }
                        
                        // Update button label
                        let newLabel = "Selecionar Meses";
                        if (yearItem.activeMonths.length > 0) {
                            newLabel = yearItem.activeMonths.map(idx => MONTH_NAMES[idx].substring(0, 3)).join(', ');
                        }
                        dropdownBtn.querySelector('span').innerText = newLabel;
                        
                        persistState();
                        renderAgendaView();
                    });

                    // Direct checkbox click interaction
                    const checkbox = option.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        option.click(); // trigger option click logic
                    });
                });

                yearsListContainer.appendChild(card);
            });
        }

        // Close dropdowns on document click
        document.addEventListener('click', () => {
            document.querySelectorAll('.month-dropdown-content').forEach(el => {
                el.classList.remove('show');
            });
        });

        // Generate options for the year selector
        function getYearOptions(selectedYear) {
            let options = '';
            const currentYear = new Date().getFullYear();
            for (let y = currentYear - 5; y <= currentYear + 10; y++) {
                options += `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`;
            }
            return options;
        }

        // Helper to get number of days in a month
        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        // Helper to get weekday index of the first day (0 = Sunday, 1 = Monday, etc.)
        function getFirstWeekdayOfMonth(year, month) {
            return new Date(year, month, 1).getDay();
        }

        // Render the main calendar displays
        function renderAgendaView() {
            agendaBlocksContainer.innerHTML = '';
            
            // Check if we have any active year and month selection
            const hasSelections = agendaState.years.some(y => y.activeMonths.length > 0);
            
            if (!hasSelections) {
                emptyState.style.display = 'flex';
                return;
            }
            
            emptyState.style.display = 'none';

            // Loop through each year and active month to render
            agendaState.years.forEach(yearItem => {
                yearItem.activeMonths.forEach(monthIndex => {
                    const block = createMonthBlock(yearItem.year, monthIndex);
                    agendaBlocksContainer.appendChild(block);
                });
            });
        }

        // Create HTML card for a specific month
        function createMonthBlock(year, monthIndex) {
            const block = document.createElement('div');
            block.className = 'month-block';
            
            const monthName = MONTH_NAMES[monthIndex];
            
            block.innerHTML = `
                <div class="month-block-header">
                    <h2 class="month-block-title">
                        ${monthName} <span class="year-badge">${year}</span>
                    </h2>
                </div>
                <div class="month-block-body"></div>
            `;
            
            const bodyContainer = block.querySelector('.month-block-body');
            const totalDays = getDaysInMonth(year, monthIndex);
            
            if (agendaState.viewMode === 'grid') {
                // Calendar Grid mode
                const grid = document.createElement('div');
                grid.className = 'calendar-grid';
                
                // Add weekday headers
                WEEKDAYS_SHORT.forEach(day => {
                    const header = document.createElement('div');
                    header.className = 'weekday-header';
                    header.innerText = day;
                    grid.appendChild(header);
                });
                
                // Add empty spaces for padding
                const firstDayOffset = getFirstWeekdayOfMonth(year, monthIndex);
                for (let i = 0; i < firstDayOffset; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'grid-day empty';
                    grid.appendChild(emptyCell);
                }
                
                // Add the actual days
                for (let day = 1; day <= totalDays; day++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'grid-day';
                    
                    const noteText = getNote(year, monthIndex, day);
                    if (noteText) {
                        dayCell.classList.add('has-notes');
                    }
                    
                    dayCell.innerHTML = `
                        <span class="day-number">${day}</span>
                        <div class="day-indicator"></div>
                    `;
                    
                    // Open Modal on click
                    dayCell.addEventListener('click', () => openNoteModal(year, monthIndex, day));
                    
                    grid.appendChild(dayCell);
                }
                
                bodyContainer.appendChild(grid);
            } else {
                // List mode (each day with input next to it)
                const list = document.createElement('div');
                list.className = 'calendar-list';
                
                for (let day = 1; day <= totalDays; day++) {
                    const weekdayIndex = new Date(year, monthIndex, day).getDay();
                    const weekdayName = WEEKDAYS_LONG[weekdayIndex];
                    const noteVal = getNote(year, monthIndex, day);
                    
                    const row = document.createElement('div');
                    row.className = 'list-day-row';
                    row.innerHTML = `
                        <div class="list-day-info">
                            <span class="list-day-label">${day} de ${MONTH_NAMES[monthIndex].substring(0, 3)}</span>
                            <span class="list-day-weekday">${weekdayName}</span>
                        </div>
                        <div class="list-day-note-wrapper">
                            <input type="text" class="list-day-input" 
                                   placeholder="Adicionar tarefa ou anotação..." 
                                   value="${escapeHtml(noteVal)}"
                                   data-year="${year}" 
                                   data-month="${monthIndex}" 
                                   data-day="${day}">
                            <i class="fa-solid fa-circle-check save-indicator"></i>
                        </div>
                    `;
                    
                    // Simple auto-saving on typing
                    const input = row.querySelector('.list-day-input');
                    const indicator = row.querySelector('.save-indicator');
                    let timeout = null;
                    
                    input.addEventListener('input', (e) => {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => {
                            saveNote(year, monthIndex, day, e.target.value);
                            
                            // Show save animation indicator
                            indicator.classList.add('active');
                            setTimeout(() => {
                                indicator.classList.remove('active');
                            }, 1200);
                        }, 500);
                    });
                    
                    list.appendChild(row);
                }
                
                bodyContainer.appendChild(list);
            }
            
            return block;
        }

        // Helper to escape HTML tags
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Open Modal view for editing in Grid
        function openNoteModal(year, month, day) {
            currentEditingDay = { year, month, day };
            const weekdayIndex = new Date(year, month, day).getDay();
            
            modalDateTitle.innerText = `${day} de ${MONTH_NAMES[month]} de ${year}`;
            modalWeekdaySubtitle.innerText = WEEKDAYS_LONG[weekdayIndex];
            modalNoteInput.value = getNote(year, month, day);
            
            noteModal.style.display = 'flex';
            modalNoteInput.focus();
        }

        // Close Modal
        function closeModal() {
            noteModal.style.display = 'none';
            currentEditingDay = null;
        }

        // Save Modal Note
        function saveModalNote() {
            if (currentEditingDay) {
                const { year, month, day } = currentEditingDay;
                saveNote(year, month, day, modalNoteInput.value);
                closeModal();
                renderAgendaView();
            }
        }

        // Event Listeners
        btnAddYear.addEventListener('click', () => {
            // Get last configured year, or current year + 1
            let nextYear = new Date().getFullYear();
            if (agendaState.years.length > 0) {
                const maxYear = Math.max(...agendaState.years.map(y => y.year));
                nextYear = maxYear + 1;
            }
            addYear(nextYear);
        });

        // View mode buttons toggling
        viewModeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                viewModeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                agendaState.viewMode = btn.getAttribute('data-mode');
                persistState();
                renderAgendaView();
            });
        });

        // Modal dismiss listeners
        modalClose.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modalSaveBtn.addEventListener('click', saveModalNote);
        noteModal.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        // Keyboard navigation in modal
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && noteModal.style.display === 'flex') {
                closeModal();
            }
        });

        // Initialize App
        loadState();
    </script>
</body>
</html>
