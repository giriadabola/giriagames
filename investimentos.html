<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimentos - Ggames</title>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="investimentos/investimentos.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner-wrapper">
            <div class="loading-spinner"></div>
            <i class="fas fa-futbol loading-icon"></i>
        </div>
        <p id="loading-text">Inicializando e verificando acesso...</p>
    </div>

    <main class="content">
        <!-- Cabeçalho com Carrossel Ticker de Mercado no Topo e Badges -->
        <div class="header-section" style="padding: 10px 0 20px 0; margin-bottom: 20px;">
            <!-- CARROSSEL / TICKER MERCADO DE INVESTIMENTOS NO TOPO -->
            <div class="ticker-section" style="margin-bottom: 16px;">
                <div class="ticker-top-bar">
                    <div class="ticker-title">
                        <i class="fas fa-chart-line" style="color: #38bdf8;"></i> Mercado de Cotações de Equipas
                    </div>
                    <div style="font-size: 11px; color: #64748b; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                        <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: inline-block;"></span> Mercado Ativo
                    </div>
                </div>
                <div class="ticker-wrapper">
                    <div id="ticker-track" class="ticker-track">
                        <div style="color: #64748b; font-size: 11px; padding: 6px;">A carregar cotações aleatórias do mercado...</div>
                    </div>
                </div>
            </div>

            <div class="header-badges-container">
                <div id="user-arena-badge" class="arena-badge-container" style="display: none;">
                    <i class="fas fa-chess-rook"></i> <span id="arena-name-display">Carregando Arena...</span>
                </div>
                <div id="user-limit-badge" class="arena-badge-container" style="display: none; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8;">
                    <i class="fas fa-layer-group"></i> <span id="limit-count-display">Investimentos: 0/5</span>
                </div>
                <div id="user-earnings-badge" class="arena-badge-container" style="display: none;">
                    <i class="fas fa-minus"></i> <span id="user-earnings-display">Rendimento: 0 ɱ-₲₵</span>
                </div>
            </div>
        </div>

        <!-- Navegação por Abas Principais -->
        <div style="display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; flex-wrap: wrap;">
            <button class="main-tab-btn active" data-target="section-my-investments" style="padding: 10px 18px; border-radius: 12px; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); color: #60a5fa; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.25s ease;">
                <i class="fas fa-star" style="color: #f59e0b;"></i> Minha Carteira
            </button>
            <button class="main-tab-btn" data-target="section-available-teams" style="padding: 10px 18px; border-radius: 12px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.06); color: #94a3b8; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.25s ease;">
                <i class="fas fa-plus-square" style="color: #38bdf8;"></i> Ativos Disponíveis
            </button>
        </div>

        <!-- Conteúdo da Aba 1: Meus Investimentos Ativos -->
        <div id="section-my-investments" class="main-tab-content" style="display: block; margin-bottom: 40px;">
            <div class="investments-grid" id="investments-grid">
                <!-- Cards ativos do utilizador serão populados dinamicamente -->
            </div>
            <div id="my-investments-pagination" class="pagination-bar" style="display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px; flex-wrap: wrap;"></div>
        </div>

        <!-- Conteúdo da Aba 2: Equipas Disponíveis nesta Arena -->
        <div id="section-available-teams" class="main-tab-content" style="display: none; margin-bottom: 40px;">
            <!-- Barra de Pick-cards de Países -->
            <div id="country-filter-container" style="display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 14px 2px; margin-bottom: 16px; scrollbar-width: thin;"></div>

            <div class="investments-grid" id="available-teams-grid">
                <!-- Cards de equipas disponíveis serão populados dinamicamente -->
            </div>
            <div id="available-teams-pagination" class="pagination-bar" style="display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px; flex-wrap: wrap;"></div>
        </div>
    </main>

    <!-- Modal Popup de Detalhes da Equipa ("Ativo") -->
    <div id="team-detail-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 3000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; padding: 24px;">
            <button id="modal-close-btn" style="position: absolute; top: 16px; right: 16px; background: rgba(255, 255, 255, 0.06); border: none; color: #94a3b8; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.2s;">
                <i class="fas fa-times"></i>
            </button>
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
                <img id="modal-club-img" src="" alt="" style="width: 56px; height: 56px; object-fit: contain; background: white; border-radius: 50%; padding: 4px; border: 2px solid rgba(255, 255, 255, 0.1);">
                <div>
                    <h2 id="modal-club-name" style="font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 4px;"></h2>
                    <div id="modal-club-meta" style="font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 10px;"></div>
                </div>
            </div>
            
            <!-- Conteúdo "Ativo" (Últimos 5 Jogos) -->
            <div style="font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
                <i class="fas fa-history" style="color: #38bdf8;"></i> Últimos 5 Jogos (Ativo)
            </div>
            <div id="modal-matches-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
                <div style="color: #64748b; font-size: 12px; text-align: center; padding: 12px; background: rgba(15, 23, 42, 0.4); border-radius: 8px;">
                    A carregar jogos...
                </div>
            </div>

            <div id="modal-action-container" style="border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 16px;">
                <!-- O botão + apenas é injetado se a arena for válida (não nula) e <= arena do utilizador -->
            </div>
        </div>
    </div>

    <!-- Componentes e Módulos JavaScript -->
    <script src="config.js"></script>
    <script type="module" src="investimentos/js/investimentos-main.js"></script>
    <script src="core/menu-component.js"></script>
    <script src="core/top-bar-component.js" type="module"></script>
</body>
</html>
