<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimentos - Ggames</title>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(76, 29, 149, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            padding-bottom: 90px;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
            gap: 20px;
        }

        .loading-spinner-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1s linear infinite;
        }

        .loading-icon {
            position: absolute;
            font-size: 24px;
            color: #60a5fa;
            animation: bounce 1s infinite alternate;
        }

        #loading-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-align: center;
            max-width: 300px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeIn 0.8s ease;
        }

        .header-section h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header-section p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .arena-badge-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 16px;
            font-weight: 600;
            color: #60a5fa;
        }

        .investments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        /* Card de Investimento */
        .investment-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .investment-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }

        /* Gradientes curados para cada card */
        .card-grad-0 { background: linear-gradient(135deg, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #6366f1; }
        .card-grad-1 { background: linear-gradient(135deg, rgba(6, 78, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #10b981; }
        .card-grad-2 { background: linear-gradient(135deg, rgba(120, 53, 4, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #f59e0b; }
        .card-grad-3 { background: linear-gradient(135deg, rgba(131, 24, 67, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #ec4899; }
        .card-grad-4 { background: linear-gradient(135deg, rgba(88, 28, 135, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #8b5cf6; }
        .card-grad-5 { background: linear-gradient(135deg, rgba(30, 58, 138, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #3b82f6; }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            margin-bottom: 20px;
        }

        .club-emblem {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .club-title-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .club-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .club-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sparkline & Trend Section */
        .trend-section {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .trend-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .trend-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trend-status {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trend-status.up { color: #10b981; }
        .trend-status.down { color: #ef4444; }

        .trend-sparkline {
            width: 100px;
            height: 36px;
        }

        /* Recent Games List */
        .recent-games-container {
            width: 100%;
        }

        .recent-games-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: block;
        }

        .games-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .game-teams {
            font-weight: 500;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-date {
            color: var(--text-muted);
            font-size: 11px;
        }

        .game-score-badge {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .game-score-badge.win { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .game-score-badge.draw { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .game-score-badge.loss { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .active-badge {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            align-self: flex-start;
            margin-top: auto;
        }

        .no-investments {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-investments i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .no-investments p {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* Ticker do Mercado de Investimentos (Estilo Bolsa) */
        .ticker-section {
            margin-bottom: 24px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 16px;
            backdrop-filter: blur(12px);
            overflow: hidden;
            position: relative;
        }

        .ticker-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ticker-title {
            font-size: 12px;
            font-weight: 700;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ticker-wrapper {
            width: 100%;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
        }

        .ticker-track {
            display: flex;
            gap: 12px;
            width: max-content;
            animation: tickerScroll 45s linear infinite;
        }

        .ticker-track:hover {
            animation-play-state: paused;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-card {
            flex: 0 0 210px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
            user-select: none;
        }

        .ticker-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .ticker-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 24px;
        }

        .ticker-club-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px;
        }

        .ticker-club-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ticker-club-name {
            font-size: 11px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ticker-club-arena {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 500;
        }

        .ticker-add-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #2176ff;
            border: none;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(33, 118, 255, 0.4);
            transition: transform 0.2s;
            z-index: 5;
        }

        .ticker-add-btn:hover {
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner-wrapper">
            <div class="loading-spinner"></div>
            <i class="fas fa-futbol loading-icon"></i>
        </div>
        <p id="loading-text">Inicializando e verificando acesso...</p>
    </div>

    <main class="content">
        <!-- Cabeçalho Limpo com Badges e Carrossel Ticker de Mercado -->
        <div class="header-section" style="padding: 10px 0 20px 0; margin-bottom: 20px;">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="user-arena-badge" class="arena-badge-container" style="display: none;">
                        <i class="fas fa-chess-rook"></i> <span id="arena-name-display">Carregando Arena...</span>
                    </div>
                    <div id="user-limit-badge" class="arena-badge-container" style="display: none; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8;">
                        <i class="fas fa-layer-group"></i> <span id="limit-count-display">Investimentos: 0/5</span>
                    </div>
                </div>
            </div>

            <!-- CARROSSEL / TICKER MERCADO DE INVESTIMENTOS -->
            <div class="ticker-section">
                <div class="ticker-top-bar">
                    <div class="ticker-title">
                        <i class="fas fa-chart-line" style="color: #38bdf8;"></i> Mercado de Cotações de Equipas
                    </div>
                    <div style="font-size: 11px; color: #64748b; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                        <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: inline-block;"></span> Mercado Ativo
                    </div>
                </div>
                <div class="ticker-wrapper">
                    <div id="ticker-track" class="ticker-track">
                        <div style="color: #64748b; font-size: 11px; padding: 6px;">A carregar cotações aleatórias do mercado...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Secção 1: Meus Investimentos Ativos -->
        <div style="margin-bottom: 40px;">
            <h2 style="font-size: 18px; color: #f8fafc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-star" style="color: #f59e0b;"></i> Meus Investimentos Ativos
            </h2>
            <div class="investments-grid" id="investments-grid">
                <!-- Cards ativos do utilizador serão populados dinamicamente -->
            </div>
        </div>

        <!-- Secção 2: Equipas Disponíveis nesta Arena para Adicionar -->
        <div style="margin-bottom: 40px;">
            <h2 style="font-size: 18px; color: #f8fafc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-plus-square" style="color: #38bdf8;"></i> Equipas Disponíveis nesta Arena
            </h2>
            <div class="investments-grid" id="available-teams-grid">
                <!-- Cards de equipas disponíveis serão populados dinamicamente -->
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, collection, getDocs, setDoc, deleteDoc, query, where, addDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';
        import { getLatestSeason, mergeUserSeasonData } from './core/user-season.js';
        import { checkPageContentAccess } from './js/page-content-guard.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        function logUserAction(actionDescription) {
            if (!auth.currentUser) return;
            try {
                const eyeCollection = collection(db, 'eye');
                void addDoc(eyeCollection, {
                    dataacao: serverTimestamp(),
                    acao: actionDescription,
                    userId: auth.currentUser.uid
                }).catch((error) => console.error("Erro ao registar a ação na coleção 'eye':", error));
            } catch (error) {
                console.error("Erro ao registar ação na coleção 'eye':", error);
            }
        }

        window.logDebug = function(msg) {
            console.log(msg);
        };

        // Nomes de equipas para simulação realista
        const OPONENTE_POOL = [
            "Real Madrid", "Barcelona", "Bayern Munique", "Manchester City", 
            "Liverpool", "Paris SG", "Inter Milão", "Juventus", "Sporting CP", 
            "Benfica", "FC Porto", "Arsenal", "Atlético Madrid", "Dortmund"
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // 1. Obter dados do utilizador
                    const userDocSnap = await getDoc(doc(db, 'users', user.uid));
                    if (!userDocSnap.exists()) {
                        window.location.replace('index.html');
                        return;
                    }
                    
                    const seasonLabel = await getLatestSeason(db);
                    const userData = mergeUserSeasonData(userDocSnap.data(), seasonLabel);

                    const hasContentAccess = await checkPageContentAccess('investimentos', userData.estatuto, db);
                    if (!hasContentAccess) {
                        const loadingScreen = document.getElementById('loading-screen');
                        if (loadingScreen) loadingScreen.style.display = 'none';
                        return;
                    }
                    
                    await logUserAction(`Entrou em ${document.title}`);
                    
                    // Aplicar regras de visibilidade do menu inferior com base nas definições do Firestore
                    const paineisMenuDoc = await getDoc(doc(db, 'paineis', 'paineis menu'));
                    if (paineisMenuDoc.exists()) {
                        const menuData = paineisMenuDoc.data();
                        const applyMenu = () => {
                            if (typeof window.updateMenuVisibility === 'function') {
                                window.updateMenuVisibility(menuData);
                            } else {
                                setTimeout(applyMenu, 50);
                            }
                        };
                        applyMenu();
                    }
                    
                    // 2. Determinar Arena do utilizador (tanto pela propriedade 'arena' quanto pela 'fame')
                    const userArenaField = userData.arena || '';
                    let userArenaNum = parseInt(userArenaField.replace(/\D/g, '')) || 0;
                    let userArenaName = userArenaField || 'Arena 1';
                    
                    // Backup: Calcular a arena a partir do valor de Fama, se necessário
                    const arenaDocSnap = await getDoc(doc(db, 'paineis', 'paineis arena'));
                    if (arenaDocSnap.exists()) {
                        const arenaData = arenaDocSnap.data();
                        const arenas = Object.keys(arenaData).map(key => ({
                            name: key, fama: arenaData[key].fama
                        })).sort((a, b) => a.fama - b.fama);
                        
                        const userFame = userData.fame || 0;
                        let currentUserArena = arenas[0];
                        for (let i = arenas.length - 1; i >= 0; i--) {
                            if (userFame >= arenas[i].fama) {
                                currentUserArena = arenas[i];
                                break;
                            }
                        }
                        
                        const calculatedArenaNum = parseInt(currentUserArena.name.replace(/\D/g, '')) || 1;
                        if (calculatedArenaNum > userArenaNum) {
                            userArenaNum = calculatedArenaNum;
                            userArenaName = currentUserArena.name;
                        }
                    }

                    // Garantir nome de arena por defeito se não estiver definido
                    if (!userArenaName) {
                        userArenaName = 'Arena 4';
                    }

                    // Mostrar o badge da arena do utilizador
                    const arenaDisplay = document.getElementById('arena-name-display');
                    if (arenaDisplay) arenaDisplay.textContent = userArenaName;
                    const arenaBadge = document.getElementById('user-arena-badge');
                    if (arenaBadge) arenaBadge.style.display = 'inline-flex';

                    // 4. Iniciar processamento e análise dos últimos 5 jogos das equipas
                    const loadingText = document.getElementById('loading-text');
                    if (loadingText) loadingText.textContent = "A analisar a forma recente e estatísticas das equipas...";
                    await loadAndSyncInvestments(userArenaName, userArenaNum, user.uid);

                } catch (err) {
                    console.error("Erro ao validar acesso do utilizador:", err);
                    const grid = document.getElementById('investments-grid');
                    if (grid) {
                        grid.innerHTML = `
                            <div class="no-investments" style="border: 1px solid rgba(239, 68, 68, 0.2);">
                                <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                                <p>Erro ao carregar dados: ${err.message || 'Falha na autenticação'}</p>
                            </div>
                        `;
                    }
                    hideLoading();
                }
            } else {
                window.location.replace('index.html');
            }
        });

        // Carrega os investimentos do utilizador e as equipas disponíveis na arena
        async function loadAndSyncInvestments(userArenaName, userArenaNum, userId) {
            const grid = document.getElementById('investments-grid');
            const availableGrid = document.getElementById('available-teams-grid');
            grid.innerHTML = '';
            availableGrid.innerHTML = '';
            
            try {
                // 1. Obter o limite por pessoa a partir de firebase -> settings -> investimentos -> porpessoa
                let limitPorPessoa = 5;
                try {
                    const settingsSnap = await getDoc(doc(db, 'settings', 'investimentos'));
                    if (settingsSnap.exists() && settingsSnap.data().porpessoa !== undefined) {
                        limitPorPessoa = parseInt(settingsSnap.data().porpessoa) || 5;
                    }
                } catch (se) {
                    console.warn("Erro ao obter definições de investimentos:", se);
                }

                // 2. Obter os investimentos atuais do utilizador (array de objetos/IDs na coleção 'users')
                let userChosenIds = [];
                let userInvestmentMap = {}; // clubeId -> timestamp

        // Procura HTML do FootyStats via proxies com deteção de Cloudflare e retry
        async function fetchFootyStatsHtmlWithCloudflareCheck(footystatsId, maxAttempts = 3) {
            const embedUrl = 'https://footystats.org/api/club?id=' + footystatsId;
            const proxies = [
                'https://corsproxy.io/?' + encodeURIComponent(embedUrl),
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(embedUrl),
                'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(embedUrl)
            ];

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                for (let i = 0; i < proxies.length; i++) {
                    try {
                        const resp = await fetch(proxies[i]);
                        if (resp.ok) {
                            const text = await resp.text();
                            if (text && text.indexOf('id="matches"') !== -1) {
                                return text;
                            }
                            if (isCloudflareResponse(text)) {
                                console.warn(`[Cloudflare] Deteção de verificação de segurança no proxy ${proxies[i]}`);
                                setCloudflareLoadingState();
                            }
                        }
                    } catch(e) {}
                }
                if (attempt < maxAttempts - 1) {
                    await new Promise(res => setTimeout(res, 2000));
                }
            }
            return '';
        }

        // Renderiza os badges W, D, L e o gráfico financeiro sparkline dinâmico
        function renderFinancialWidgetForClub(matches, index, isAvailable = true) {
            const formContainer = document.getElementById(isAvailable ? `avail-form-${index}` : `my-form-${index}`);
            const chartContainer = document.getElementById(isAvailable ? `avail-chart-container-${index}` : `my-chart-container-${index}`);
            const trendValEl = document.getElementById(isAvailable ? `avail-trend-val-${index}` : `my-trend-val-${index}`);

            if (!matches || matches.length === 0) return;

            // 1. Badges de Forma W, D, L
            if (formContainer) {
                let formHtml = '';
                matches.slice(0, 5).forEach(m => {
                    const char = (m.resultBadge || 'd').toUpperCase();
                    let bg = 'rgba(245, 158, 11, 0.2)';
                    let border = 'rgba(245, 158, 11, 0.4)';
                    let color = '#f59e0b';

                    if (char === 'W') {
                        bg = 'rgba(16, 185, 129, 0.2)';
                        border = 'rgba(16, 185, 129, 0.4)';
                        color = '#10b981';
                    } else if (char === 'L') {
                        bg = 'rgba(239, 68, 68, 0.2)';
                        border = 'rgba(239, 68, 68, 0.4)';
                        color = '#ef4444';
                    }

                    formHtml += `<span style="width: 22px; height: 22px; border-radius: 4px; background: ${bg}; border: 1px solid ${border}; color: ${color}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;">${char}</span>`;
                });
                formContainer.innerHTML = formHtml;
            }

            // 2. Cálculo do Rendimento e Gráfico Sparkline
            let totalPoints = 0;
            const yPoints = [34];
            let currentY = 34;

            matches.slice(0, 5).reverse().forEach((m) => {
                const char = (m.resultBadge || 'd').toUpperCase();
                if (char === 'W') {
                    totalPoints += 3;
                    currentY -= 6;
                } else if (char === 'D') {
                    totalPoints += 1;
                    currentY -= 1;
                } else {
                    currentY += 5;
                }
                currentY = Math.max(6, Math.min(38, currentY));
                yPoints.push(currentY);
            });

            const percentVal = (totalPoints / 15 * 25 + 3.5).toFixed(1);
            const isPositive = totalPoints >= 5;

            if (trendValEl) {
                trendValEl.textContent = `${isPositive ? '+' : ''}${percentVal}%`;
                trendValEl.style.color = isPositive ? '#10b981' : '#ef4444';
                trendValEl.style.background = isPositive ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)';
                trendValEl.style.borderColor = isPositive ? 'rgba(16, 185, 129, 0.3)' : 'rgba(239, 68, 68, 0.3)';
            }

            if (chartContainer) {
                const strokeColor = isPositive ? '#10b981' : '#ef4444';
                const gradId = `chartGrad-${isAvailable ? 'avail' : 'my'}-${index}`;
                
                const xStep = 200 / (yPoints.length - 1);
                let pathD = `M 0 ${yPoints[0]}`;
                for (let i = 1; i < yPoints.length; i++) {
                    pathD += ` L ${Math.round(i * xStep)} ${yPoints[i]}`;
                }

                const areaD = `${pathD} L 200 45 L 0 45 Z`;
                const lastX = 200;
                const lastY = yPoints[yPoints.length - 1];

                chartContainer.innerHTML = `
                    <svg viewBox="0 0 200 45" style="width: 100%; height: 42px; overflow: visible;">
                        <defs>
                            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.35"/>
                                <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/>
                            </linearGradient>
                        </defs>
                        <path d="${areaD}" fill="url(#${gradId})"/>
                        <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${strokeColor}" stroke="#0f172a" stroke-width="2"/>
                    </svg>
                `;
            }
        }

        // Converte a string de data do FootyStats para timestamp numérico
        function parseMatchDateStringToTimestamp(dateStr) {
            if (!dateStr) return Date.now();
            try {
                let clean = dateStr.replace(/^[A-Za-z]+,\s*/, '');
                clean = clean.replace(/(\d+)(st|nd|rd|th)/i, '$1');
                const parsedDate = new Date(clean);
                if (!isNaN(parsedDate.getTime())) {
                    if (!/\d{4}/.test(clean)) {
                        parsedDate.setFullYear(new Date().getFullYear());
                    }
                    return parsedDate.getTime();
                }
            } catch(e) {}
            return Date.now();
        }

        // Sincroniza e grava jogos na coleção 'investimentos' do Firestore
        async function syncMatchesToFirestoreInvestmentHistory(userId, clubeId, docId, matches, investmentTimestamp) {
            if (!userId || !clubeId || !matches || matches.length === 0) return;

            try {
                const targetDocId = docId || `${userId}_${clubeId}`;
                const invDocRef = doc(db, 'investimentos', targetDocId);
                const invSnap = await getDoc(invDocRef);

                let existingHistorico = [];
                let baseTimestamp = investmentTimestamp || 0;

                if (invSnap.exists()) {
                    const data = invSnap.data();
                    existingHistorico = data.historico || [];
                    if (!baseTimestamp && data.timestamp) {
                        baseTimestamp = data.timestamp;
                    }
                } else {
                    await setDoc(invDocRef, {
                        id: targetDocId,
                        userId: userId,
                        clubeId: clubeId,
                        timestamp: baseTimestamp || Date.now(),
                        dataInvestimento: baseTimestamp || Date.now(),
                        status: 'on',
                        historico: []
                    }, { merge: true });
                }

                const newEntries = [];

                matches.forEach(m => {
                    const matchTimestamp = parseMatchDateStringToTimestamp(m.date);

                    // Regra 1: Apenas jogos ocorridos após o timestamp do investimento
                    const isAfterInvestment = baseTimestamp === 0 || matchTimestamp >= (baseTimestamp - (24 * 60 * 60 * 1000));

                    // Regra 2: Apenas jogos cuja data/resultado ainda não estejam gravados no array historico
                    const isAlreadyRecorded = existingHistorico.some(h => {
                        if (h.data && m.date && h.data.trim().toLowerCase() === m.date.trim().toLowerCase()) return true;
                        if (h.rival && m.opponent && h.rival.trim().toLowerCase() === m.opponent.trim().toLowerCase() && h.resultado === m.score) return true;
                        return false;
                    });

                    if (isAfterInvestment && !isAlreadyRecorded) {
                        newEntries.push({
                            data: m.date || new Date().toLocaleDateString('pt-PT'),
                            resultadoBadge: (m.resultBadge || 'd').toUpperCase(),
                            resultado: m.score || '0-0',
                            rival: m.opponent || 'Desconhecido',
                            timestamp: matchTimestamp || Date.now()
                        });
                    }
                });

                if (newEntries.length > 0) {
                    console.log(`A gravar ${newEntries.length} jogo(s) no histórico do documento 'investimentos/${targetDocId}'...`);
                    await updateDoc(invDocRef, {
                        status: 'on',
                        historico: arrayUnion(...newEntries)
                    });
                }
            } catch (err) {
                console.error("Erro ao sincronizar histórico na coleção 'investimentos':", err);
            }
        }

        // Renderiza o carrossel / ticker de cotações aleatórias no cabeçalho

            selectedClubs.forEach(async (clube, idx) => {

                let footystatsId = '';
                if (rawEmbed) {
                    const idMatch = String(rawEmbed).match(/id=(\d+)/i);
                    if (idMatch && idMatch[1]) {
                        footystatsId = idMatch[1];
                    } else if (/^\d+$/.test(String(rawEmbed).trim())) {
                        footystatsId = String(rawEmbed).trim();
                    }
                }
                if (!footystatsId) return;

                const embedUrl = 'https://footystats.org/api/club?id=' + footystatsId;
                let html = '';
                const proxies = [
                    'https://corsproxy.io/?' + encodeURIComponent(embedUrl),
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent(embedUrl),
                    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(embedUrl)
                ];

                for (let p = 0; p < proxies.length; p++) {

                                html = text;

                        let pointsAcc = [0];
                        const lastMatches = matches.slice(0, 5).reverse();
                        lastMatches.forEach(m => {
                            const b = (m.resultBadge || 'd').toLowerCase();
                            if (b === 'w') totalPts += 3;
                            else if (b === 'd') totalPts += 1;
                            pointsAcc.push(totalPts);
                        });

                        const maxPossible = lastMatches.length * 3;
                        const returnPct = maxPossible > 0 ? ((totalPts / maxPossible) * 25).toFixed(1) : '0.0';

                        // Atualizar valor percentual nas cópias do card no ticker
                        trackEl.querySelectorAll(`#ticker-val-${idx}`).forEach(valEl => {
                            valEl.textContent = `+${returnPct}%`;
                        });

                        // Desenhar sparkline SVG nas cópias do card
                        const maxVal = Math.max(...pointsAcc, 1);
                        const minVal = 0;
                        const range = maxVal - minVal;
                        const xStep = 100 / (pointsAcc.length - 1);
                        const yPoints = pointsAcc.map(val => Math.round(18 - ((val - minVal) / range) * 14));
                        let pathD = `M 0 ${yPoints[0]}`;
                        for (let k = 1; k < yPoints.length; k++) {
                            pathD += ` L ${Math.round(k * xStep)} ${yPoints[k]}`;
                        }

                        trackEl.querySelectorAll(`#ticker-chart-${idx}`).forEach(chartEl => {
                            chartEl.innerHTML = `
                                <svg viewBox="0 0 100 20" style="width: 100%; height: 18px; overflow: visible;">
                                    <path d="${pathD}" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            `;
                        });
                    }
                }
            });
        }
        function extractMatchesFromEmbedHtml(html) {
            const matches = [];
            if (!html) return matches;

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const liElements = doc.querySelectorAll('#matches ul.matches li, ul.matches li');

                for (let i = 0; i < liElements.length; i++) {
                    const li = liElements[i];
                    const linkEl = li.querySelector('a');
                    const dateEl = li.querySelector('.date');
                    const resultEl = li.querySelector('.result');
                    if (!linkEl) continue;

                    const matchText = linkEl.textContent.trim();
                    const matchDate = dateEl ? dateEl.textContent.trim() : '';
                    const resultBadge = resultEl ? resultEl.textContent.trim().toLowerCase() : 'd';
                    
                    let score = '';
                    let opponent = matchText;

                    const matchReg = matchText.match(/(\d+-\d+)\s+vs\s+(.+)/i);
                    if (matchReg) {
                        score = matchReg[1].trim();
                        opponent = matchReg[2].trim();
                    }

                    matches.push({
                        date: matchDate,
                        score: score,
                        opponent: opponent,
                        resultBadge: resultBadge // 'w', 'd', 'l'
                    });
                }
            } catch(e) {
                console.error("Erro ao extrair jogos do HTML:", e);
            }
            return matches;
        }

        // Exibe os últimos 5 jogos extraídos diretamente no card de cada equipa
        function displayExtractedMatchesInCard(matches, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!matches || matches.length === 0) {

                return;
            }

            let html = '';
            matches.slice(0, 5).forEach(m => {
                const badgeChar = (m.resultBadge || 'd').toUpperCase(); // W, D, L
                let badgeColor = '#f59e0b'; // D = Yellow
                let badgeBg = 'rgba(245, 158, 11, 0.15)';
                let badgeBorder = 'rgba(245, 158, 11, 0.3)';

                if (badgeChar === 'W') {
                    badgeColor = '#10b981'; // Green
                    badgeBg = 'rgba(16, 185, 129, 0.15)';
                    badgeBorder = 'rgba(16, 185, 129, 0.3)';
                } else if (badgeChar === 'L') {
                    badgeColor = '#ef4444'; // Red
                    badgeBg = 'rgba(239, 68, 68, 0.15)';
                    badgeBorder = 'rgba(239, 68, 68, 0.3)';
                }

                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(15, 23, 42, 0.5); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05);">
                        <div style="display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1; margin-right: 8px;">
                            ${m.date ? `<span style="font-size: 10px; color: #94a3b8;"><i class="far fa-calendar-alt" style="color: #38bdf8; font-size: 10px; margin-right: 3px;"></i>${m.date}</span>` : ''}
                            <div style="display: flex; align-items: center; gap: 6px; color: #f1f5f9; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                ${m.score ? `<span style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 11px; font-weight: 700;">${m.score}</span>` : ''}
                                <span style="overflow: hidden; text-overflow: ellipsis;">${m.opponent}</span>
                            </div>
                        </div>
                        <div style="width: 28px; height: 28px; border-radius: 6px; background: ${badgeBg}; border: 1px solid ${badgeBorder}; color: ${badgeColor}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; font-family: sans-serif; flex-shrink: 0;">
                            ${badgeChar}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function calculateTrend(clubeNome, jogos) {
            let score = 0;
            jogos.forEach(jogo => {
                const status = getResultStatus(clubeNome, jogo);
                if (status === 'V') score += 3;
                else if (status === 'E') score += 1;
            });
            
            return {
                points: score,
                isPositive: score >= 7
            };
        }

        function getResultStatus(clubeNome, jogo) {
            if (jogo.statusBadge) {
                if (jogo.statusBadge === 'w') return 'V';
                if (jogo.statusBadge === 'd') return 'E';
                if (jogo.statusBadge === 'l') return 'D';
            }
            const parts = jogo.resultado ? jogo.resultado.split('-').map(Number) : [0, 0];
            const g1 = parts[0] || 0;
            const g2 = parts[1] || 0;
            const isHome = isSameTeam(jogo.equipa1, clubeNome);
            
            if (g1 === g2) return 'E';
            if (isHome) {
                return g1 > g2 ? 'V' : 'D';
            } else {
                return g2 > g1 ? 'V' : 'D';
            }
        }

        function hideLoading(force = false) {
            const loading = document.getElementById('loading-screen');
            if (!loading) return;

            if (cloudflareDetectedGlobal && !force) {
                const loadingText = document.getElementById('loading-text');
                if (loadingText) {
                    loadingText.innerHTML = '<i class="fas fa-check-circle" style="color: #10b981; margin-right: 6px;"></i> Verificação de segurança concluída! A carregar página...';
                }
                setTimeout(() => {
                    loading.style.opacity = '0';
                    setTimeout(() => { loading.style.display = 'none'; }, 500);
                }, 1200);
            } else {
                loading.style.opacity = '0';
                setTimeout(() => { loading.style.display = 'none'; }, 500);
            }
        }

        // Event listener para limpar a cache de jogos no Firestore
        document.getElementById('btn-clear-cache')?.addEventListener('click', async () => {
            if (confirm("Tens a certeza que queres limpar a cache de jogos no Firestore? Isto irá apagar os jogos locais guardados no Firebase e forçar o novo scraper corrigido a rodar de imediato.")) {
                window.logDebug("A iniciar limpeza de cache de jogos no Firestore...");
                try {
                    const querySnapshot = await getDocs(collection(db, 'clubes'));
                    let count = 0;
                    for (const clubDoc of querySnapshot.docs) {
                        const jogosSnapshot = await getDocs(collection(db, 'clubes', clubDoc.id, 'Jogos'));
                        for (const jogoDoc of jogosSnapshot.docs) {
                            await deleteDoc(doc(db, 'clubes', clubDoc.id, 'Jogos', jogoDoc.id));
                            count++;
                        }
                    }
                    window.logDebug(`Limpeza concluída! ${count} jogos eliminados. A recarregar página para re-scraping...`);
                    setTimeout(() => window.location.reload(), 1500);
                } catch (e) {
                    window.logDebug("Erro ao limpar cache: " + e.message, true);
                }
            }
        });
    </script>
    
    <!-- Componente de Menu do rodapé -->
    <script src="core/menu-component.js"></script>
</body>
