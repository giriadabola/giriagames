<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimentos - Ggames</title>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(76, 29, 149, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            padding-bottom: 90px;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
            gap: 20px;
        }

        .loading-spinner-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1s linear infinite;
        }

        .loading-icon {
            position: absolute;
            font-size: 24px;
            color: #60a5fa;
            animation: bounce 1s infinite alternate;
        }

        #loading-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-align: center;
            max-width: 300px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeIn 0.8s ease;
        }

        .header-section h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header-section p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .arena-badge-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 16px;
            font-weight: 600;
            color: #60a5fa;
        }

        .investments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        /* Card de Investimento */
        .investment-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .investment-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }

        /* Gradientes curados para cada card */
        .card-grad-0 { background: linear-gradient(135deg, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #6366f1; }
        .card-grad-1 { background: linear-gradient(135deg, rgba(6, 78, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #10b981; }
        .card-grad-2 { background: linear-gradient(135deg, rgba(120, 53, 4, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #f59e0b; }
        .card-grad-3 { background: linear-gradient(135deg, rgba(131, 24, 67, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #ec4899; }
        .card-grad-4 { background: linear-gradient(135deg, rgba(88, 28, 135, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #8b5cf6; }
        .card-grad-5 { background: linear-gradient(135deg, rgba(30, 58, 138, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%); border-top: 4px solid #3b82f6; }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            margin-bottom: 20px;
        }

        .club-emblem {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .club-title-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .club-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .club-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sparkline & Trend Section */
        .trend-section {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .trend-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .trend-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trend-status {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trend-status.up { color: #10b981; }
        .trend-status.down { color: #ef4444; }

        .trend-sparkline {
            width: 100px;
            height: 36px;
        }

        /* Recent Games List */
        .recent-games-container {
            width: 100%;
        }

        .recent-games-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: block;
        }

        .games-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .game-teams {
            font-weight: 500;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-date {
            color: var(--text-muted);
            font-size: 11px;
        }

        .game-score-badge {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .game-score-badge.win { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .game-score-badge.draw { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .game-score-badge.loss { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .active-badge {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            align-self: flex-start;
            margin-top: auto;
        }

        .no-investments {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-investments i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .no-investments p {
            font-size: 16px;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner-wrapper">
            <div class="loading-spinner"></div>
            <i class="fas fa-futbol loading-icon"></i>
        </div>
        <p id="loading-text">Inicializando e verificando acesso...</p>
    </div>

    <main class="content">
        <div class="header-section">
            <h1>Investimentos Disponíveis</h1>
            <p>Descobre os clubes onde tens investimentos ativos para impulsionar a tua prestação na arena atual.</p>
            <div id="user-arena-badge" class="arena-badge-container" style="display: none;">
                <i class="fas fa-chess-rook"></i> <span id="arena-name-display">Carregando Arena...</span>
            </div>
        </div>

        <div class="investments-grid" id="investments-grid">
            <!-- Cards will be populated dynamically -->
        </div>

        <div id="debug-console" style="margin-top: 40px; padding: 20px; background: rgba(15, 23, 42, 0.6); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); font-family: monospace; font-size: 13px; color: #34d399; max-height: 400px; overflow-y: auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-bottom: 12px;">
                <h3 style="color: #f8fafc; font-size: 15px; margin: 0;">Consola de Diagnóstico de Scraping</h3>
                <button id="btn-clear-cache" style="padding: 6px 12px; background: #ef4444; border: none; border-radius: 6px; color: white; cursor: pointer; font-family: sans-serif; font-size: 12px; font-weight: bold; transition: background 0.2s;">Limpar Cache de Jogos</button>
            </div>
            <div id="debug-logs-list"></div>
        </div>
    </main>

    <script src="config.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, collection, getDocs, setDoc, deleteDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';
        import { getLatestSeason, mergeUserSeasonData } from './core/user-season.js';
        import { checkPageContentAccess } from './js/page-content-guard.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        window.logDebug = function(msg, isWarning = false) {
            const list = document.getElementById('debug-logs-list');
            if (list) {
                const item = document.createElement('div');
                item.style.marginBottom = '6px';
                item.style.color = isWarning ? '#fca5a5' : '#34d399';
                item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                list.appendChild(item);
                list.scrollTop = list.scrollHeight;
            }
            console.log(msg);
        };

        // Nomes de equipas para simulação realista
        const OPONENTE_POOL = [
            "Real Madrid", "Barcelona", "Bayern Munique", "Manchester City", 
            "Liverpool", "Paris SG", "Inter Milão", "Juventus", "Sporting CP", 
            "Benfica", "FC Porto", "Arsenal", "Atlético Madrid", "Dortmund"
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // 1. Obter dados do utilizador
                    const userDocSnap = await getDoc(doc(db, 'users', user.uid));
                    if (!userDocSnap.exists()) {
                        window.location.replace('index.html');
                        return;
                    }
                    
                    const seasonLabel = await getLatestSeason(db);
                    const userData = mergeUserSeasonData(userDocSnap.data(), seasonLabel);

                    const hasContentAccess = await checkPageContentAccess('investimentos', userData.estatuto, db);
                    if (!hasContentAccess) {
                        const loadingScreen = document.getElementById('loading-screen');
                        if (loadingScreen) loadingScreen.style.display = 'none';
                        return;
                    }
                    
                    // Aplicar regras de visibilidade do menu inferior com base nas definições do Firestore
                    const paineisMenuDoc = await getDoc(doc(db, 'paineis', 'paineis menu'));
                    if (paineisMenuDoc.exists()) {
                        const menuData = paineisMenuDoc.data();
                        const applyMenu = () => {
                            if (typeof window.updateMenuVisibility === 'function') {
                                window.updateMenuVisibility(menuData);
                            } else {
                                setTimeout(applyMenu, 50);
                            }
                        };
                        applyMenu();
                    }
                    
                    // 2. Determinar Arena do utilizador (tanto pela propriedade 'arena' quanto pela 'fame')
                    const userArenaField = userData.arena || '';
                    let userArenaNum = parseInt(userArenaField.replace(/\D/g, '')) || 0;
                    let userArenaName = userArenaField || 'Arena 1';
                    
                    // Backup: Calcular a arena a partir do valor de Fama, se necessário
                    const arenaDocSnap = await getDoc(doc(db, 'paineis', 'paineis arena'));
                    if (arenaDocSnap.exists()) {
                        const arenaData = arenaDocSnap.data();
                        const arenas = Object.keys(arenaData).map(key => ({
                            name: key, fama: arenaData[key].fama
                        })).sort((a, b) => a.fama - b.fama);
                        
                        const userFame = userData.fame || 0;
                        let currentUserArena = arenas[0];
                        for (let i = arenas.length - 1; i >= 0; i--) {
                            if (userFame >= arenas[i].fama) {
                                currentUserArena = arenas[i];
                                break;
                            }
                        }
                        
                        const calculatedArenaNum = parseInt(currentUserArena.name.replace(/\D/g, '')) || 1;
                        if (calculatedArenaNum > userArenaNum) {
                            userArenaNum = calculatedArenaNum;
                            userArenaName = currentUserArena.name;
                        }
                    }

                    // 3. Regra de Segurança: Só entra quem estiver na Arena 4 ou superior
                    if (userArenaNum < 4) {
                        window.location.replace('1x.html');
                        return;
                    }

                    // Mostrar o badge da arena do utilizador
                    document.getElementById('arena-name-display').textContent = userArenaName;
                    document.getElementById('user-arena-badge').style.display = 'inline-flex';

                    // 4. Iniciar processamento e análise dos últimos 5 jogos das equipas
                    document.getElementById('loading-text').textContent = "A analisar a forma recente e estatísticas das equipas...";
                    await loadAndSyncInvestments(userArenaName);

                } catch (err) {
                    console.error("Erro ao validar acesso do utilizador:", err);
                    window.location.replace('1x.html');
                }
            } else {
                window.location.replace('index.html');
            }
        });

        // Carrega os investimentos e sincroniza os últimos jogos das equipas
        async function loadAndSyncInvestments(userArenaName) {
            const grid = document.getElementById('investments-grid');
            grid.innerHTML = '';
            
            try {
                const querySnapshot = await getDocs(collection(db, 'clubes'));
                const allClubs = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                // Filtrar os clubes aptos para a arena do utilizador
                const matchingClubs = allClubs.filter(clube => {
                    return clube.investimentos && 
                           Array.isArray(clube.investimentos) && 
                           clube.investimentos.length > 0 && 
                           clube.investimentos[0].status === true && 
                           clube.investimentos[0].arena === userArenaName;
                });

                if (matchingClubs.length === 0) {
                    grid.innerHTML = `
                        <div class="no-investments">
                            <i class="fas fa-folder-open"></i>
                            <p>De momento não existem equipas registadas com investimentos ativos na tua arena (${userArenaName}).</p>
                        </div>
                    `;
                    hideLoading();
                    return;
                }

                // Sincronizar e carregar os últimos 5 jogos para cada clube correspondente
                for (let i = 0; i < matchingClubs.length; i++) {
                    const clube = matchingClubs[i];
                    document.getElementById('loading-text').textContent = `A obter jogos recentes de: ${clube.nome} (${i + 1}/${matchingClubs.length})`;
                    
                    const jogosRecentes = await syncClubMatches(clube);
                    const trend = calculateTrend(clube.nome, jogosRecentes);
                    
                    // Renderizar o card do clube com o seu gráfico de tendência
                    const card = document.createElement('div');
                    const gradClass = `card-grad-${i % 6}`;
                    card.className = `investment-card ${gradClass}`;
                    
                    // Gerar lista HTML dos últimos jogos
                    let gamesListHTML = '';
                    jogosRecentes.forEach(jogo => {
                        const isHome = jogo.equipa1 === clube.nome;
                        const resultStatus = getResultStatus(clube.nome, jogo);
                        const statusClass = resultStatus === 'V' ? 'win' : (resultStatus === 'E' ? 'draw' : 'loss');
                        
                        gamesListHTML += `
                            <li class="game-row">
                                <div class="game-teams">${jogo.equipa1} vs ${jogo.equipa2}</div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="game-date">${jogo.dataJogo}</span>
                                    <span class="game-score-badge ${statusClass}">${jogo.resultado} (${resultStatus})</span>
                                </div>
                            </li>
                        `;
                    });

                    // Construção do Sparkline SVG com base na tendência
                    const isPositive = trend.isPositive;
                    const pathD = isPositive 
                        ? "M 5 30 L 25 25 L 45 22 L 65 15 L 85 8 L 95 5" 
                        : "M 5 5 L 25 10 L 45 15 L 65 22 L 85 28 L 95 32";
                    const strokeColor = isPositive ? "#10b981" : "#ef4444";
                    const glowColor = isPositive ? "rgba(16, 185, 129, 0.4)" : "rgba(239, 68, 68, 0.4)";
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <img src="${clube.imagem || 'https://via.placeholder.com/80'}" alt="${clube.nome}" class="club-emblem">
                            <div class="club-title-info">
                                <h2 class="club-name">${clube.nome}</h2>
                                <div class="club-meta">
                                    <span><i class="fas fa-globe"></i> ${clube.pais || 'N/A'}</span>
                                    <span><i class="fas fa-venus-mars"></i> ${clube.genero || 'Masculino'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="trend-section">
                            <div class="trend-info">
                                <span class="trend-label">Tendência Recente</span>
                                <span class="trend-status ${isPositive ? 'up' : 'down'}">
                                    <i class="fas ${isPositive ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'}"></i>
                                    ${isPositive ? 'Positiva' : 'Negativa'}
                                </span>
                            </div>
                            <svg class="trend-sparkline">
                                <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0px 2px 4px ${glowColor})"/>
                            </svg>
                        </div>

                        <div class="recent-games-container">
                            <span class="recent-games-title">Últimos 5 Jogos</span>
                            <ul class="games-list">
                                ${gamesListHTML}
                            </ul>
                        </div>

                        <span class="active-badge" style="margin-top: 20px;">Investimento Ativo</span>
                    `;
                    
                    grid.appendChild(card);
                }

            } catch (error) {
                console.error("Erro ao carregar dados de investimentos:", error);
                grid.innerHTML = `
                    <div class="no-investments" style="border: 1px solid rgba(239, 68, 68, 0.2);">
                        <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                        <p>Ocorreu um erro ao carregar os investimentos. Por favor, tenta novamente.</p>
                    </div>
                `;
            } finally {
                hideLoading();
            }
        }

        // Normaliza nomes de equipas para comparação (sem acentos, sem maiúsculas, sem prefixos tipo NK, FC)
        function normalizeTeamName(name) {
            if (!name) return '';
            return name.toLowerCase()
                       .normalize("NFD")
                       .replace(/[\u0300-\u036f]/g, "")
                       .replace(/\b(nk|fc|fk|ac|cf|ud|cd|sc|sl|rc|club|de|clube|esporte|sporting|sport|atletico|real)\b/gi, '')
                       .replace(/[^a-z0-9]/g, '')
                       .trim();
        }

        // Verifica se dois nomes correspondem ao mesmo clube
        function isSameTeam(name1, name2) {
            const n1 = normalizeTeamName(name1);
            const n2 = normalizeTeamName(name2);
            if (!n1 || !n2) return false;
            return n1 === n2 || n1.includes(n2) || n2.includes(n1);
        }

        // Gera URL provável do worldfootball.net a partir do nome da equipa
        function generateWorldFootballUrl(clubeNome) {
            const norm = clubeNome.toLowerCase()
                                   .normalize("NFD")
                                   .replace(/[\u0300-\u036f]/g, "")
                                   .replace(/[^a-z0-9\s-]/g, '')
                                   .trim()
                                   .replace(/\s+/g, '-');
            return `https://www.worldfootball.net/teams/${norm}/3/`;
        }

        // Auxiliar: Extrai os jogos de um documento HTML do worldfootball.net
        function extractWorldFootballMatches(doc, clubeNome) {
            const matches = [];
            const rows = doc.querySelectorAll('table.standard_tabelle tr');
            window.logDebug(`[worldfootball Parser] A analisar ${rows.length} linhas de jogos.`);
            
            for (const row of rows) {
                const tds = Array.from(row.querySelectorAll('td'));
                if (tds.length < 6) continue;
                
                const dateText = tds[0].textContent.trim();
                // O formato da data no worldfootball.net é DD.MM.YYYY
                if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dateText)) {
                    continue;
                }
                
                const ha = tds[2]?.textContent.trim(); // "H" ou "A"
                // Oponente está geralmente na 5ª célula (index 4)
                const opponentLink = tds[4]?.querySelector('a') || tds[4];
                const opponentName = opponentLink?.textContent.trim() || '';
                
                // Procurar resultado/placar (ex: "2:2 (1:2)")
                // O placar costuma estar na 7ª célula (index 6) ou 6ª célula (index 5)
                let scoreText = '';
                let scoreTd = tds[6] || tds[5];
                if (scoreTd) {
                    scoreText = scoreTd.textContent.trim();
                }
                
                // Procurar padrão de placar X:Y nos tds se não encontrado
                if (!scoreText || !scoreText.includes(':')) {
                    for (const td of tds) {
                        const text = td.textContent.trim();
                        if (/\d+:\d+/.test(text)) {
                            scoreText = text;
                            break;
                        }
                    }
                }
                
                const scoreMatch = scoreText.match(/(\d+):(\d+)/);
                if (!scoreMatch) continue;
                const scoreFormatted = `${scoreMatch[1]}-${scoreMatch[2]}`;
                const dateFormatted = dateText.replace(/\./g, '/');
                
                if (opponentName.length > 1) {
                    let team1 = '';
                    let team2 = '';
                    
                    if (ha === 'H') {
                        team1 = clubeNome;
                        team2 = opponentName;
                    } else {
                        team1 = opponentName;
                        team2 = clubeNome;
                    }
                    
                    const isDuplicate = matches.some(m => m.dataJogo === dateFormatted && m.resultado === scoreFormatted && m.equipa1 === team1);
                    if (!isDuplicate) {
                        matches.push({
                            equipa1: team1,
                            equipa2: team2,
                            dataJogo: dateFormatted,
                            resultado: scoreFormatted
                        });
                    }
                }
            }
            return matches;
        }

        async function fetchHTML(url, validationText = '') {
            window.logDebug(`Tentando obter HTML via Firebase corsProxy: ${url}`);
            try {
                const corsProxy = httpsCallable(functions, 'corsProxy');
                const result = await corsProxy({ url: url });
                if (result.data && result.data.html) {
                    window.logDebug("Sucesso ao carregar via Firebase corsProxy!");
                    return result.data.html;
                }
                throw new Error("Resposta sem conteúdo HTML");
            } catch (e) {
                window.logDebug(`Erro no Firebase corsProxy: ${e.message}. Tentando proxies públicos de fallback...`, true);
                
                const checkOK = (text) => {
                    if (!text) return false;
                    const lower = text.toLowerCase();
                    if (lower.includes("cloudflare") || 
                        lower.includes("access denied") || 
                        lower.includes("just a moment") || 
                        lower.includes("attention required") ||
                        lower.includes("challenge-platform")) {
                        return false;
                    }
                    if (validationText && !text.includes(validationText)) {
                        return false;
                    }
                    return true;
                };

                // Fallback 1: corsproxy.io (direto)
                try {
                    window.logDebug(`[Fallback] Tentando corsproxy.io (direto) para: ${url}`);
                    const response = await fetch(`https://corsproxy.io/?${url}`);
                    if (response.ok) {
                        const text = await response.text();
                        if (checkOK(text)) return text;
                    }
                } catch (err) {}

                // Fallback 2: api.allorigins.win (/get)
                try {
                    window.logDebug(`[Fallback] Tentando api.allorigins.win (/get) para: ${url}`);
                    const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.contents && checkOK(data.contents)) return data.contents;
                    }
                } catch (err) {}

                throw new Error("Não foi possível carregar a URL por nenhum método (CORS Proxy bloqueado).");
            }
        }

        // Raspa os últimos jogos da equipa diretamente        async function scrapeWorldFootballMatches(clubeNome, genero) {
            window.logDebug(`[worldfootball Scraper] Iniciando scraping para: ${clubeNome}`);
            try {
                const parser = new DOMParser();
                let teamUrl = generateWorldFootballUrl(clubeNome);
                let htmlText = "";
                let matches = [];
 
                // 1. Tentar URL construída diretamente
                window.logDebug(`[worldfootball Scraper] Tentando aceder diretamente a: ${teamUrl}`);
                try {
                    htmlText = await fetchHTML(teamUrl, 'standard_tabelle');
                } catch (e) {
                    window.logDebug(`[worldfootball Scraper] URL direta falhou ou foi bloqueada: ${e.message}`, true);
                }

                // 1b. Fallback: Tentar Google Cache para a URL direta
                if (!htmlText) {
                    try {
                        const cacheUrl = `https://webcache.googleusercontent.com/search?q=cache:${teamUrl}`;
                        window.logDebug(`[worldfootball Scraper] Tentando aceder via Google Cache: ${cacheUrl}`);
                        htmlText = await fetchHTML(cacheUrl, 'standard_tabelle');
                    } catch (e) {
                        window.logDebug(`[worldfootball Scraper] Google Cache para URL direta falhou: ${e.message}`, true);
                    }
                }

                if (htmlText) {
                    const teamDoc = parser.parseFromString(htmlText, 'text/html');
                    matches = extractWorldFootballMatches(teamDoc, clubeNome);
                    if (matches && matches.length > 0) {
                        window.logDebug(`[worldfootball Scraper] Sucesso na consulta direta! ${matches.length} jogos encontrados.`);
                        return matches;
                    }
                }
 
                // 2. Fallback: DuckDuckGo search para encontrar a URL
                window.logDebug(`[worldfootball Scraper] Iniciando Fallback via DuckDuckGo...`);
                let searchName = clubeNome;
                if (genero === 'Feminino' && !searchName.toLowerCase().includes('women') && !searchName.toLowerCase().includes('feminino') && !searchName.toLowerCase().includes('(w)')) {
                    searchName += ' Women';
                }
                const queryStr = `${searchName} site:worldfootball.net/teams/`;
                let ddgUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(queryStr);
                
                let searchText = await fetchHTML(ddgUrl, 'uddg');
                const searchDoc = parser.parseFromString(searchText, 'text/html');
                
                const allLinks = searchDoc.querySelectorAll('a');
                const normClube = normalizeTeamName(clubeNome);
                teamUrl = '';
                
                for (const link of allLinks) {
                    let href = link.getAttribute('href') || link.href || '';
                    if (!href) continue;
                    
                    if (href.includes('uddg=')) {
                        const match = href.match(/uddg=([^&]+)/);
                        if (match) href = decodeURIComponent(match[1]);
                    }
                    
                    if (href.includes('worldfootball.net/teams/')) {
                        const text = link.textContent.trim();
                        const normLinkText = normalizeTeamName(text);
                        
                        if (normLinkText.includes(normClube) || normClube.includes(normLinkText) || href.toLowerCase().includes(normClube)) {
                            const baseMatch = href.match(/worldfootball\.net\/teams\/([^\/]+)/);
                            if (baseMatch) {
                                teamUrl = `https://www.worldfootball.net/teams/${baseMatch[1]}/3/`;
                                window.logDebug(`[worldfootball Scraper] DuckDuckGo encontrou: ${text} -> ${teamUrl}`);
                                break;
                            }
                        }
                    }
                }
                
                if (!teamUrl) {
                    window.logDebug(`[worldfootball Scraper] Correspondência estrita no DDG falhou. Selecionando primeiro link de equipa...`, true);
                    for (const link of allLinks) {
                        let href = link.getAttribute('href') || link.href || '';
                        if (href.includes('uddg=')) {
                            const match = href.match(/uddg=([^&]+)/);
                            if (match) href = decodeURIComponent(match[1]);
                        }
                        
                        if (href.includes('worldfootball.net/teams/')) {
                            const baseMatch = href.match(/worldfootball\.net\/teams\/([^\/]+)/);
                            if (baseMatch) {
                                teamUrl = `https://www.worldfootball.net/teams/${baseMatch[1]}/3/`;
                                window.logDebug(`[worldfootball Scraper] DDG Fallback selecionou: ${teamUrl}`);
                                break;
                            }
                        }
                    }
                }
                
                if (!teamUrl) {
                    throw new Error("Página da equipa não encontrada no worldfootball.net.");
                }
 
                window.logDebug(`[worldfootball Scraper] A carregar perfil do fallback: ${teamUrl}`);
                htmlText = "";
                try {
                    htmlText = await fetchHTML(teamUrl, 'standard_tabelle');
                } catch (e) {
                    window.logDebug(`[worldfootball Scraper] Fallback direto falhou: ${e.message}`, true);
                }

                // Fallback do fallback: Tentar Google Cache para a URL do DuckDuckGo
                if (!htmlText) {
                    try {
                        const cacheUrl = `https://webcache.googleusercontent.com/search?q=cache:${teamUrl}`;
                        window.logDebug(`[worldfootball Scraper] Tentando Google Cache para Fallback: ${cacheUrl}`);
                        htmlText = await fetchHTML(cacheUrl, 'standard_tabelle');
                    } catch (e) {
                        window.logDebug(`[worldfootball Scraper] Google Cache para Fallback falhou: ${e.message}`, true);
                    }
                }

                if (htmlText) {
                    const teamDoc = parser.parseFromString(htmlText, 'text/html');
                    matches = extractWorldFootballMatches(teamDoc, clubeNome);
                    window.logDebug(`[worldfootball Scraper] Jogos extraídos da página final: ${matches.length}`);
                    return matches;
                }
                throw new Error("Não foi possível carregar a página da equipa por nenhuma via.");
            } catch (err) {
                window.logDebug(`[worldfootball Scraper] Erro geral: ${err.message}`, true);
                return null;
            }
        }

        // Sincroniza e obtém os últimos 5 jogos do clube (grava no Firestore)
        async function syncClubMatches(clube) {
            window.logDebug(`[SyncMatches] Sincronizando: ${clube.nome}`);
            let existingGames = [];
            const jogosColRef = collection(db, 'clubes', clube.id, 'Jogos');
            
            try {
                const snapshot = await getDocs(jogosColRef);
                existingGames = snapshot.docs.map(doc => doc.data());
                window.logDebug(`[SyncMatches] Encontrados ${existingGames.length} jogos locais no Firestore para ${clube.nome}`);
            } catch (err) {
                window.logDebug(`[SyncMatches] Sem permissões de leitura ou erro ao ler do Firestore para ${clube.nome}: ${err.message}`, true);
            }

            // Ordena os existentes por data (do mais recente para o mais antigo)
            existingGames.sort((a, b) => new Date(b.dataJogo.split('/').reverse().join('-')) - new Date(a.dataJogo.split('/').reverse().join('-')));

            // Se tiver menos de 5 jogos, tentamos obter os resultados oficiais reais do worldfootball.net
            if (existingGames.length < 5) {
                window.logDebug(`[SyncMatches] Menos de 5 jogos locais (${existingGames.length}). Buscando jogos online...`);
                let officialGames = await scrapeWorldFootballMatches(clube.nome, clube.genero);
                
                if ((!officialGames || officialGames.length === 0) && clube.nome_en && clube.nome_en !== clube.nome) {
                    window.logDebug(`[SyncMatches] Falhou com '${clube.nome}'. Tentando nome em inglês '${clube.nome_en}'`);
                    officialGames = await scrapeWorldFootballMatches(clube.nome_en, clube.genero);
                }

                if (officialGames && officialGames.length > 0) {
                    window.logDebug(`[SyncMatches] Jogos oficiais obtidos da internet: ${officialGames.length}. Integrando e removendo duplicados...`);
                    const mergedGames = [...existingGames];
                    
                    for (const game of officialGames) {
                        const matchId = `${game.equipa1.replace(/\s+/g, '')}_${game.equipa2.replace(/\s+/g, '')}_${game.dataJogo.replace(/\//g, '')}`;
                        
                        // Verifica duplicidade usando comparação inteligente
                        const exists = mergedGames.some(eg => 
                            isSameTeam(eg.equipa1, game.equipa1) && 
                            isSameTeam(eg.equipa2, game.equipa2) && 
                            eg.dataJogo === game.dataJogo
                        );
                        
                        if (!exists) {
                            try {
                                await setDoc(doc(db, 'clubes', clube.id, 'Jogos', matchId), game);
                                window.logDebug(`[SyncMatches] Novo jogo gravado no Firestore: ${matchId}`);
                            } catch (err) {
                                window.logDebug(`[SyncMatches] Sem permissões de escrita no Firestore para gravar o jogo ${matchId}: ${err.message}`, true);
                            }
                            mergedGames.push(game);
                        } else {
                            window.logDebug(`[SyncMatches] Jogo já existia na lista local (pulado): ${game.equipa1} vs ${game.equipa2}`);
                        }
                    }
                    existingGames = mergedGames;
                } else {
                    window.logDebug(`[SyncMatches] Não foi possível obter nenhum jogo oficial online para ${clube.nome}`, true);
                }
                
                // Re-ordenar após junção
                existingGames.sort((a, b) => new Date(b.dataJogo.split('/').reverse().join('-')) - new Date(a.dataJogo.split('/').reverse().join('-')));
            }

            window.logDebug(`[SyncMatches] Retornando ${existingGames.length} jogos totais para ${clube.nome}`);
            // Devolver apenas os últimos 5 jogos
            return existingGames.slice(0, 5);
        }

        // Calcula a tendência do clube nos últimos 5 jogos
        function calculateTrend(clubeNome, jogos) {
            let score = 0;
            jogos.forEach(jogo => {
                const status = getResultStatus(clubeNome, jogo);
                if (status === 'V') score += 3;
                else if (status === 'E') score += 1;
            });
            
            return {
                points: score,
                isPositive: score >= 7
            };
        }

        // Auxiliar: Determina se o clube Venceu (V), Empatou (E) ou Derrotou (D) num jogo específico
        function getResultStatus(clubeNome, jogo) {
            const [g1, g2] = jogo.resultado.split('-').map(Number);
            const isHome = isSameTeam(jogo.equipa1, clubeNome);
            
            if (g1 === g2) return 'E';
            if (isHome) {
                return g1 > g2 ? 'V' : 'D';
            } else {
                return g2 > g1 ? 'V' : 'D';
            }
        }

        function hideLoading() {
            const loading = document.getElementById('loading-screen');
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => loading.style.display = 'none', 500);
            }
        }

        // Event listener para limpar a cache de jogos no Firestore
        document.getElementById('btn-clear-cache')?.addEventListener('click', async () => {
            if (confirm("Tens a certeza que queres limpar a cache de jogos no Firestore? Isto irá apagar os jogos locais guardados no Firebase e forçar o novo scraper corrigido a rodar de imediato.")) {
                window.logDebug("A iniciar limpeza de cache de jogos no Firestore...");
                try {
                    const querySnapshot = await getDocs(collection(db, 'clubes'));
                    let count = 0;
                    for (const clubDoc of querySnapshot.docs) {
                        const jogosSnapshot = await getDocs(collection(db, 'clubes', clubDoc.id, 'Jogos'));
                        for (const jogoDoc of jogosSnapshot.docs) {
                            await deleteDoc(doc(db, 'clubes', clubDoc.id, 'Jogos', jogoDoc.id));
                            count++;
                        }
                    }
                    window.logDebug(`Limpeza concluída! ${count} jogos eliminados. A recarregar página para re-scraping...`);
                    setTimeout(() => window.location.reload(), 1500);
                } catch (e) {
                    window.logDebug("Erro ao limpar cache: " + e.message, true);
                }
            }
        });
