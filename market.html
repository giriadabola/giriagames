<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado - Ggames</title>
        <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTl6Ljabwgx-VXdZz8FcAoygQprujSsCoXc32Y_iU0FjYVPu1B6MffWwp8gcCVuV8TWn39FRk9OIe1nc-esubVJYmdLsTptAoR9GyqNuw4R5MBaeaoWXTc3JaqH2YVNtEmfReQqohvQKvHiI0XwE5na2ty2B9Bt4oELxYv2BaZ7R3UmeylpiVEiIbiLnCB/s320/soccer-ball-png.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.8.0/styles/webawesome.css" />
    <script type="module" src="https://ka-f.webawesome.com/webawesome@3.8.0/webawesome.loader.js"></script>
    <link rel="stylesheet" href="market/market.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-percentage">0%</div>
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- Popup Overlay para Detalhes do Jogador -->
    <div class="popup-overlay" id="playerPopup">
        <div class="popup-content" style="position: relative;">
            <span class="close-btn" id="closePlayerPopup" style="position: absolute; top: 12px; right: 18px; font-size: 24px; cursor: pointer; color: #8892b0; font-weight: bold; z-index: 10;">&times;</span>
            <div class="popup-header">
                <img src="" alt="" class="popup-player-image" id="popupPlayerImage">
                <img src="" alt="" class="popup-country-flag" id="popupCountryFlag">
                <div class="popup-player-name" id="popupPlayerName"></div>
                <div class="popup-player-club" id="popupPlayerClub"></div>
            </div>
            <div class="popup-stats">
                <div class="popup-stat-row">
                    <div class="popup-stat-label">Overall</div>
                    <div class="popup-stat-value" id="popupPlayerOverall"></div>
                </div>
                <div class="popup-stat-row">
                    <div class="popup-stat-label">Preço</div>
                    <div class="popup-stat-value" id="popupPlayerPrice"></div>
                </div>
                <div class="popup-stat-row">
                    <div class="popup-stat-label">Posição</div>
                    <div class="popup-stat-value" id="popupPlayerPosicao"></div>
                </div>
                <div class="popup-stat-row">
                    <div class="popup-stat-label">Casta</div>
                    <div class="popup-stat-value" id="popupPlayerCasta"></div>
                </div>
                 <!-- Messages will be inserted here by JS -->
            </div>
            <div class="popup-buttons">
                <button class="popup-button buy" id="popupBuyButton">Comprar</button>
                <button class="popup-button history" id="popupHistoryButton" style="display: none; background-color: #2b3947; color: white; text-align: center; border: none;">Histórico</button>
            </div>
        </div>
    </div>

    <!-- Popup para Histórico do Jogador -->
    <div class="popup-overlay" id="historyPopup" style="z-index: 2100;">
        <div class="popup-content" style="max-width: 400px; position: relative; padding: 25px; border-radius: 12px; background: #161b26; border: 1px solid rgba(255,255,255,0.1); color: white;">
            <span class="close-btn" id="closeHistoryPopup" style="position: absolute; top: 12px; right: 18px; font-size: 24px; cursor: pointer; color: #8892b0; font-weight: bold;">&times;</span>
            <h2 style="text-align: center; margin-bottom: 20px; color: white; font-family: 'Poppins', sans-serif; font-size: 1.1rem;">Histórico de Movimentos</h2>
            <div id="playerHistoryList" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <p style="text-align: center; color: #8892b0;">A carregar histórico...</p>
            </div>
        </div>
    </div>

    <!-- Popup para ver as próximas janelas de transferências -->
    <div class="popup-overlay" id="schedulesPopup">
        <div class="popup-content">
            <h2 style="text-align: center; margin-bottom: 20px;">Próximas Aberturas</h2>
            <div id="upcomingSchedulesList" style="max-height: 300px; overflow-y: auto;">
                <!-- A lista será preenchida pelo JavaScript -->
            </div>
            <div class="popup-buttons" style="margin-top: 20px;">
                <button class="popup-button exit" id="closeSchedulesPopup">Fechar</button>
            </div>
        </div>
    </div>

  <div class="content">
    
    <!-- Este é o nosso contentor principal com Flexbox e classes CSS -->
    <div class="header-container">
        
        <!-- Elemento da Esquerda -->
        <div class="title-section">
            <h1 class="market-title">Mercado</h1>
        </div>

        <!-- Contentor para agrupar os elementos da Direita -->
        <div class="header-right-controls">
            <!-- Cronómetro -->
            <div id="countdown-container" class="pickcard-style" style="display: none; cursor: pointer;">
                <i class="fas fa-hourglass-start"></i>
                <div>
                    <div id="countdown-label">Próxima Janela Abre Em:</div>
                    <div id="countdown-timer">--:--:--:--</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de Filtros e Controlos -->
    <div class="filters-row">
        <div class="filters-left">
            <!-- Barra de Pesquisa Compacta e Expansível -->
            <div class="search-toggle-container">
                <button id="search-toggle-btn" class="search-toggle-btn-icon"><i class="fas fa-search"></i></button>
                <input type="text" id="player-search" class="search-input-hidden" placeholder="Procurar jogador...">
            </div>
            
            <div class="select-wrapper">
                <select id="country-filter">
                    <option value="">Todas</option>
                </select>
            </div>

            <div class="select-wrapper">
                <select id="sort-filter">
                    <option value="overall-desc">Ordenar: Overall</option>
                    <option value="price-asc">Preço: Mais Baixo</option>
                    <option value="price-desc">Preço: Mais Alto</option>
                    <option value="name-asc">Nome: A-Z</option>
                </select>
            </div>

            <button id="clear-filters-btn" class="clear-filters-btn" title="Limpar filtros" aria-label="Limpar filtros">
                <i class="fas fa-trash-can" aria-hidden="true"></i>
            </button>
        </div>

        <div class="filters-right">
            <div class="view-mode-container" role="group" aria-label="Modo de visualização">
                <button id="view-mode-grid" class="view-mode-btn active" title="Visualização em Grelha" aria-label="Visualização em grelha">
                    <i class="fas fa-th-large"></i>
                </button>
                <button id="view-mode-list" class="view-mode-btn" title="Visualização em Lista" aria-label="Visualização em lista">
                    <i class="fas fa-list"></i>
                </button>
            </div>

            <label class="availability-toggle" aria-label="Filtrar por disponibilidade">
                <input type="checkbox" id="available-only-toggle">
                <span class="availability-toggle-track">
                    <span class="availability-toggle-option availability-all">Todos</span>
                    <span class="availability-toggle-option availability-available">Aptos</span>
                    <span class="availability-toggle-thumb" aria-hidden="true"></span>
                </span>
            </label>

            <button id="toggleAllSections" class="toggle-all-button active">
              <span class="toggle-open">Abre</span>
              <span class="toggle-close active">Fecha</span>
            </button>
        </div>
    </div>

        <div class="market-section" id="guarda-redes-section">
            <h2 class="section-title collapsed"><wa-icon name="mitten"></wa-icon> GUARDA-REDES</h2>
            <div class="players-grid collapsed" id="guarda-redes-grid"></div>
        </div>

        <div class="market-section" id="defesas-section">
            <h2 class="section-title collapsed"><wa-icon name="shield"></wa-icon> DEFESAS</h2>
            <div class="players-grid collapsed" id="defesas-grid"></div>
        </div>

        <div class="market-section" id="medios-section">
            <h2 class="section-title collapsed"><wa-icon name="puzzle-piece"></wa-icon> MÉDIOS</h2>
            <div class="players-grid collapsed" id="medios-grid"></div>
        </div>

        <div class="market-section" id="avancados-section">
            <h2 class="section-title collapsed"><wa-icon name="bullseye"></wa-icon> AVANÇADOS</h2>
            <div class="players-grid collapsed" id="avancados-grid"></div>
        </div>
        <!-- Message for no players will be added here by JS -->
    </div>


    <script src="config.js"></script>
    <script type="module" src="market/market.js"></script>
    <script src="core/menu-component.js"></script> 
    <script src="core/top-bar-component.js" type="module"></script>
</body>
</html>
